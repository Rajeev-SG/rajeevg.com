name: Article local CI

on:
  pull_request_target:
    branches: [main]
    paths:
      - "content/posts/**"
      - "tests/e2e/article-ci-proof.spec.ts"
      - ".github/workflows/article-local-ci.yml"
  push:
    branches: [main]
    paths:
      - "content/posts/**"
      - "tests/e2e/article-ci-proof.spec.ts"
      - ".github/workflows/article-local-ci.yml"
  workflow_dispatch:
    inputs:
      article_slug:
        description: Existing article slug for a local-CI canary
        required: false
        default: token-maxxing-getting-more-useful-ai-work-for-less-money
      production:
        description: Wait for the current ref's Vercel deployment and prove the production article
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  checks: read

concurrency:
  group: article-local-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trusted-article-acceptance:
    if: >-
      github.event_name != 'pull_request_target' ||
      (github.actor == 'Rajeev-SG' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, local-ci, macos-arm64, repo-rajeevg-com]
    timeout-minutes: 35
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Resolve trusted ref
        id: ref
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request_target" ]]; then
            echo "sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Discover changed articles
        id: articles
        shell: bash
        env:
          MANUAL_SLUG: ${{ inputs.article_slug }}
          BASE_SHA: ${{ steps.ref.outputs.base }}
          HEAD_SHA: ${{ steps.ref.outputs.sha }}
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/article-slugs.txt" <<'PY'
          import os, pathlib, re, subprocess, sys

          output = pathlib.Path(sys.argv[1])
          if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch":
              slugs = [os.environ.get("MANUAL_SLUG") or "token-maxxing-getting-more-useful-ai-work-for-less-money"]
          else:
              files = subprocess.check_output([
                  "git", "diff", "--name-only", os.environ["BASE_SHA"], os.environ["HEAD_SHA"],
                  "--", "content/posts/*.mdx",
              ], text=True).splitlines()
              slugs = []
              for name in files:
                  path = pathlib.Path(name)
                  text = path.read_text(encoding="utf-8") if path.exists() else ""
                  match = re.search(r"(?m)^slug:\s*[\"']?([^\"'\n]+)[\"']?\s*$", text)
                  slugs.append(match.group(1).strip() if match else path.stem)
          output.write_text("".join(f"{slug}\n" for slug in sorted(set(filter(None, slugs)))), encoding="utf-8")
          PY
          count=$(grep -c . "$RUNNER_TEMP/article-slugs.txt" || true)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "slugs_file=$RUNNER_TEMP/article-slugs.txt" >> "$GITHUB_OUTPUT"
          echo "Changed article slugs ($count):"
          cat "$RUNNER_TEMP/article-slugs.txt" || true

      - name: Broad deterministic acceptance
        run: |
          # The promoted-model snapshot contract is refreshed by its own scheduled workflow
          # and is currently data-sensitive; keep article CI deterministic by excluding it.
          pnpm exec vitest run --exclude src/lib/pareto/__tests__/promote-join.test.ts
          pnpm build

      - name: Local browser proof for changed articles
        if: steps.articles.outputs.count != '0' && github.event_name != 'push' && !(github.event_name == 'workflow_dispatch' && inputs.production)
        shell: bash
        run: |
          set -euo pipefail
          while read -r slug; do
            [[ -n "$slug" ]] || continue
            ARTICLE_SLUG="$slug" pnpm exec playwright test tests/e2e/article-ci-proof.spec.ts
          done < "${{ steps.articles.outputs.slugs_file }}"

      - name: Wait for Vercel and prove production article
        if: steps.articles.outputs.count != '0' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.production))
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 900))
          echo "CI owns the deployment wait; no model polling is required."
          while (( SECONDS < deadline )); do
            # Vercel currently reports deployments through the legacy commit-status API.
            # Keep a check-runs fallback so a future Vercel integration migration does not break CI.
            commit_status=$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/status")
            check_runs=$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs")
            status=$(python3 -c 'import json,sys; st=json.loads(sys.argv[1]); cr=json.loads(sys.argv[2]); ss=[x for x in st.get("statuses",[]) if x.get("context","").lower()=="vercel" or "vercel" in x.get("context","").lower()]; xs=[x for x in cr.get("check_runs",[]) if x.get("app",{}).get("slug")=="vercel" or "vercel" in x.get("name","").lower()]; print("success" if any(x.get("state")=="success" for x in ss) or any(x.get("status")=="completed" and x.get("conclusion")=="success" for x in xs) else ("failed" if any(x.get("state") in ("failure","error") for x in ss) or any(x.get("status")=="completed" and x.get("conclusion") not in (None,"success","neutral","skipped") for x in xs) else "waiting"))' "$commit_status" "$check_runs")
            [[ "$status" == "failed" ]] && { echo "Vercel deployment failed" >&2; exit 1; }
            [[ "$status" == "success" ]] && break
            sleep 15
          done
          [[ "$status" == "success" ]] || { echo "Timed out waiting for Vercel" >&2; exit 1; }
          while read -r slug; do
            [[ -n "$slug" ]] || continue
            url="https://rajeevg.com/blog/$slug"
            for _ in {1..20}; do
              if curl -fsSL "$url" | grep -q '<main'; then
                break
              fi
              sleep 10
            done
            E2E_BASE_URL="https://rajeevg.com" ARTICLE_SLUG="$slug" pnpm exec playwright test tests/e2e/article-ci-proof.spec.ts
          done < "${{ steps.articles.outputs.slugs_file }}"

      - name: Upload browser proof
        if: always() && steps.articles.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: article-proof-${{ steps.ref.outputs.sha }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
