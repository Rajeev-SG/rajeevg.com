name: Refresh Pareto Frontier data

on:
  schedule:
    - cron: "17 5,17 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-pareto-frontier
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Refresh and validate snapshot
        run: pnpm pareto:refresh
        env:
          ARTIFICIAL_ANALYSIS_API_KEY_PF: ${{ secrets.ARTIFICIAL_ANALYSIS_API_KEY_PF }}
          PARETO_REFRESH_ENDPOINT: ${{ vars.PARETO_REFRESH_ENDPOINT }}
          PARETO_REFRESH_SECRET: ${{ secrets.PARETO_REFRESH_SECRET }}
      - name: Refresh outcome summary
        if: always()
        run: |
          echo "Refreshed snapshot delivered via Vercel Blob (no Git commit, no deployment)."
