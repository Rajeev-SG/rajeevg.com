name: Refresh Pareto Frontier data

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-pareto-frontier
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Refresh and validate snapshot
        run: pnpm pareto:refresh
        env:
          ARTIFICIAL_ANALYSIS_API_KEY_PF: ${{ secrets.ARTIFICIAL_ANALYSIS_API_KEY_PF }}
      - name: Commit validated changes
        run: |
          if git diff --quiet -- src/data/pareto-aa-fallback.json; then
            echo "Snapshot is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/pareto-aa-fallback.json
          git commit -m "chore(pareto): refresh validated model snapshot"
          git push origin HEAD:main
