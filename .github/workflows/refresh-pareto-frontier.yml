name: Refresh Pareto Frontier data

on:
  schedule:
    - cron: "17 5,17 * * *"
  workflow_dispatch:
    # Restrict manual AA-consuming refreshes to main so non-main refs cannot
    # bypass or fragment the daily AA request budget tracked in
    # .github/pareto-quota.json. Branch-specific refreshes should run their
    # own scoped check with mocked AA fixtures instead of live quota.
    branches: [main]

permissions:
  contents: write

concurrency:
  group: refresh-pareto-frontier
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Refresh and validate snapshot
        run: pnpm pareto:refresh
        env:
          ARTIFICIAL_ANALYSIS_API_KEY_PF: ${{ secrets.ARTIFICIAL_ANALYSIS_API_KEY_PF }}
      - name: Commit validated changes
        run: |
          if git diff --quiet -- src/data/pareto-aa-fallback.json .github/pareto-quota.json; then
            echo "Snapshot is unchanged."
            # Always push the quota counter even when the snapshot is unchanged,
            # so the daily budget persists across sequential manual dispatches.
            if ! git diff --quiet -- .github/pareto-quota.json; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add .github/pareto-quota.json
              git commit -m "chore(pareto): persist AA quota counter"
              git push origin HEAD:main
            fi
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/pareto-aa-fallback.json .github/pareto-quota.json
          git commit -m "chore(pareto): refresh validated model snapshot"
          git push origin HEAD:main
