name: Interfaces smoke

# Deploy-time proof that the Visual AI Lab is still reachable through
# /interfaces after a production deploy. The failure modes this catches are
# silent and user-facing: a broken SPA fallback on a deep link, an asset path
# that no longer resolves under the proxy base, and a lab that stopped being
# same-origin with this site (which would break the compare bench's clock
# bootstrap).
#
# The proof runs against the production alias, bound to the commit that was
# pushed: Vercel's deployment URLs sit behind deployment protection, and this
# site's Vercel scope is not administered from CI, so the immutable URL cannot
# be probed. /api/build-info (a hash of the deployed commit) is what ties the
# alias to the commit — the wait does not finish until the alias reports the
# hash of the pushed commit, and the hash is checked again after the proof so
# a deploy landing mid-run fails the workflow. If the push produced no
# production deployment at all, the workflow reports "skipped" instead of
# failing; a deployment that exists but never reaches the alias is a failure.

on:
  push:
    branches: [main]
    paths:
      - "next.config.ts"
      - "vercel.json"
      - "src/middleware.ts"
      - "src/lib/negotiable-paths.ts"
      - "src/lib/interfaces/lab-release.json"
      - "src/lib/__tests__/interfaces-route.test.ts"
      - "src/app/api/build-info/route.ts"
      - "src/app/sitemap.ts"
      - "src/components/site-chrome.tsx"
      - "tests/e2e/interfaces-smoke.spec.ts"
      - ".github/workflows/interfaces-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: interfaces-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interfaces-smoke:
    runs-on: [self-hosted, local-ci, macos-arm64, repo-rajeevg-com]
    timeout-minutes: 30
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the route configuration
        run: pnpm exec vitest run src/lib/__tests__/interfaces-route.test.ts

      - name: Wait for the production deployment of this commit
        id: deploy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Vercel builds a production deployment with VERCEL_GIT_COMMIT_SHA set
          # to the commit that was pushed, and the site's build hash is
          # sha256(VERCEL_GIT_COMMIT_SHA)[:16]. Matching the hash of the pushed
          # commit therefore proves which commit the alias is serving.
          expected=$(python3 -c 'import hashlib,sys; print(hashlib.sha256(sys.argv[1].encode()).hexdigest()[:16])' "$COMMIT_SHA")

          deploy_deadline=$((SECONDS + 900))
          deployment_id=""
          while (( SECONDS < deploy_deadline )); do
            deployment_id=$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/deployments?sha=$COMMIT_SHA&per_page=20" \
              | python3 -c 'import json,sys; ds=json.load(sys.stdin); print(next((str(d["id"]) for d in ds if d.get("environment")=="Production"), ""))' || true)
            [[ -n "$deployment_id" ]] && break
            sleep 15
          done
          if [[ -z "$deployment_id" ]]; then
            # The push produced no production deployment at all: there is
            # nothing to prove, and that is not a failure.
            echo "No production deployment for $COMMIT_SHA; nothing to prove."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          state=""
          while (( SECONDS < deploy_deadline )); do
            state=$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" \
              | python3 -c 'import json,sys; ss=json.load(sys.stdin); s=next((x for x in ss if x.get("state") in ("success","failure","error")), None); print("" if s is None else s.get("state",""))' || true)
            case "$state" in
              success) break ;;
              failure|error) echo "Vercel deployment failed" >&2; exit 1 ;;
            esac
            sleep 15
          done
          if [[ "$state" != "success" ]]; then
            echo "The deployment for $COMMIT_SHA never succeeded (last state: ${state:-unknown})." >&2
            exit 1
          fi

          # The deployment URL itself is behind Vercel's deployment protection,
          # and this site's Vercel scope cannot be administered from CI, so the
          # immutable URL cannot be probed. The proof therefore runs against
          # the production alias, bound to this commit by the build hash: the
          # wait does not finish until the alias reports the hash of the
          # commit that was pushed.
          alias_deadline=$((SECONDS + 600))
          observed=""
          while (( SECONDS < alias_deadline )); do
            observed=$(curl -fsSL --max-time 20 https://rajeevg.com/api/build-info 2>/dev/null \
              | python3 -c 'import json,sys; print(json.loads(sys.stdin.read() or "{}").get("build",""))' 2>/dev/null || true)
            if [[ "$observed" == "$expected" ]]; then
              echo "The alias is serving $COMMIT_SHA"
              echo "live=true" >> "$GITHUB_OUTPUT"
              echo "expected=$expected" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          # A deployment that exists but never reaches the alias is a failure,
          # not a skip: the route is either not deployed or serving another
          # commit.
          echo "The alias never started serving $COMMIT_SHA (expected $expected, saw ${observed:-nothing}) within 600s." >&2
          exit 1

      - name: Prove the lab through /interfaces
        if: steps.deploy.outputs.live == 'true'
        env:
          E2E_BASE_URL: https://rajeevg.com
          EXPECTED_BUILD_HASH: ${{ steps.deploy.outputs.expected }}
        run: pnpm exec playwright test tests/e2e/interfaces-smoke.spec.ts

      - name: Re-check the commit after the proof
        if: steps.deploy.outputs.live == 'true'
        shell: bash
        env:
          EXPECTED_BUILD_HASH: ${{ steps.deploy.outputs.expected }}
        run: |
          set -euo pipefail
          # The alias is mutable: a deploy that lands mid-proof would change
          # what was proved. The commit identity is checked again afterwards.
          observed=$(curl -fsSL --max-time 20 https://rajeevg.com/api/build-info 2>/dev/null \
            | python3 -c 'import json,sys; print(json.loads(sys.stdin.read() or "{}").get("build",""))' 2>/dev/null || true)
          if [[ "$observed" != "$EXPECTED_BUILD_HASH" ]]; then
            echo "The alias changed build during the proof (expected $EXPECTED_BUILD_HASH, saw ${observed:-nothing})." >&2
            exit 1
          fi
          echo "The alias still serves the commit that was proved."

      - name: Upload browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interfaces-smoke-${{ github.sha }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
