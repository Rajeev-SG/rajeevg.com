name: Interfaces smoke

# Deploy-time proof that the Visual AI Lab is still reachable through
# /interfaces after a production deploy. The failure modes this catches are
# silent and user-facing: a broken SPA fallback on a deep link, an asset path
# that no longer resolves under the proxy base, and a lab that stopped being
# same-origin with this site (which would break the compare bench's clock
# bootstrap).
#
# The proof runs against the production alias, but only once that alias
# reports the commit that was pushed: Vercel's deployment URLs sit behind
# deployment protection and cannot be probed, so /api/build-info (a hash of
# the deployed commit) is what ties the proof to the commit. If the push
# produced no production deployment at all, the workflow reports "skipped"
# instead of failing.

on:
  push:
    branches: [main]
    paths:
      - "next.config.ts"
      - "vercel.json"
      - "src/middleware.ts"
      - "src/lib/negotiable-paths.ts"
      - "src/lib/interfaces/lab-release.json"
      - "src/lib/__tests__/interfaces-route.test.ts"
      - "src/app/api/build-info/route.ts"
      - "src/app/sitemap.ts"
      - "src/components/site-chrome.tsx"
      - "tests/e2e/interfaces-smoke.spec.ts"
      - ".github/workflows/interfaces-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: interfaces-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interfaces-smoke:
    runs-on: [self-hosted, local-ci, macos-arm64, repo-rajeevg-com]
    timeout-minutes: 30
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the route configuration
        run: pnpm exec vitest run src/lib/__tests__/interfaces-route.test.ts

      - name: Wait for the production deployment of this commit
        id: deploy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 900))
          deployment_id=""
          while (( SECONDS < deadline )); do
            deployment_id=$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/deployments?sha=$GITHUB_SHA&per_page=20" \
              | python3 -c 'import json,sys; ds=json.load(sys.stdin); print(next((str(d["id"]) for d in ds if d.get("environment")=="Production"), ""))')
            [[ -n "$deployment_id" ]] && break
            sleep 15
          done
          if [[ -z "$deployment_id" ]]; then
            echo "No production deployment for $GITHUB_SHA; nothing to prove."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          while (( SECONDS < deadline )); do
            state=$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" \
              | python3 -c 'import json,sys; ss=json.load(sys.stdin); s=next((x for x in ss if x.get("state") in ("success","failure","error")), None); print("" if s is None else s.get("state",""))')
            case "$state" in
              success) break ;;
              failure|error) echo "Vercel deployment failed" >&2; exit 1 ;;
            esac
            sleep 15
          done
          [[ "$state" == "success" ]] || { echo "The deployment for $GITHUB_SHA never succeeded."; echo "skipped=true" >> "$GITHUB_OUTPUT"; exit 0; }

          # The deployment URL itself is behind Vercel's deployment protection,
          # so the proof runs against the production alias. The alias has to
          # name this commit: /api/build-info returns a hash of the deployed
          # commit, and the hash of $GITHUB_SHA is what the run expects.
          expected=$(python3 -c 'import hashlib,sys; print(hashlib.sha256(sys.argv[1].encode()).hexdigest()[:16])' "$GITHUB_SHA")
          while (( SECONDS < deadline )); do
            now=$(curl -fsSL https://rajeevg.com/api/build-info | python3 -c 'import json,sys; print(json.load(sys.stdin).get("build",""))' || true)
            if [[ "$now" == "$expected" ]]; then
              echo "The alias is serving $GITHUB_SHA"
              echo "live=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "The alias never started serving $GITHUB_SHA (saw ${now:-nothing})."
          echo "skipped=true" >> "$GITHUB_OUTPUT"

      - name: Prove the lab through /interfaces
        if: steps.deploy.outputs.live == 'true'
        run: E2E_BASE_URL=https://rajeevg.com pnpm exec playwright test tests/e2e/interfaces-smoke.spec.ts

      - name: Upload browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interfaces-smoke-${{ github.sha }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
