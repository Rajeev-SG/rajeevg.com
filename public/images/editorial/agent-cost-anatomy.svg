<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" role="img" aria-labelledby="t d">
<title id="t">One orchestration request, six named cost points</title><desc id="d">Each cost mechanism mapped to the specific fix that removes it, with solid arrows for cost surfaces and dashed arrows for repairs.</desc>
<defs><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#e7e2d5"/></pattern><marker id="arrowEnd" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 9 5 L 0 10 z" fill="#566174"/></marker></defs>
<rect width="1280" height="760" fill="#fbfaf5"/><rect width="1280" height="760" fill="url(#dots)" opacity=".6"/>
<text x="48" y="52" font-size="28" font-weight="700" fill="#172033" font-family="Georgia, serif">One orchestration request, six named cost points</text>
<text x="48" y="84" font-size="16" fill="#566174" font-family="Georgia, serif">Each cost has a specific repair. The figure exists so the reader can see the mapping, not memorise six things.</text>
<text x="470" y="118" font-size="13" font-weight="700" fill="#566174" font-family="Georgia, serif">WHERE IT SHOWS UP</text>
<text x="760" y="118" font-size="13" font-weight="700" fill="#3f8460" font-family="Georgia, serif">WHAT REMOVES IT</text>
<rect x="100" y="130" width="300" height="76" rx="12" fill="#dce8ff" stroke="#4f6fad" stroke-width="3"/><text x="116" y="156" font-size="15" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">1 · Context resend</text><text x="116" y="184" font-size="12" fill="#566174" font-family="Comic Sans MS, cursive">each hop re-reads what earlier hops paid for</text><line x1="404" y1="168" x2="466" y2="168" stroke="#566174" stroke-width="2" marker-end="url(#arrowEnd)"/><rect x="470" y="130" width="220" height="76" rx="12" fill="#ffffff" stroke="#566174" stroke-width="2"/><text x="486" y="174" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">more input tokens</text><line x1="696" y1="168" x2="756" y2="168" stroke="#566174" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowEnd)"/><rect x="760" y="130" width="330" height="76" rx="12" fill="#ffffff" stroke="#3f8460" stroke-width="2"/><text x="776" y="174" font-size="13" font-weight="600" fill="#3f8460" font-family="Comic Sans MS, cursive">bounded packets, task-scoped context</text><rect x="100" y="226" width="300" height="76" rx="12" fill="#fff0c9" stroke="#a97921" stroke-width="3"/><text x="116" y="252" font-size="15" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">2 · Oversight layer</text><text x="116" y="280" font-size="12" fill="#566174" font-family="Comic Sans MS, cursive">planning and review re-read the same material again</text><line x1="404" y1="264" x2="466" y2="264" stroke="#566174" stroke-width="2" marker-end="url(#arrowEnd)"/><rect x="470" y="226" width="220" height="76" rx="12" fill="#ffffff" stroke="#566174" stroke-width="2"/><text x="486" y="270" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">oversight &gt; work</text><line x1="696" y1="264" x2="756" y2="264" stroke="#566174" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowEnd)"/><rect x="760" y="226" width="330" height="76" rx="12" fill="#ffffff" stroke="#3f8460" stroke-width="2"/><text x="776" y="270" font-size="13" font-weight="600" fill="#3f8460" font-family="Comic Sans MS, cursive">delete layers that do not repay coordination</text><rect x="100" y="322" width="300" height="76" rx="12" fill="#ffe1de" stroke="#a45350" stroke-width="3"/><text x="116" y="348" font-size="15" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">3 · Retry culture</text><text x="116" y="376" font-size="12" fill="#566174" font-family="Comic Sans MS, cursive">small failures stack until a short task runs long</text><line x1="404" y1="360" x2="466" y2="360" stroke="#566174" stroke-width="2" marker-end="url(#arrowEnd)"/><rect x="470" y="322" width="220" height="76" rx="12" fill="#ffffff" stroke="#566174" stroke-width="2"/><text x="486" y="366" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">compounding wall time</text><line x1="696" y1="360" x2="756" y2="360" stroke="#566174" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowEnd)"/><rect x="760" y="322" width="330" height="76" rx="12" fill="#ffffff" stroke="#3f8460" stroke-width="2"/><text x="776" y="366" font-size="13" font-weight="600" fill="#3f8460" font-family="Comic Sans MS, cursive">stale-worker reaper and owner-checked release</text><rect x="100" y="418" width="300" height="76" rx="12" fill="#e9e1ff" stroke="#7459a8" stroke-width="3"/><text x="116" y="444" font-size="15" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">4 · Tool-output bloat</text><text x="116" y="472" font-size="12" fill="#566174" font-family="Comic Sans MS, cursive">machine output nobody reads is carried every turn</text><line x1="404" y1="456" x2="466" y2="456" stroke="#566174" stroke-width="2" marker-end="url(#arrowEnd)"/><rect x="470" y="418" width="220" height="76" rx="12" fill="#ffffff" stroke="#566174" stroke-width="2"/><text x="486" y="462" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">~60% of the heaviest transcript</text><line x1="696" y1="456" x2="756" y2="456" stroke="#566174" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowEnd)"/><rect x="760" y="418" width="330" height="76" rx="12" fill="#ffffff" stroke="#3f8460" stroke-width="2"/><text x="776" y="462" font-size="13" font-weight="600" fill="#3f8460" font-family="Comic Sans MS, cursive">truncate what you would never read</text><rect x="100" y="514" width="300" height="76" rx="12" fill="#dce8ff" stroke="#4f6fad" stroke-width="3"/><text x="116" y="540" font-size="15" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">5 · Cumulative counters</text><text x="116" y="568" font-size="12" fill="#566174" font-family="Comic Sans MS, cursive">lifetime totals look like per-task bills until subtracted</text><line x1="404" y1="552" x2="466" y2="552" stroke="#566174" stroke-width="2" marker-end="url(#arrowEnd)"/><rect x="470" y="514" width="220" height="76" rx="12" fill="#ffffff" stroke="#566174" stroke-width="2"/><text x="486" y="558" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">double-counted dashboards</text><line x1="696" y1="552" x2="756" y2="552" stroke="#566174" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowEnd)"/><rect x="760" y="514" width="330" height="76" rx="12" fill="#ffffff" stroke="#3f8460" stroke-width="2"/><text x="776" y="558" font-size="13" font-weight="600" fill="#3f8460" font-family="Comic Sans MS, cursive">sum per-window counts by provider and session</text><rect x="100" y="610" width="300" height="76" rx="12" fill="#dcf3e5" stroke="#3f8460" stroke-width="3"/><text x="116" y="636" font-size="15" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">6 · Missing data as zero</text><text x="116" y="664" font-size="12" fill="#566174" font-family="Comic Sans MS, cursive">unpriced models render as £0 instead of unknown</text><line x1="404" y1="648" x2="466" y2="648" stroke="#566174" stroke-width="2" marker-end="url(#arrowEnd)"/><rect x="470" y="610" width="220" height="76" rx="12" fill="#ffffff" stroke="#566174" stroke-width="2"/><text x="486" y="654" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">false confidence</text><line x1="696" y1="648" x2="756" y2="648" stroke="#566174" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowEnd)"/><rect x="760" y="610" width="330" height="76" rx="12" fill="#ffffff" stroke="#3f8460" stroke-width="2"/><text x="776" y="654" font-size="13" font-weight="600" fill="#3f8460" font-family="Comic Sans MS, cursive">label unknowns explicitly, never render as zero</text>
<text x="640" y="740" text-anchor="middle" font-size="14" font-style="italic" fill="#566174" font-family="Georgia, serif">solid arrow = where the cost shows up · dashed arrow = the fix that removes it · Evidence date: 31 Aug 2026</text>
</svg>
