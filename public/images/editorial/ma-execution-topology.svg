<title id="t">The execution loop behind one rebuild</title><desc id="d">A supervisor that never edits, a workhorse in an isolated worktree, a read-only frontier review, and an independent acceptance gate.</desc>
<defs><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#e7e2d5"/></pattern><marker id="arrowEnd" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 9 5 L 0 10 z" fill="#566174"/></marker></defs>
<rect width="1280" height="720" fill="#fbfaf5"/><rect width="1280" height="720" fill="url(#dots)" opacity=".6"/>
<text x="48" y="52" font-size="28" font-weight="700" fill="#172033" font-family="Georgia, serif">The execution loop behind one rebuild</text>
<text x="48" y="84" font-size="16" fill="#566174" font-family="Georgia, serif">A supervisor that never edits, a workhorse in an isolated worktree, a read-only frontier review, and an independent acceptance gate.</text>
<rect x="60" y="150" width="280" height="130" rx="16" fill="#dce8ff" stroke="#4f6fad" stroke-width="3"/><text x="78" y="184" font-size="18" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">Sol supervisor (Codex)</text><text x="78" y="210" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">gpt-5.6-sol</text><text x="78" y="242" font-size="13" font-weight="700" fill="#4f6fad" font-family="Comic Sans MS, cursive">plans, contracts, accepts — edits nothing</text><rect x="500" y="150" width="280" height="130" rx="16" fill="#dcf3e5" stroke="#3f8460" stroke-width="3"/><text x="518" y="184" font-size="18" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">GLM implementation thread</text><text x="518" y="210" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">z-ai/glm-5.3-flash</text><text x="518" y="242" font-size="13" font-weight="700" fill="#3f8460" font-family="Comic Sans MS, cursive">writes inside worktree 18cc only</text><rect x="500" y="420" width="280" height="130" rx="16" fill="#e9e1ff" stroke="#7459a8" stroke-width="3"/><text x="518" y="454" font-size="18" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">Opus narrative review</text><text x="518" y="480" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">claude-opus-5 · OpenCode</text><text x="518" y="512" font-size="13" font-weight="700" fill="#7459a8" font-family="Comic Sans MS, cursive">read-only, no files touched</text><rect x="940" y="150" width="280" height="130" rx="16" fill="#fff0c9" stroke="#a97921" stroke-width="3"/><text x="958" y="184" font-size="18" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">Parent acceptance gate</text><text x="958" y="210" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">fresh supervisor eyes</text><text x="958" y="242" font-size="13" font-weight="700" fill="#a97921" font-family="Comic Sans MS, cursive">independent QA, then merge</text><path d="M 345 215 L 492 215" fill="none" stroke="#566174" stroke-width="2.5" marker-end="url(#arrowEnd)"/><text x="348" y="200" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">contract + runbook paths</text><path d="M 785 215 L 932 215" fill="none" stroke="#566174" stroke-width="2.5" marker-end="url(#arrowEnd)"/><text x="790" y="196" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">PR #31 · #33 · #35</text><path d="M 640 285 L 640 412" fill="none" stroke="#566174" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#arrowEnd)"/><text x="652" y="330" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">rendered articles out for review</text><path d="M 608 412 C 558 360, 558 340, 608 292" fill="none" stroke="#a45350" stroke-width="2.5" marker-end="url(#arrowEnd)"/><text x="336" y="368" font-size="13" fill="#a45350" font-family="Comic Sans MS, cursive">verdicts back — GLM amended</text><text x="958" y="330" font-size="13" fill="#a97921" font-family="Comic Sans MS, cursive">merge only after</text><text x="958" y="350" font-size="13" fill="#a97921" font-family="Comic Sans MS, cursive">independent pass</text><text x="60" y="620" font-size="14" fill="#566174" font-family="Comic Sans MS, cursive">Sessions: supervisor 01a04e0b…cb6 · GLM thread 01a04ecb…d58a · Opus ses_fb10c0ea…oBhd</text>
<text x="640" y="700" text-anchor="middle" font-size="14" font-style="italic" fill="#566174" font-family="Georgia, serif">No agent talks to another directly — every hop passes through the supervisor · Evidence date: 30 Aug 2026</text>
</svg>