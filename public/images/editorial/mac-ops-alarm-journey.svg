<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="jt jd">
<title id="jt">The alarm journey — and where it actually stalls</title><desc id="jd">Six steps every incident walks. Each one has a named stall point and a named bound.</desc>
<defs>
<pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#e7e2d5"/></pattern>
<filter id="wobble" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="11" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="0.85"/></filter>
<marker id="jArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 9 5 L 0 10 z" fill="#172033"/></marker>
</defs>
<rect width="1280" height="720" fill="#fbfaf5"/>
<rect width="1280" height="720" fill="url(#dots)" opacity=".68"/>
<text x="48" y="60" font-size="28" font-weight="700" fill="#172033" font-family="Georgia, serif">The alarm journey — and where it actually stalls</text>
<text x="48" y="92" font-size="16" fill="#566174" font-family="Georgia, serif">Six steps every incident walks. Each one has a named stall point and a named bound.</text>
<path d="M 60 165 C 380 160, 700 172, 1220 164" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#jArrow)" filter="url(#wobble)"/>
<g transform="rotate(-0.3 132.5 350)">
<rect x="40" y="210" width="185" height="280" rx="18" fill="#dce8ff" stroke="#4f6fad" stroke-width="3" filter="url(#wobble)"/>
<text x="132.5" y="246" text-anchor="middle" font-size="17" font-weight="700" fill="#172033" font-family="'Comic Sans MS','Bradley Hand',cursive">1 · Alarm fires</text>
<text x="54" y="278" font-size="11" font-weight="700" fill="#a45350" font-family="'Comic Sans MS','Bradley Hand',cursive">STALLS WHEN</text>
<text x="54" y="298" font-size="13" fill="#a45350" font-family="'Comic Sans MS','Bradley Hand',cursive">alert fatigue —</text>
<text x="54" y="317" font-size="13" fill="#a45350" font-family="'Comic Sans MS','Bradley Hand',cursive">everything looks urgent</text>
<text x="54" y="370" font-size="11" font-weight="700" fill="#3f8460" font-family="'Comic Sans MS','Bradley Hand',cursive">BOUND BY</text>
<text x="54" y="390" font-size="13" fill="#3f8460" font-family="'Comic Sans MS','Bradley Hand',cursive">one human channel ·</text>
<text x="54" y="409" font-size="13" fill="#3f8460" font-family="'Comic Sans MS','Bradley Hand',cursive">severity = blast radius</text>
</g>
<g transform="rotate(0.3 337.5 350)">
<rect x="245" y="210" width="185" height="280" rx="18" fill="#dcf3e5" stroke="#3f8460" stroke-width="3" filter="url(#wobble)"/>
<text x="337.5" y="246" text-anchor="middle" font-size="17" font-weight="700" fill="#172033" font-family="'Comic Sans MS','Bradley Hand',cursive">2 · Phone receives</text>
<text x="259" y="278" font-size="11" font-weight="700" fill="#a45350" font-family="'Comic Sans MS','Bradley Hand',cursive">STALLS WHEN</text>
<text x="259" y="298" font-size="13" fill="#a45350" font-family="'Comic Sans MS','Bradley Hand',cursive">the Mac is asleep, or</text>
<text x="259" y="317" font-size="13" fill="#a45350" font-family="'Comic Sans MS','Bradley Hand',cursive">the bot token rotated</text>
<text x="259" y="370" font-size="11" font-weight="700" fill="#3f8460" font-family="'Comic Sans MS','Bradley Hand',cursive">BOUND BY</text>
<text x="259" y="390" font-size="13" fill="#3f8460" font-family="'Comic Sans MS','Bradley Hand',cursive">launchd restarts the</text>
<text x="259" y="409" font-size="13" fill="#3f8460" font-family="'Comic Sans MS','Bradley Hand',cursive">keeper · outbound</text>
<text x="259" y="428" font-size="13" fill="#3f8460" font-family="'Comic Sans MS','Bradley Hand',cursive">long-poll needs no open</text>
<text x="259" y="447" font-size="13" fill="#3f8460" font-family="'Comic Sans MS','Bradley Hand',cursive">port</text>
</g>
<g transform="rotate(-0.3 542.5 350)">
<rect x="450" y="210" width="185" height="280" rx="18" fill="#e9e1ff" stroke="#7459a8" stroke-width="3" filter="url(#wobble)"/>
<text x="542.5" y="246" text-anchor="middle" font-size="17" font-weight="700" fill="#172033" font-family="'Comic Sans MS','Bradley Hand',cursive">3 · Board read</text>
<text x="464" y="278" font-size="11" font-weight="700" fill="#a45350" font-family="'Comic Sans MS','Bradley Hand',cursive">STALLS WHEN</text>
<text x="464" y="298" font-size="13" fill="#a45350" font-family="'Comic Sans MS','Bradley Hand',cursive">tailnet down, or a</text>
<text x="464" y="317" font-size="13" fill="#a45350" font-family="'Comic Sans MS','Bradley Hand',cursive">dashboard left public</text>
<text x="464" y="370" font-size="11" font-weight="700" fill="#3f8460" font-family="'Comic Sans MS','Bradley Hand',cursive">BOUND BY</text>
<text x="464" y="390" font-size="13" fill="#3f8460" font-family="'Comic Sans MS','Bradley Hand',cursive">the tailnet reconnects ·</text>
<text x="464" y="409" font-size="13" fill="#3f8460" font-family="'Comic Sans MS','Bradley Hand',cursive">loopback keeps the</text>
<text x="464" y="428" font-size="13" fill="#3f8460" font-family="'Comic Sans MS','Bradley Hand',cursive">mistake private</text>
</g>
<g transform="rotate(0.3 747.5 350)">
<rect x="655" y="210" width="185" height="280" rx="18" fill="#fff0c9" stroke="#a97921" stroke-width="3" filter="url(#wobble)"/>
<text x="747.5" y="246" text-anchor="middle" font-size="17" font-weight="700" fill="#172033" font-family="'Comic Sans MS','Bradley Hand',cursive">4 · Runbook matched</text>
<text x="669" y="278" font-size="11" font-weight="700" fill="#a45350" font-family="'Comic Sans MS','Bradley Hand',cursive">STALLS WHEN</text>
<text x="669" y="298" font-size="13" fill="#a45350" font-family="'Comic Sans MS','Bradley Hand',cursive">no runbook exists for</text>
<text x="669" y="317" font-size="13" fill="#a45350" font-family="'Comic Sans MS','Bradley Hand',cursive">this failure yet</text>
<text x="669" y="370" font-size="11" font-weight="700" fill="#3f8460" font-family="'Comic Sans MS','Bradley Hand',cursive">BOUND BY</text>
<text x="669" y="390" font-size="13" fill="#3f8460" font-family="'Comic Sans MS','Bradley Hand',cursive">write it during the</text>
<text x="669" y="409" font-size="13" fill="#3f8460" font-family="'Comic Sans MS','Bradley Hand',cursive">incident — once</text>
</g>
<g transform="rotate(-0.3 952.5 350)">
<rect x="860" y="210" width="185" height="280" rx="18" fill="#dce8ff" stroke="#4f6fad" stroke-width="3" filter="url(#wobble)"/>
<text x="952.5" y="246" text-anchor="middle" font-size="17" font-weight="700" fill="#172033" font-family="'Comic Sans MS','Bradley Hand',cursive">5 · Fix delegated</text>
<text x="874" y="278" font-size="11" font-weight="700" fill="#a45350" font-family="'Comic Sans MS','Bradley Hand',cursive">STALLS WHEN</text>
<text x="874" y="298" font-size="13" fill="#a45350" font-family="'Comic Sans MS','Bradley Hand',cursive">the agent lost scope or</text>
<text x="874" y="317" font-size="13" fill="#a45350" font-family="'Comic Sans MS','Bradley Hand',cursive">drowned in context</text>
<text x="874" y="370" font-size="11" font-weight="700" fill="#3f8460" font-family="'Comic Sans MS','Bradley Hand',cursive">BOUND BY</text>
<text x="874" y="390" font-size="13" fill="#3f8460" font-family="'Comic Sans MS','Bradley Hand',cursive">worktree + contract</text>
<text x="874" y="409" font-size="13" fill="#3f8460" font-family="'Comic Sans MS','Bradley Hand',cursive">bound the blast radius</text>
</g>
<g transform="rotate(0.3 1157.5 350)">
<rect x="1065" y="210" width="185" height="280" rx="18" fill="#dcf3e5" stroke="#3f8460" stroke-width="3" filter="url(#wobble)"/>
<text x="1157.5" y="246" text-anchor="middle" font-size="17" font-weight="700" fill="#172033" font-family="'Comic Sans MS','Bradley Hand',cursive">6 · Recovery confirmed</text>
<text x="1079" y="278" font-size="11" font-weight="700" fill="#a45350" font-family="'Comic Sans MS','Bradley Hand',cursive">STALLS WHEN</text>
<text x="1079" y="298" font-size="13" fill="#a45350" font-family="'Comic Sans MS','Bradley Hand',cursive">counters look green but</text>
<text x="1079" y="317" font-size="13" fill="#a45350" font-family="'Comic Sans MS','Bradley Hand',cursive">the cause is unfixed</text>
<text x="1079" y="370" font-size="11" font-weight="700" fill="#3f8460" font-family="'Comic Sans MS','Bradley Hand',cursive">BOUND BY</text>
<text x="1079" y="390" font-size="13" fill="#3f8460" font-family="'Comic Sans MS','Bradley Hand',cursive">check the telemetry, not</text>
<text x="1079" y="409" font-size="13" fill="#3f8460" font-family="'Comic Sans MS','Bradley Hand',cursive">the vibe</text>
</g>
<text x="640" y="660" text-anchor="middle" font-size="14" font-style="italic" fill="#566174" font-family="Georgia, serif">Every stage can stall; each stall has a named bound · conceptual model of how alarms fail, not a measured failure rate · Evidence date: 31 Aug 2026</text>
</svg>
