<text x="1190.9" y="683.0" font-size="12" text-anchor="start" fill="#a45350" font-family="Georgia, serif" font-style="italic">a screenshot ritual</text>
<text x="60" y="893" font-size="13" text-anchor="start" fill="#566174" font-family="Georgia, serif">Solid = the machine path. Dashed amber = the only places a person must decide. Dashed rose = the failure the loop exists to prevent.</text>
<text x="60" y="915" font-size="12" text-anchor="start" fill="#8a909b" font-family="Georgia, serif">Evidence date: 31 August 2026</text>
