<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title description">
  <title id="title">What filled the heaviest transcript</title>
  <desc id="description">Horizontal bar chart. Machine output accounts for 60.5 percent of the heaviest transcript across five audited sessions. All other content accounts for 39.5 percent.</desc>
  <rect width="1200" height="650" rx="24" fill="#fbfaf7"/>
  <text x="72" y="82" fill="#172033" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="38" font-weight="750">What filled the heaviest transcript</text>
  <text x="72" y="122" fill="#526077" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20">Measured composition across five heavy agent sessions</text>

  <g stroke="#d8dde6" stroke-width="1">
    <line x1="360" y1="178" x2="360" y2="486"/>
    <line x1="470" y1="178" x2="470" y2="486"/>
    <line x1="580" y1="178" x2="580" y2="486"/>
    <line x1="690" y1="178" x2="690" y2="486"/>
    <line x1="800" y1="178" x2="800" y2="486"/>
    <line x1="910" y1="178" x2="910" y2="486"/>
    <line x1="1020" y1="178" x2="1020" y2="486"/>
    <line x1="1130" y1="178" x2="1130" y2="486"/>
  </g>

  <g fill="#69758a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" text-anchor="middle">
    <text x="360" y="516">0%</text>
    <text x="470" y="516">10%</text>
    <text x="580" y="516">20%</text>
    <text x="690" y="516">30%</text>
    <text x="800" y="516">40%</text>
    <text x="910" y="516">50%</text>
    <text x="1020" y="516">60%</text>
    <text x="1130" y="516">70%</text>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="72" y="272" fill="#172033" font-size="23" font-weight="700">Machine output</text>
    <rect x="360" y="224" width="665.5" height="78" rx="10" fill="#d95c54"/>
    <text x="1047" y="274" fill="#172033" font-size="28" font-weight="800">60.5%</text>

    <text x="72" y="416" fill="#172033" font-size="23" font-weight="700">Everything else</text>
    <rect x="360" y="368" width="434.5" height="78" rx="10" fill="#6c83b8"/>
    <text x="816" y="418" fill="#172033" font-size="28" font-weight="800">39.5%</text>
  </g>

  <line x1="72" y1="558" x2="1128" y2="558" stroke="#d8dde6"/>
  <text x="72" y="596" fill="#526077" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18">Why it matters: every extra model hop can re-read this accumulated output.</text>
  <text x="1128" y="596" fill="#69758a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" text-anchor="end">Evidence date: 1 Sep 2026</text>
</svg>
