<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d">
<title id="t">Seven workflows, grouped by what they replace</title><desc id="d">Running in live agency operations. Anonymised. The human keeps judgment.</desc>
<defs><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#e7e2d5"/></pattern><marker id="arrowEnd" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 9 5 L 0 10 z" fill="#566174"/></marker></defs>
<rect width="1280" height="720" fill="#fbfaf5"/><rect width="1280" height="720" fill="url(#dots)" opacity=".6"/>
<text x="48" y="52" font-size="28" font-weight="700" fill="#172033" font-family="Georgia, serif">Seven workflows, grouped by what they replace</text>
<text x="48" y="84" font-size="16" fill="#566174" font-family="Georgia, serif">Running in live agency operations. Anonymised. The human keeps judgment.</text>
<rect x="60" y="140" width="380" height="350" rx="16" fill="#dce8ff" stroke="#4f6fad" stroke-width="2" opacity=".5"/><text x="80" y="170" font-size="17" font-weight="700" fill="#4f6fad" font-family="Comic Sans MS, cursive">DATA TRUST</text><rect x="80" y="190" width="340" height="80" rx="12" fill="#ffffff" stroke="#4f6fad" stroke-width="2"/><text x="96" y="212" font-size="15" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">1 · Taxonomy governance</text><text x="96" y="238" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">one contract, many markets</text><rect x="80" y="282" width="340" height="80" rx="12" fill="#ffffff" stroke="#4f6fad" stroke-width="2"/><text x="96" y="304" font-size="15" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">2 · Tag &amp; pixel QA</text><text x="96" y="330" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">consent-aware, browser-real</text><rect x="80" y="374" width="340" height="80" rx="12" fill="#ffffff" stroke="#4f6fad" stroke-width="2"/><text x="96" y="396" font-size="15" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">3 · Attribution reconciliation</text><text x="96" y="422" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">platform story vs backend truth</text><rect x="480" y="140" width="380" height="260" rx="16" fill="#e9e1ff" stroke="#7459a8" stroke-width="2" opacity=".5"/><text x="500" y="170" font-size="17" font-weight="700" fill="#7459a8" font-family="Comic Sans MS, cursive">CONSISTENCY AT SCALE</text><rect x="500" y="190" width="340" height="80" rx="12" fill="#ffffff" stroke="#7459a8" stroke-width="2"/><text x="516" y="212" font-size="15" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">4 · Guidelines maintenance</text><text x="516" y="238" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">living standards, not PDFs</text><rect x="500" y="282" width="340" height="80" rx="12" fill="#ffffff" stroke="#7459a8" stroke-width="2"/><text x="516" y="304" font-size="15" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">5 · Rollout packs</text><text x="516" y="330" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">deploy once, audit everywhere</text><rect x="900" y="140" width="380" height="260" rx="16" fill="#dcf3e5" stroke="#3f8460" stroke-width="2" opacity=".5"/><text x="920" y="170" font-size="17" font-weight="700" fill="#3f8460" font-family="Comic Sans MS, cursive">COMMERCIAL CLARITY</text><rect x="920" y="190" width="340" height="80" rx="12" fill="#ffffff" stroke="#3f8460" stroke-width="2"/><text x="936" y="212" font-size="15" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">6 · Product &amp; commercial scoping</text><text x="936" y="238" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">messy context → scoped PRD</text><rect x="920" y="282" width="340" height="80" rx="12" fill="#ffffff" stroke="#3f8460" stroke-width="2"/><text x="936" y="304" font-size="15" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">7 · Calls into operating assets</text><text x="936" y="330" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">a call ends with an artifact</text>
<text x="640" y="700" text-anchor="middle" font-size="14" font-style="italic" fill="#566174" font-family="Georgia, serif">All seven: AI removes retrieval and checking labour; humans keep contracts, discrepancies, and client-facing sign-off · Evidence date: 29 Aug 2026</text>
</svg>