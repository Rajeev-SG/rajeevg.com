<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 720" role="img" aria-labelledby="t d">
<title id="t">Agent, or normal code? Work the tree honestly</title><desc id="d">Five questions, in order. Most tasks resolve to code before the third.</desc>
<defs><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#e7e2d5"/></pattern><marker id="arrowEnd" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 9 5 L 0 10 z" fill="#566174"/></marker></defs>
<rect width="1240" height="720" fill="#fbfaf5"/><rect width="1240" height="720" fill="url(#dots)" opacity=".6"/>
<text x="48" y="52" font-size="28" font-weight="700" fill="#172033" font-family="Georgia, serif">Agent, or normal code? Work the tree honestly</text>
<text x="48" y="84" font-size="16" fill="#566174" font-family="Georgia, serif">Five questions, in order. Most tasks resolve to code before the third.</text>
<path d="M 650 180 C 650 215, 185 215, 185 250" fill="none" stroke="#566174" stroke-width="2.5" marker-end="url(#arrowEnd)"/><text x="113" y="219" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">no</text><path d="M 650 180 C 650 215, 955 215, 955 250" fill="none" stroke="#566174" stroke-width="2.5" marker-end="url(#arrowEnd)"/><text x="967" y="219" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">yes</text><path d="M 185 330 C 185 440, 152.5 440, 152.5 550" fill="none" stroke="#566174" stroke-width="2.5" marker-end="url(#arrowEnd)"/><text x="80.5" y="444" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">yes</text><path d="M 185 330 C 185 440, 397.5 440, 397.5 550" fill="none" stroke="#566174" stroke-width="2.5" marker-end="url(#arrowEnd)"/><text x="409.5" y="444" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">no</text><path d="M 955 330 C 955 365, 650 365, 650 400" fill="none" stroke="#566174" stroke-width="2.5" marker-end="url(#arrowEnd)"/><text x="578" y="369" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">cheap</text><path d="M 955 330 C 955 365, 990 365, 990 400" fill="none" stroke="#566174" stroke-width="2.5" marker-end="url(#arrowEnd)"/><text x="1002" y="369" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">expensive</text><path d="M 650 480 C 650 515, 660 515, 660 550" fill="none" stroke="#566174" stroke-width="2.5" marker-end="url(#arrowEnd)"/><text x="672" y="519" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">yes</text><path d="M 650 480 C 650 515, 397.5 515, 397.5 550" fill="none" stroke="#566174" stroke-width="2.5" marker-end="url(#arrowEnd)"/><text x="325.5" y="519" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">no</text><path d="M 990 480 C 990 515, 920 515, 920 550" fill="none" stroke="#566174" stroke-width="2.5" marker-end="url(#arrowEnd)"/><text x="848" y="519" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">yes</text><path d="M 990 480 C 990 515, 1142.5 515, 1142.5 550" fill="none" stroke="#566174" stroke-width="2.5" marker-end="url(#arrowEnd)"/><text x="1154.5" y="519" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">no</text><rect x="500" y="100" width="300" height="80" rx="14" fill="#dce8ff" stroke="#4f6fad" stroke-width="3"/><text x="516" y="128" font-size="16" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">1 · Is the input ambiguous?</text><text x="516" y="152" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">input varies in ways rules cannot enumerate?</text><rect x="60" y="250" width="250" height="80" rx="14" fill="#e9e1ff" stroke="#7459a8" stroke-width="3"/><text x="76" y="278" font-size="16" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">2 · Does it repeat?</text><text x="76" y="302" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">same input, same output, every run?</text><rect x="830" y="250" width="250" height="80" rx="14" fill="#fff0c9" stroke="#a97921" stroke-width="3"/><text x="846" y="278" font-size="16" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">3 · What does failure cost?</text><text x="846" y="302" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">who notices, how fast, what breaks?</text><rect x="520" y="400" width="260" height="80" rx="14" fill="#ffe1de" stroke="#a45350" stroke-width="3"/><text x="536" y="428" font-size="16" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">4 · Is it real, repeating work?</text><text x="536" y="452" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">worth a build, not a one-off?</text><rect x="860" y="400" width="260" height="80" rx="14" fill="#dce8ff" stroke="#4f6fad" stroke-width="3"/><text x="876" y="428" font-size="16" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">5 · Independently verifiable?</text><text x="876" y="452" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">deterministic check or audit trail?</text><rect x="40" y="550" width="225" height="110" rx="14" fill="#dcf3e5" stroke="#3f8460" stroke-width="3"/><text x="56" y="578" font-size="16" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">NORMAL CODE</text><text x="56" y="602" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">deterministic · cheap · auditable</text><text x="56" y="624" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">failures are bugs, not surprises</text><rect x="280" y="550" width="235" height="110" rx="14" fill="#fff0c9" stroke="#a97921" stroke-width="3"/><text x="296" y="578" font-size="16" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">HUMAN ONE-OFF</text><text x="296" y="602" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">do not build — answer by hand,</text><text x="296" y="624" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">once, with no automation</text><rect x="545" y="550" width="230" height="110" rx="14" fill="#fff0c9" stroke="#a97921" stroke-width="3"/><text x="561" y="578" font-size="16" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">LOGGED AGENT</text><text x="561" y="602" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">bounded tools · acceptance check</text><text x="561" y="624" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">after every run</text><rect x="805" y="550" width="230" height="110" rx="14" fill="#dcf3e5" stroke="#3f8460" stroke-width="3"/><text x="821" y="578" font-size="16" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">CODE + GATE</text><text x="821" y="602" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">agent may assist, code decides,</text><text x="821" y="624" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">human approves before it ships</text><rect x="1075" y="550" width="135" height="110" rx="14" fill="#ffe1de" stroke="#a45350" stroke-width="3"/><text x="1091" y="578" font-size="16" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">HUMAN CALL</text><text x="1091" y="602" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">agent assists only</text><text x="1091" y="624" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">— no autonomy</text>
<text x="620" y="700" text-anchor="middle" font-size="14" font-style="italic" fill="#566174" font-family="Georgia, serif">Five questions in order · every question resolves to a destination · the honest answer is usually code, with an agent at the edges · Evidence date: 31 Aug 2026</text>
</svg>