<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d">
<title id="t">Agent, or normal code? Work the tree honestly</title><desc id="d">Five questions, in order. Most tasks resolve to code before the third.</desc>
<defs><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#e7e2d5"/></pattern><marker id="arrowEnd" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 9 5 L 0 10 z" fill="#566174"/></marker></defs>
<rect width="1280" height="720" fill="#fbfaf5"/><rect width="1280" height="720" fill="url(#dots)" opacity=".6"/>
<text x="48" y="52" font-size="28" font-weight="700" fill="#172033" font-family="Georgia, serif">Agent, or normal code? Work the tree honestly</text>
<text x="48" y="84" font-size="16" fill="#566174" font-family="Georgia, serif">Five questions, in order. Most tasks resolve to code before the third.</text>
<path d="M 570 200 C 570 250, 185 250, 185 300" fill="none" stroke="#566174" stroke-width="2.5" marker-end="url(#arrowEnd)"/><text x="347.5" y="242" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">no</text><path d="M 570 200 C 570 150, 1040 150, 1040 100" fill="none" stroke="#566174" stroke-width="2.5" marker-end="url(#arrowEnd)"/><text x="775" y="142" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">yes</text><path d="M 1040 200 C 1040 250, 640 250, 640 300" fill="none" stroke="#566174" stroke-width="2.5" marker-end="url(#arrowEnd)"/><text x="810" y="242" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">real work</text><path d="M 570 200 C 570 250, 1020 250, 1020 300" fill="none" stroke="#566174" stroke-width="2.5" marker-end="url(#arrowEnd)"/><text x="765" y="242" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">cheap or novel</text><path d="M 185 400 C 185 450, 165 450, 165 500" fill="none" stroke="#566174" stroke-width="2.5" marker-end="url(#arrowEnd)"/><text x="145" y="442" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">yes</text><path d="M 640 400 C 640 450, 490 450, 490 500" fill="none" stroke="#566174" stroke-width="2.5" marker-end="url(#arrowEnd)"/><text x="535" y="442" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">cheap failure</text><path d="M 640 400 C 640 450, 835 450, 835 500" fill="none" stroke="#566174" stroke-width="2.5" marker-end="url(#arrowEnd)"/><text x="707.5" y="442" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">expensive failure</text><rect x="420" y="100" width="300" height="100" rx="14" fill="#dce8ff" stroke="#4f6fad" stroke-width="3"/><text x="436" y="128" font-size="16" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">1 · Is the input ambiguous?</text><text x="436" y="152" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">input varies in ways rules</text><text x="436" y="174" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">cannot enumerate?</text><rect x="900" y="100" width="280" height="100" rx="14" fill="#ffe1de" stroke="#a45350" stroke-width="3"/><text x="916" y="128" font-size="16" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">4 · Is it real work?</text><text x="916" y="152" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">exploration → answer by hand,</text><text x="916" y="174" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">before spending any build</text><rect x="50" y="300" width="270" height="100" rx="14" fill="#e9e1ff" stroke="#7459a8" stroke-width="3"/><text x="66" y="328" font-size="16" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">2 · Does the work repeat?</text><text x="66" y="352" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">same input → same output,</text><text x="66" y="374" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">every time?</text><rect x="500" y="300" width="280" height="100" rx="14" fill="#fff0c9" stroke="#a97921" stroke-width="3"/><text x="516" y="328" font-size="16" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">3 · What does failure cost?</text><text x="516" y="352" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">who notices, how fast,</text><text x="516" y="374" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">what breaks downstream?</text><rect x="880" y="300" width="280" height="100" rx="14" fill="#dce8ff" stroke="#4f6fad" stroke-width="3"/><text x="896" y="328" font-size="16" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">5 · Who must audit it?</text><text x="896" y="352" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">traceable after the fact?</text><text x="896" y="374" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">→ full provenance or no agent</text><rect x="40" y="500" width="250" height="96" rx="14" fill="#dcf3e5" stroke="#3f8460" stroke-width="3"/><text x="56" y="528" font-size="16" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">NORMAL CODE / WORKFLOW</text><text x="56" y="552" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">deterministic · cheap · auditable</text><text x="56" y="574" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">failures are bugs, not surprises</text><rect x="350" y="500" width="280" height="96" rx="14" fill="#fff0c9" stroke="#a97921" stroke-width="3"/><text x="366" y="528" font-size="16" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">AGENT — SCOPED + LOGGED</text><text x="366" y="552" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">cheap failure tolerates variance</text><text x="366" y="574" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">acceptance check after every run</text><rect x="700" y="500" width="270" height="96" rx="14" fill="#dcf3e5" stroke="#3f8460" stroke-width="3"/><text x="716" y="528" font-size="16" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">CODE + GUARDRAILS + GATE</text><text x="716" y="552" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">expensive failure needs</text><text x="716" y="574" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">deterministic paths</text>
<text x="640" y="700" text-anchor="middle" font-size="14" font-style="italic" fill="#566174" font-family="Georgia, serif">Five questions in order · the honest answer is usually code, with an agent at the edges · Evidence date: 31 Aug 2026</text>
</svg>