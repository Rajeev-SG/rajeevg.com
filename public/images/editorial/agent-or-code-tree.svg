<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d">
<title id="t">Agent, or normal code? Work the tree honestly</title><desc id="d">Four questions, in order. Most tasks resolve before the third.</desc>
<defs><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#e7e2d5"/></pattern><marker id="arrowEnd" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 9 5 L 0 10 z" fill="#566174"/></marker></defs>
<rect width="1280" height="720" fill="#fbfaf5"/><rect width="1280" height="720" fill="url(#dots)" opacity=".6"/>
<text x="48" y="52" font-size="28" font-weight="700" fill="#172033" font-family="Georgia, serif">Agent, or normal code? Work the tree honestly</text>
<text x="48" y="84" font-size="16" fill="#566174" font-family="Georgia, serif">Four questions, in order. Most tasks resolve before the third.</text>
<path d="M 640 200 C 640 235, 240 235, 240 270" fill="none" stroke="#566174" stroke-width="2.5" marker-end="url(#arrowEnd)"/><text x="410" y="227" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">no</text><path d="M 640 200 C 640 235, 590 235, 590 270" fill="none" stroke="#566174" stroke-width="2.5" marker-end="url(#arrowEnd)"/><text x="585" y="227" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">yes</text><path d="M 240 360 C 240 405, 200 405, 200 450" fill="none" stroke="#566174" stroke-width="2.5" marker-end="url(#arrowEnd)"/><text x="190" y="397" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">yes</text><path d="M 590 360 C 590 405, 505 405, 505 450" fill="none" stroke="#566174" stroke-width="2.5" marker-end="url(#arrowEnd)"/><text x="517.5" y="397" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">cheap</text><path d="M 590 360 C 590 405, 765 405, 765 450" fill="none" stroke="#566174" stroke-width="2.5" marker-end="url(#arrowEnd)"/><text x="647.5" y="397" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">expensive</text><path d="M 640 200 C 640 235, 980 235, 980 270" fill="none" stroke="#566174" stroke-width="2.5" marker-end="url(#arrowEnd)"/><text x="780" y="227" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">skip to audit</text><rect x="520" y="110" width="240" height="90" rx="14" fill="#dce8ff" stroke="#4f6fad" stroke-width="3"/><text x="536" y="138" font-size="16" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">Is the input ambiguous?</text><text x="536" y="162" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">does it vary in ways rules</text><text x="536" y="184" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">cannot enumerate?</text><rect x="120" y="270" width="240" height="90" rx="14" fill="#e9e1ff" stroke="#7459a8" stroke-width="3"/><text x="136" y="298" font-size="16" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">No → does it repeat?</text><text x="136" y="322" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">same input, same output,</text><text x="136" y="344" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">every time?</text><rect x="90" y="450" width="220" height="88" rx="14" fill="#dcf3e5" stroke="#3f8460" stroke-width="3"/><text x="106" y="478" font-size="16" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">NORMAL CODE</text><text x="106" y="502" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">deterministic · fast</text><text x="106" y="524" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">cheap · auditable</text><rect x="470" y="270" width="240" height="90" rx="14" fill="#fff" stroke="#4f6fad" stroke-width="3"/><text x="486" y="298" font-size="16" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">Yes → failure cost?</text><text x="486" y="322" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">who notices, how fast,</text><text x="486" y="344" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">what breaks?</text><rect x="400" y="450" width="210" height="88" rx="14" fill="#fff0c9" stroke="#a97921" stroke-width="3"/><text x="416" y="478" font-size="16" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">AGENT OK</text><text x="416" y="502" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">cheap failure tolerates</text><text x="416" y="524" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">nondeterminism</text><rect x="650" y="450" width="230" height="88" rx="14" fill="#dcf3e5" stroke="#3f8460" stroke-width="3"/><text x="666" y="478" font-size="16" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">CODE + GUARDRAILS</text><text x="666" y="502" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">expensive failure needs</text><text x="666" y="524" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">deterministic paths</text><rect x="860" y="270" width="240" height="90" rx="14" fill="#dce8ff" stroke="#4f6fad" stroke-width="3"/><text x="876" y="298" font-size="16" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">Who must audit it?</text><text x="876" y="322" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">traceable after the fact?</text><rect x="920" y="450" width="230" height="88" rx="14" fill="#fff0c9" stroke="#a97921" stroke-width="3"/><text x="936" y="478" font-size="16" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">LOGGED AGENT</text><text x="936" y="502" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">full provenance attached</text><text x="936" y="524" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">or plain code</text>
<text x="640" y="700" text-anchor="middle" font-size="14" font-style="italic" fill="#566174" font-family="Georgia, serif">The honest answer is usually code, with an agent at the edges · Evidence date: 29 Aug 2026</text>
</svg>