<title id="t">Measured economics, honestly scoped</title><desc id="d">Only one number in this execution is a clean per-task delta. The rest are lifetime counters — shown, but not comparable.</desc>
<defs><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#e7e2d5"/></pattern><marker id="arrowEnd" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 9 5 L 0 10 z" fill="#566174"/></marker></defs>
<rect width="1280" height="720" fill="#fbfaf5"/><rect width="1280" height="720" fill="url(#dots)" opacity=".6"/>
<text x="48" y="52" font-size="28" font-weight="700" fill="#172033" font-family="Georgia, serif">Measured economics, honestly scoped</text>
<text x="48" y="84" font-size="16" fill="#566174" font-family="Georgia, serif">Only one number in this execution is a clean per-task delta. The rest are lifetime counters — shown, but not comparable.</text>
<rect x="60" y="120" width="480" height="480" rx="18" fill="#e9e1ff" stroke="#7459a8" stroke-width="2.5" opacity=".35"/><text x="84" y="156" font-size="17" font-weight="700" fill="#7459a8" font-family="Comic Sans MS, cursive">BOUNDED REVIEW — CLEAN DELTA</text><rect x="100" y="260" width="380" height="150" rx="12" fill="#ffffff" stroke="#7459a8" stroke-width="3"/><text x="118" y="292" font-size="15" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">Opus narrative review</text><text x="118" y="322" font-size="26" font-weight="700" fill="#7459a8" font-family="Comic Sans MS, cursive">56,747 tokens · $0.47</text><text x="118" y="352" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">one session, one task: review 13 articles,</text><text x="118" y="374" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">return verdicts, change nothing</text><text x="100" y="460" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">verified against OpenCode SQLite session ses_fb10c0ea…oBhd</text><text x="84" y="540" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">the expensive model spent less than $0.50 by staying bounded</text><rect x="580" y="120" width="640" height="480" rx="18" fill="#fff0c9" stroke="#a97921" stroke-width="2.5" opacity=".3"/><text x="604" y="156" font-size="17" font-weight="700" fill="#a97921" font-family="Comic Sans MS, cursive">LIFETIME COUNTERS — NOT COMPARABLE</text><text x="604" y="210" font-size="14" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">GLM implementation thread</text><text x="604" y="230" font-size="12" fill="#566174" font-family="Comic Sans MS, cursive">prompt 202.2M · completion 157K</text><rect x="604" y="242" width="520" height="34" rx="8" fill="#dcf3e5" stroke="#3f8460" stroke-width="2.5"/><text x="1136" y="265" font-size="12" fill="#566174" font-family="Comic Sans MS, cursive">includes all other work these sessions ever did</text><text x="604" y="318" font-size="14" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">Sol supervisor session</text><text x="604" y="338" font-size="12" fill="#566174" font-family="Comic Sans MS, cursive">prompt 76.7M · completion 86K</text><rect x="604" y="350" width="197" height="34" rx="8" fill="#dce8ff" stroke="#4f6fad" stroke-width="2.5"/><text x="813" y="373" font-size="12" fill="#566174" font-family="Comic Sans MS, cursive">includes all other work these sessions ever did</text><text x="604" y="426" font-size="14" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">Opus (inside the same execution)</text><text x="604" y="446" font-size="12" fill="#566174" font-family="Comic Sans MS, cursive">bounded delta: unknown</text><rect x="604" y="458" width="520" height="34" rx="8" fill="none" stroke="#a45350" stroke-width="2" stroke-dasharray="8 6"/><text x="618" y="481" font-size="12" fill="#a45350" font-family="Comic Sans MS, cursive">no clean per-task number — reported as unknown, not zero</text><text x="604" y="560" font-size="13" fill="#172033" font-family="Comic Sans MS, cursive">Directional claim only: the workhorse absorbed the bulk of implementation</text><text x="604" y="580" font-size="13" fill="#172033" font-family="Comic Sans MS, cursive">volume; the frontier model was capped at one small, expensive-worthy review.</text>
<text x="640" y="700" text-anchor="middle" font-size="14" font-style="italic" fill="#566174" font-family="Georgia, serif">Lifetime counters come from the local Prometheus stack; cost is measured only where scoped · Evidence date: 30 Aug 2026</text>
</svg>