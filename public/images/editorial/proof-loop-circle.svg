<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d">
<title id="t">The proof loop — a claim is not a deliverable</title><desc id="d">Evidence with provenance, an editable artefact, and a gate where uncertainty is stated.</desc>
<defs><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#e7e2d5"/></pattern><marker id="arrowEnd" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 9 5 L 0 10 z" fill="#566174"/></marker></defs>
<rect width="1280" height="720" fill="#fbfaf5"/><rect width="1280" height="720" fill="url(#dots)" opacity=".6"/>
<text x="48" y="52" font-size="28" font-weight="700" fill="#172033" font-family="Georgia, serif">The proof loop — a claim is not a deliverable</text>
<text x="48" y="84" font-size="16" fill="#566174" font-family="Georgia, serif">Evidence with provenance, an editable artefact, and a gate where uncertainty is stated.</text>
<ellipse cx="650" cy="350" rx="350" ry="170" fill="none" stroke="#566174" stroke-width="2" stroke-dasharray="10 9"/><rect x="520" y="120" width="260" height="120" rx="14" fill="#dce8ff" stroke="#4f6fad" stroke-width="3"/><text x="538" y="152" font-size="18" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">1 · Capture</text><text x="538" y="184" font-size="14" fill="#566174" font-family="Comic Sans MS, cursive">real browser runs, real data paths</text><rect x="860" y="280" width="260" height="120" rx="14" fill="#e9e1ff" stroke="#7459a8" stroke-width="3"/><text x="878" y="312" font-size="18" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">2 · Attach provenance</text><text x="878" y="344" font-size="14" fill="#566174" font-family="Comic Sans MS, cursive">source · timestamp · runner</text><rect x="520" y="460" width="260" height="120" rx="14" fill="#dcf3e5" stroke="#3f8460" stroke-width="3"/><text x="538" y="492" font-size="18" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">3 · Draft deliverable</text><text x="538" y="524" font-size="14" fill="#566174" font-family="Comic Sans MS, cursive">editable, traces back to raw</text><rect x="180" y="280" width="260" height="120" rx="14" fill="#fff0c9" stroke="#a97921" stroke-width="3"/><text x="198" y="312" font-size="18" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">4 · Review gate</text><text x="198" y="344" font-size="14" fill="#566174" font-family="Comic Sans MS, cursive">uncertainty stated, nothing silent</text>
<text x="640" y="700" text-anchor="middle" font-size="14" font-style="italic" fill="#566174" font-family="Georgia, serif">Reconciliation closes the loop when sources disagree · Evidence date: 29 Aug 2026</text>
</svg>