<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d">
<title id="t">Who is allowed to do what</title><desc id="d">The boundaries are the design: supervision, bounded implementation, and review are separated so failures stay local.</desc>
<defs><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#e7e2d5"/></pattern><marker id="arrowEnd" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 9 5 L 0 10 z" fill="#566174"/></marker></defs>
<rect width="1280" height="720" fill="#fbfaf5"/><rect width="1280" height="720" fill="url(#dots)" opacity=".6"/>
<text x="48" y="52" font-size="28" font-weight="700" fill="#172033" font-family="Georgia, serif">Who is allowed to do what</text>
<text x="48" y="84" font-size="16" fill="#566174" font-family="Georgia, serif">The boundaries are the design: supervision, bounded implementation, and review are separated so failures stay local.</text>
<rect x="60" y="130" width="320" height="440" rx="18" fill="#dce8ff" stroke="#4f6fad" stroke-width="2.5" opacity=".45"/><text x="82" y="164" font-size="18" font-weight="700" fill="#4f6fad" font-family="Comic Sans MS, cursive">SUPERVISOR</text><rect x="78" y="190" width="284" height="84" rx="12" fill="#ffffff" stroke="#4f6fad" stroke-width="2"/><text x="94" y="218" font-size="15" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">Writes the contract</text><text x="94" y="244" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">scope, runbook paths, acceptance checks</text><rect x="78" y="286" width="284" height="84" rx="12" fill="#ffffff" stroke="#4f6fad" stroke-width="2"/><text x="94" y="314" font-size="15" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">Never edits article files</text><text x="94" y="340" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">keeps judgment independent of the build</text><rect x="78" y="382" width="284" height="84" rx="12" fill="#ffffff" stroke="#4f6fad" stroke-width="2"/><text x="94" y="410" font-size="15" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">Creates the worker task</text><text x="94" y="436" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">native Codex task, its own thread</text><text x="82" y="556" font-size="13" font-weight="700" fill="#4f6fad" font-family="Comic Sans MS, cursive">sends in: contract + scope</text><rect x="480" y="130" width="320" height="440" rx="18" fill="#dcf3e5" stroke="#3f8460" stroke-width="2.5" opacity=".45"/><text x="502" y="164" font-size="18" font-weight="700" fill="#3f8460" font-family="Comic Sans MS, cursive">GLM WORKER</text><rect x="498" y="190" width="284" height="84" rx="12" fill="#ffffff" stroke="#3f8460" stroke-width="2"/><text x="514" y="218" font-size="15" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">Isolated worktree checkout</text><text x="514" y="244" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">cannot disturb the main tree</text><rect x="498" y="286" width="284" height="84" rx="12" fill="#ffffff" stroke="#3f8460" stroke-width="2"/><text x="514" y="314" font-size="15" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">Bounded writes</text><text x="514" y="340" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">article, figures, index integration only</text><rect x="498" y="382" width="284" height="84" rx="12" fill="#ffffff" stroke="#3f8460" stroke-width="2"/><text x="514" y="410" font-size="15" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">Opens the PR</text><text x="514" y="436" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">build + typecheck must pass first</text><text x="502" y="556" font-size="13" font-weight="700" fill="#3f8460" font-family="Comic Sans MS, cursive">sends out: PR + evidence</text><rect x="900" y="130" width="320" height="440" rx="18" fill="#e9e1ff" stroke="#7459a8" stroke-width="2.5" opacity=".45"/><text x="922" y="164" font-size="18" font-weight="700" fill="#7459a8" font-family="Comic Sans MS, cursive">REVIEWER</text><rect x="918" y="190" width="284" height="84" rx="12" fill="#ffffff" stroke="#7459a8" stroke-width="2"/><text x="934" y="218" font-size="15" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">Reads the rendered site</text><text x="934" y="244" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">articles as a reader sees them</text><rect x="918" y="286" width="284" height="84" rx="12" fill="#ffffff" stroke="#7459a8" stroke-width="2"/><text x="934" y="314" font-size="15" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">No file access, no edits</text><text x="934" y="340" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">cannot silently change the output</text><rect x="918" y="382" width="284" height="84" rx="12" fill="#ffffff" stroke="#7459a8" stroke-width="2"/><text x="934" y="410" font-size="15" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">Returns verdicts</text><text x="934" y="436" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">problems, not patches</text><text x="922" y="556" font-size="13" font-weight="700" fill="#7459a8" font-family="Comic Sans MS, cursive">sends back: verdicts</text><path d="M 382 320 L 474 320" fill="none" stroke="#566174" stroke-width="2.5" marker-end="url(#arrowEnd)"/><path d="M 802 320 L 894 320" fill="none" stroke="#566174" stroke-width="2.5" marker-end="url(#arrowEnd)"/><path d="M 905 400 C 810 500, 720 500, 640 385" fill="none" stroke="#a45350" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#arrowEnd)"/><text x="628" y="516" font-size="13" fill="#a45350" font-family="Comic Sans MS, cursive">verdicts re-enter via the worker only</text>
<text x="640" y="700" text-anchor="middle" font-size="14" font-style="italic" fill="#566174" font-family="Georgia, serif">Review findings can never become edits by themselves — the worker applies them inside its scope · Evidence date: 30 Aug 2026</text>
</svg>