<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d">
<title id="t">Two years of multi-agent work on one map</title><desc id="d">What was built, what the telemetry said, and what was deliberately deleted.</desc>
<defs><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#e7e2d5"/></pattern><marker id="arrowEnd" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 9 5 L 0 10 z" fill="#566174"/></marker></defs>
<rect width="1280" height="720" fill="#fbfaf5"/><rect width="1280" height="720" fill="url(#dots)" opacity=".6"/>
<text x="48" y="52" font-size="28" font-weight="700" fill="#172033" font-family="Georgia, serif">Two years of multi-agent work on one map</text>
<text x="48" y="84" font-size="16" fill="#566174" font-family="Georgia, serif">What was built, what the telemetry said, and what was deliberately deleted.</text>
<line x1="120" y1="170" x2="140" y2="590" stroke="#566174" stroke-width="3"/><circle cx="120" cy="200" r="18" fill="#dce8ff" stroke="#4f6fad" stroke-width="3"/><text x="180" y="192" font-size="18" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">Native subagents</text><text x="180" y="216" font-size="14" fill="#566174" font-family="Comic Sans MS, cursive">parallel workers, no shared memory — it worked but produced no evidence</text><text x="760" y="200" font-size="14" font-weight="700" fill="#4f6fad" font-family="Comic Sans MS, cursive">kept the instinct</text><circle cx="120" cy="280" r="18" fill="#dcf3e5" stroke="#3f8460" stroke-width="3"/><text x="180" y="272" font-size="18" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">Measurable workers</text><text x="180" y="296" font-size="14" fill="#566174" font-family="Comic Sans MS, cursive">per-worker traces, recoverable handoffs — overhead became visible</text><text x="760" y="280" font-size="14" font-weight="700" fill="#3f8460" font-family="Comic Sans MS, cursive">kept: measurement</text><circle cx="120" cy="360" r="18" fill="#ffe1de" stroke="#a45350" stroke-width="3"/><text x="180" y="352" font-size="18" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">Codex + OpenCode split</text><text x="180" y="376" font-size="14" fill="#566174" font-family="Comic Sans MS, cursive">planner and executor as two tools — traces showed oversight &gt; work</text><text x="760" y="360" font-size="14" font-weight="700" fill="#a45350" font-family="Comic Sans MS, cursive">deleted</text><circle cx="120" cy="440" r="18" fill="#ffe1de" stroke="#a45350" stroke-width="3"/><text x="180" y="432" font-size="18" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">Lifecycle experiments</text><text x="180" y="456" font-size="14" fill="#566174" font-family="Comic Sans MS, cursive">Beads · BVR · NTM — bookkeeping cost more than it returned</text><text x="760" y="440" font-size="14" font-weight="700" fill="#a45350" font-family="Comic Sans MS, cursive">deleted</text><circle cx="120" cy="520" r="18" fill="#fff0c9" stroke="#a97921" stroke-width="3"/><text x="180" y="512" font-size="18" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">Role-aware routing</text><text x="180" y="536" font-size="14" fill="#566174" font-family="Comic Sans MS, cursive">cheap workhorse, frontier escalation, A2A as optional discovery</text><text x="760" y="520" font-size="14" font-weight="700" fill="#a97921" font-family="Comic Sans MS, cursive">current system</text><line x1="120" y1="170" x2="120" y2="560" stroke="#566174" stroke-width="3"/>
<text x="640" y="700" text-anchor="middle" font-size="14" font-style="italic" fill="#566174" font-family="Georgia, serif">Evidence date: 29 Aug 2026 · 551 sessions, public token data, one deleted middleman</text>
</svg>