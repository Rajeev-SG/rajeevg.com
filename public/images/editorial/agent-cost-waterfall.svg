<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d">
<title id="t">How one request becomes four bills</title><desc id="d">Each orchestration hop resends context. The work is the same; the bill multiplies.</desc>
<defs><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#e7e2d5"/></pattern><marker id="arrowEnd" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 9 5 L 0 10 z" fill="#566174"/></marker></defs>
<rect width="1280" height="720" fill="#fbfaf5"/><rect width="1280" height="720" fill="url(#dots)" opacity=".6"/>
<text x="48" y="52" font-size="28" font-weight="700" fill="#172033" font-family="Georgia, serif">How one request becomes four bills</text>
<text x="48" y="84" font-size="16" fill="#566174" font-family="Georgia, serif">Each orchestration hop resends context. The work is the same; the bill multiplies.</text>
<rect x="100" y="500" width="250" height="-10" rx="10" fill="#dcf3e5" stroke="#3f8460" stroke-width="3"/><text x="116" y="528" font-size="16" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">Actual work</text><text x="201" y="562" font-size="26" font-weight="700" fill="#3f8460" font-family="Comic Sans MS, cursive">1×</text><text x="116" y="604" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">the tokens the task itself needed</text><rect x="380" y="420" width="250" height="70" rx="10" fill="#fff0c9" stroke="#a97921" stroke-width="3"/><text x="396" y="448" font-size="16" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">+ Planning layer</text><text x="481" y="482" font-size="26" font-weight="700" fill="#a97921" font-family="Comic Sans MS, cursive">2×</text><text x="396" y="524" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">the planner re-read the whole context</text><rect x="660" y="340" width="250" height="150" rx="10" fill="#fff0c9" stroke="#a97921" stroke-width="3"/><text x="676" y="368" font-size="16" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">+ Review layer</text><text x="761" y="402" font-size="26" font-weight="700" fill="#a97921" font-family="Comic Sans MS, cursive">3×</text><text x="676" y="444" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">the reviewer re-read output plus context</text><rect x="940" y="260" width="250" height="230" rx="10" fill="#ffe1de" stroke="#a45350" stroke-width="3"/><text x="956" y="288" font-size="16" font-weight="700" fill="#172033" font-family="Comic Sans MS, cursive">+ Polling &amp; retries</text><text x="1041" y="322" font-size="26" font-weight="700" fill="#a45350" font-family="Comic Sans MS, cursive">4×</text><text x="956" y="364" font-size="13" fill="#566174" font-family="Comic Sans MS, cursive">waiting, failed hops, stale workers</text>
<text x="640" y="700" text-anchor="middle" font-size="14" font-style="italic" fill="#566174" font-family="Georgia, serif">Measured across 551 sessions — the multiplier is traced, not illustrative · Evidence date: 29 Aug 2026</text>
</svg>