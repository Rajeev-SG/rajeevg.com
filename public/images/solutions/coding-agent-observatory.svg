<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Coding Agent Observatory</title>
  <desc id="desc">Session stores become public truth and a private control room.</desc>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#e7e2d5"/></pattern>
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="11" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="0.85"/></filter>
    <marker id="arrowEnd" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 9 5 L 0 10 z" fill="#172033"/></marker>
    <style>
      .rough { filter: url(#wobble); }
      .title { font: 700 34px Georgia, serif; fill: #172033; }
      .subtitle { font: 18px Georgia, serif; fill: #566174; }
      .node-title { font: 700 24px "Comic Sans MS", "Bradley Hand", cursive; fill: #172033; }
      .body { font: 17px "Comic Sans MS", "Bradley Hand", cursive; fill: #172033; }
      .arrow-label { font: 14px "Comic Sans MS", "Bradley Hand", cursive; fill: #566174; paint-order: stroke; stroke: #fbfaf5; stroke-width: 7px; }
      .footer { font: 16px Georgia, serif; font-style: italic; fill: #566174; }
    </style>
  </defs>
  <rect width="1280" height="720" fill="#fbfaf5"/>
  <rect width="1280" height="720" fill="url(#dots)" opacity=".68"/>
  <path d="M 48 101 C 330 98, 580 105, 846 100 S 1125 103, 1230 99" fill="none" stroke="#172033" stroke-width="2" stroke-opacity=".18" class="rough"/>
  <text x="48" y="60" class="title">Coding Agent Observatory</text>
  <text x="48" y="91" class="subtitle">Session stores become public truth and a private control room.</text>
  <g><path d="M 390 275 C 435 275, 435 275, 480 275" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/><text x="435" y="266" text-anchor="middle" class="arrow-label">JSONL/SQLite</text></g>
<g><path d="M 810 250 C 855 250, 855 190, 900 190" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/><text x="855" y="211" text-anchor="middle" class="arrow-label">publish</text></g>
<g><path d="M 810 300 C 855 300, 855 390, 900 390" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/><text x="855" y="336" text-anchor="middle" class="arrow-label">full detail</text></g>
  <g><rect x="60" y="190" width="330" height="170" rx="18" fill="#dce8ff" stroke="#4f6fad" stroke-width="3" class="rough"/><rect x="65" y="195" width="320" height="160" rx="14" fill="none" stroke="#4f6fad" stroke-opacity=".22" stroke-width="1.5"/><text x="225" y="233" text-anchor="middle" class="node-title">Local session stores</text><text x="225" y="269" text-anchor="middle" class="body">Codex · Claude Code</text>
<text x="225" y="294" text-anchor="middle" class="body">Hermes · OMP</text>
<text x="225" y="319" text-anchor="middle" class="body">OpenClaw · OpenCode</text></g>
<g><rect x="480" y="190" width="330" height="170" rx="18" fill="#e9e1ff" stroke="#7459a8" stroke-width="3" class="rough"/><rect x="485" y="195" width="320" height="160" rx="14" fill="none" stroke="#7459a8" stroke-opacity=".22" stroke-width="1.5"/><text x="645" y="233" text-anchor="middle" class="node-title">Normaliser</text><text x="645" y="269" text-anchor="middle" class="body">deduplicates cumulative counters</text>
<text x="645" y="294" text-anchor="middle" class="body">never shows unknown as zero</text></g>
<g><rect x="900" y="120" width="320" height="140" rx="18" fill="#dcf3e5" stroke="#3f8460" stroke-width="3" class="rough"/><rect x="905" y="125" width="310" height="130" rx="14" fill="none" stroke="#3f8460" stroke-opacity=".22" stroke-width="1.5"/><text x="1060" y="163" text-anchor="middle" class="node-title">Public summary</text><text x="1060" y="199" text-anchor="middle" class="body">tokenmaxxing.rajeevg.com</text>
<text x="1060" y="224" text-anchor="middle" class="body">allowlisted totals only</text></g>
<g><rect x="900" y="320" width="320" height="140" rx="18" fill="#fff0c9" stroke="#a97921" stroke-width="3" class="rough"/><rect x="905" y="325" width="310" height="130" rx="14" fill="none" stroke="#a97921" stroke-opacity=".22" stroke-width="1.5"/><text x="1060" y="363" text-anchor="middle" class="node-title">Private Grafana</text><text x="1060" y="399" text-anchor="middle" class="body">full detail</text>
<text x="1060" y="424" text-anchor="middle" class="body">provider and session level</text></g>
  <path d="M 48 674 C 360 670, 620 678, 950 672 S 1160 675, 1230 671" fill="none" stroke="#172033" stroke-width="1.5" stroke-opacity=".18" class="rough"/>
  <text x="640" y="700" text-anchor="middle" class="footer">Evidence date: 28 Aug 2026  ·  public numbers come from the same pipeline as the private room</text>
</svg>