<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Agent Routing and Lifecycle</title>
  <desc id="desc">The cheap workhorse first. Frontier help when the work is genuinely hard.</desc>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#e7e2d5"/></pattern>
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="11" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="0.85"/></filter>
    <marker id="arrowEnd" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 9 5 L 0 10 z" fill="#172033"/></marker>
    <style>
      .rough { filter: url(#wobble); }
      .title { font: 700 34px Georgia, serif; fill: #172033; }
      .subtitle { font: 18px Georgia, serif; fill: #566174; }
      .node-title { font: 700 24px "Comic Sans MS", "Bradley Hand", cursive; fill: #172033; }
      .body { font: 17px "Comic Sans MS", "Bradley Hand", cursive; fill: #172033; }
      .arrow-label { font: 14px "Comic Sans MS", "Bradley Hand", cursive; fill: #566174; paint-order: stroke; stroke: #fbfaf5; stroke-width: 7px; }
      .footer { font: 16px Georgia, serif; font-style: italic; fill: #566174; }
    </style>
  </defs>
  <rect width="1280" height="720" fill="#fbfaf5"/>
  <rect width="1280" height="720" fill="url(#dots)" opacity=".68"/>
  <path d="M 48 101 C 330 98, 580 105, 846 100 S 1125 103, 1230 99" fill="none" stroke="#172033" stroke-width="2" stroke-opacity=".18" class="rough"/>
  <text x="48" y="60" class="title">Agent Routing and Lifecycle</text>
  <text x="48" y="91" class="subtitle">The cheap workhorse first. Frontier help when the work is genuinely hard.</text>
  <g><path d="M 380 280 C 425 280, 425 280, 470 280" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/><text x="425" y="271" text-anchor="middle" class="arrow-label">route</text></g>
<g><path d="M 800 250 C 850 250, 850 185, 900 185" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/><text x="850" y="208.5" text-anchor="middle" class="arrow-label">cheap</text></g>
<g><path d="M 800 310 C 850 310, 850 385, 900 385" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/><text x="850" y="338.5" text-anchor="middle" class="arrow-label">escalate</text></g>
  <g><rect x="80" y="200" width="300" height="160" rx="18" fill="#dce8ff" stroke="#4f6fad" stroke-width="3" class="rough"/><rect x="85" y="205" width="290" height="150" rx="14" fill="none" stroke="#4f6fad" stroke-opacity=".22" stroke-width="1.5"/><text x="230" y="243" text-anchor="middle" class="node-title">Request</text><text x="230" y="279" text-anchor="middle" class="body">from user or another agent</text></g>
<g><rect x="470" y="200" width="330" height="160" rx="18" fill="#e9e1ff" stroke="#7459a8" stroke-width="3" class="rough"/><rect x="475" y="205" width="320" height="150" rx="14" fill="none" stroke="#7459a8" stroke-opacity=".22" stroke-width="1.5"/><text x="635" y="243" text-anchor="middle" class="node-title">Routing rule</text><text x="635" y="279" text-anchor="middle" class="body">role-aware model choice</text>
<text x="635" y="304" text-anchor="middle" class="body">hard? escalate</text>
<text x="635" y="329" text-anchor="middle" class="body">cheap? workhorse</text></g>
<g><rect x="900" y="120" width="310" height="130" rx="18" fill="#dcf3e5" stroke="#3f8460" stroke-width="3" class="rough"/><rect x="905" y="125" width="300" height="120" rx="14" fill="none" stroke="#3f8460" stroke-opacity=".22" stroke-width="1.5"/><text x="1055" y="163" text-anchor="middle" class="node-title">GLM-5.3-Flash</text><text x="1055" y="199" text-anchor="middle" class="body">default workhorse</text>
<text x="1055" y="224" text-anchor="middle" class="body">measured cost and speed</text></g>
<g><rect x="900" y="320" width="310" height="130" rx="18" fill="#fff0c9" stroke="#a97921" stroke-width="3" class="rough"/><rect x="905" y="325" width="300" height="120" rx="14" fill="none" stroke="#a97921" stroke-opacity=".22" stroke-width="1.5"/><text x="1055" y="363" text-anchor="middle" class="node-title">Frontier model</text><text x="1055" y="399" text-anchor="middle" class="body">hard architecture only</text>
<text x="1055" y="424" text-anchor="middle" class="body">bounded delegation</text></g>
  <path d="M 48 674 C 360 670, 620 678, 950 672 S 1160 675, 1230 671" fill="none" stroke="#172033" stroke-width="1.5" stroke-opacity=".18" class="rough"/>
  <text x="640" y="700" text-anchor="middle" class="footer">Evidence date: 29 Aug 2026  ·  A2A agent cards make discovery a capability, not a shim</text>
</svg>