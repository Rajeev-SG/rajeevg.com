<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Global Measurement Governance</title>
  <desc id="desc">One contract for taxonomy, QA and reconciliation across markets.</desc>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#e7e2d5"/></pattern>
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="11" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="0.85"/></filter>
    <marker id="arrowEnd" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 9 5 L 0 10 z" fill="#172033"/></marker>
    <style>
      .rough { filter: url(#wobble); }
      .title { font: 700 34px Georgia, serif; fill: #172033; }
      .subtitle { font: 18px Georgia, serif; fill: #566174; }
      .node-title { font: 700 24px "Comic Sans MS", "Bradley Hand", cursive; fill: #172033; }
      .body { font: 17px "Comic Sans MS", "Bradley Hand", cursive; fill: #172033; }
      .arrow-label { font: 14px "Comic Sans MS", "Bradley Hand", cursive; fill: #566174; paint-order: stroke; stroke: #fbfaf5; stroke-width: 7px; }
      .footer { font: 16px Georgia, serif; font-style: italic; fill: #566174; }
    </style>
  </defs>
  <rect width="1280" height="720" fill="#fbfaf5"/>
  <rect width="1280" height="720" fill="url(#dots)" opacity=".68"/>
  <path d="M 48 101 C 330 98, 580 105, 846 100 S 1125 103, 1230 99" fill="none" stroke="#172033" stroke-width="2" stroke-opacity=".18" class="rough"/>
  <text x="48" y="60" class="title">Global Measurement Governance</text>
  <text x="48" y="91" class="subtitle">One contract for taxonomy, QA and reconciliation across markets.</text>
  <g><path d="M 400 265 C 440 265, 440 265, 480 265" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/><text x="440" y="256" text-anchor="middle" class="arrow-label">define</text></g>
<g><path d="M 800 265 C 845 265, 845 265, 890 265" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/><text x="845" y="256" text-anchor="middle" class="arrow-label">compare</text></g>
<g><path d="M 640 350 C 640 350, 640 430, 640 430" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/><text x="640" y="381" text-anchor="middle" class="arrow-label">gate</text></g>
  <g><rect x="70" y="180" width="330" height="170" rx="18" fill="#dce8ff" stroke="#4f6fad" stroke-width="3" class="rough"/><rect x="75" y="185" width="320" height="160" rx="14" fill="none" stroke="#4f6fad" stroke-opacity=".22" stroke-width="1.5"/><text x="235" y="223" text-anchor="middle" class="node-title">Taxonomy contract</text><text x="235" y="259" text-anchor="middle" class="body">events and properties</text>
<text x="235" y="284" text-anchor="middle" class="body">named owners per market</text></g>
<g><rect x="480" y="180" width="320" height="170" rx="18" fill="#dcf3e5" stroke="#3f8460" stroke-width="3" class="rough"/><rect x="485" y="185" width="310" height="160" rx="14" fill="none" stroke="#3f8460" stroke-opacity=".22" stroke-width="1.5"/><text x="640" y="223" text-anchor="middle" class="node-title">Automated QA</text><text x="640" y="259" text-anchor="middle" class="body">live implementation vs contract</text>
<text x="640" y="284" text-anchor="middle" class="body">consent-aware checks</text></g>
<g><rect x="890" y="180" width="320" height="170" rx="18" fill="#fff0c9" stroke="#a97921" stroke-width="3" class="rough"/><rect x="895" y="185" width="310" height="160" rx="14" fill="none" stroke="#a97921" stroke-opacity=".22" stroke-width="1.5"/><text x="1050" y="223" text-anchor="middle" class="node-title">Reconciliation</text><text x="1050" y="259" text-anchor="middle" class="body">GA4 · BigQuery · vendor</text>
<text x="1050" y="284" text-anchor="middle" class="body">backend truth</text></g>
