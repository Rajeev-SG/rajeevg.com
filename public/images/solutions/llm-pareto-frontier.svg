<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">LLM Pareto Frontier</title>
  <desc id="desc">A quality versus cost scatter plot with efficient frontier models connected along the upper-left edge.</desc>
  <defs>
    <pattern id="grid" width="82" height="62" patternUnits="userSpaceOnUse"><path d="M82 0H0V62" fill="none" stroke="#d8d4c8"/></pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dy="8" stdDeviation="10" flood-color="#152033" flood-opacity=".12"/></filter>
    <style>.serif{font-family:Georgia,'Times New Roman',serif;fill:#172033}.sans{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#566174}.label{font-size:18px;font-weight:650;fill:#172033;paint-order:stroke;stroke:#fbfaf5;stroke-width:7px;stroke-linejoin:round}</style>
  </defs>
  <rect width="1280" height="800" fill="#fbfaf5"/>
  <text x="64" y="76" class="serif" font-size="38" font-weight="700">LLM Pareto Frontier</text>
  <text x="64" y="112" class="sans" font-size="19">Quality versus cost, joined from official structured data</text>
  <g transform="translate(116 174)">
    <rect width="1068" height="510" rx="20" fill="#fffef9" stroke="#d8d4c8" filter="url(#soft)"/>
    <rect x="72" y="42" width="930" height="390" fill="url(#grid)"/>
    <path d="M72 432H1002M72 42V432" fill="none" stroke="#172033" stroke-width="2"/>
    <path d="M128 102C242 128 340 145 451 184S680 233 816 271 924 301 971 326" fill="none" stroke="#c45137" stroke-width="5" stroke-linecap="round"/>
    <g fill="#fffef9" stroke="#c45137" stroke-width="5"><circle cx="128" cy="102" r="11"/><circle cx="278" cy="139" r="11"/><circle cx="451" cy="184" r="11"/><circle cx="651" cy="229" r="11"/><circle cx="816" cy="271" r="11"/><circle cx="971" cy="326" r="11"/></g>
    <g fill="#5877a8" opacity=".72"><circle cx="211" cy="246" r="8"/><circle cx="345" cy="292" r="8"/><circle cx="397" cy="225" r="8"/><circle cx="531" cy="319" r="8"/><circle cx="598" cy="281" r="8"/><circle cx="716" cy="344" r="8"/><circle cx="760" cy="303" r="8"/><circle cx="875" cy="371" r="8"/><circle cx="928" cy="351" r="8"/></g>
    <text x="145" y="91" class="sans label">high quality / low cost</text>
    <text x="445" y="165" class="sans label">efficient frontier</text>
    <path d="M568 159C604 148 631 166 649 207" fill="none" stroke="#172033" stroke-width="1.8"/>
    <text x="536" y="489" text-anchor="middle" class="sans" font-size="17">Cost per million tokens →</text>
    <text x="25" y="245" text-anchor="middle" class="sans" font-size="17" transform="rotate(-90 25 245)">Quality score →</text>
  </g>
  <g transform="translate(64 730)"><circle cx="8" r="7" fill="#fffef9" stroke="#c45137" stroke-width="4"/><text x="25" y="6" class="sans" font-size="16">Pareto efficient</text><circle cx="184" r="7" fill="#5877a8" opacity=".72"/><text x="201" y="6" class="sans" font-size="16">Other matched models</text><text x="1216" y="6" text-anchor="end" class="serif" font-size="16" font-style="italic">Updated 2 Sep 2026</text></g>
</svg>
