<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Agent Operations Control Plane</title>
  <desc id="desc">Who keeps the fleet running when I am not looking.</desc>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#e7e2d5"/></pattern>
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="11" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="0.85"/></filter>
    <marker id="arrowEnd" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 9 5 L 0 10 z" fill="#172033"/></marker>
    <style>
      .rough { filter: url(#wobble); }
      .title { font: 700 34px Georgia, serif; fill: #172033; }
      .subtitle { font: 18px Georgia, serif; fill: #566174; }
      .node-title { font: 700 24px "Comic Sans MS", "Bradley Hand", cursive; fill: #172033; }
      .body { font: 17px "Comic Sans MS", "Bradley Hand", cursive; fill: #172033; }
      .arrow-label { font: 14px "Comic Sans MS", "Bradley Hand", cursive; fill: #566174; paint-order: stroke; stroke: #fbfaf5; stroke-width: 7px; }
      .footer { font: 16px Georgia, serif; font-style: italic; fill: #566174; }
    </style>
  </defs>
  <rect width="1280" height="720" fill="#fbfaf5"/>
  <rect width="1280" height="720" fill="url(#dots)" opacity=".68"/>
  <path d="M 48 101 C 330 98, 580 105, 846 100 S 1125 103, 1230 99" fill="none" stroke="#172033" stroke-width="2" stroke-opacity=".18" class="rough"/>
  <text x="48" y="60" class="title">Agent Operations Control Plane</text>
  <text x="48" y="91" class="subtitle">Who keeps the fleet running when I am not looking.</text>
  <g><path d="M 390 252 C 435 252, 435 252, 480 252" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/><text x="435" y="243" text-anchor="middle" class="arrow-label">state</text></g>
<g><path d="M 800 252 C 845 252, 845 252, 890 252" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/><text x="845" y="243" text-anchor="middle" class="arrow-label">alerts</text></g>
<g><path d="M 640 335 C 640 335, 640 430, 640 430" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/><text x="640" y="373.5" text-anchor="middle" class="arrow-label">recover</text></g>
  <g><rect x="70" y="170" width="320" height="165" rx="18" fill="#dce8ff" stroke="#4f6fad" stroke-width="3" class="rough"/><rect x="75" y="175" width="310" height="155" rx="14" fill="none" stroke="#4f6fad" stroke-opacity=".22" stroke-width="1.5"/><text x="230" y="213" text-anchor="middle" class="node-title">launchd</text><text x="230" y="249" text-anchor="middle" class="body">starts each agent</text>
<text x="230" y="274" text-anchor="middle" class="body">restarts on crash</text>
<text x="230" y="299" text-anchor="middle" class="body">runs on this Mac</text></g>
<g><rect x="480" y="170" width="320" height="165" rx="18" fill="#dcf3e5" stroke="#3f8460" stroke-width="3" class="rough"/><rect x="485" y="175" width="310" height="155" rx="14" fill="none" stroke="#3f8460" stroke-opacity=".22" stroke-width="1.5"/><text x="640" y="213" text-anchor="middle" class="node-title">Ops board</text><text x="640" y="249" text-anchor="middle" class="body">Semaphore view</text>
<text x="640" y="274" text-anchor="middle" class="body">state of every service</text>
<text x="640" y="299" text-anchor="middle" class="body">what changed and when</text></g>
<g><rect x="890" y="170" width="320" height="165" rx="18" fill="#fff0c9" stroke="#a97921" stroke-width="3" class="rough"/><rect x="895" y="175" width="310" height="155" rx="14" fill="none" stroke="#a97921" stroke-opacity=".22" stroke-width="1.5"/><text x="1050" y="213" text-anchor="middle" class="node-title">Alertmanager</text><text x="1050" y="249" text-anchor="middle" class="body">alarms on drift</text>
<text x="1050" y="274" text-anchor="middle" class="body">routes to Telegram</text>
<text x="1050" y="299" text-anchor="middle" class="body">silence when handled</text></g>
<g><rect x="480" y="430" width="320" height="165" rx="18" fill="#ffe1de" stroke="#a45350" stroke-width="3" class="rough"/><rect x="485" y="435" width="310" height="155" rx="14" fill="none" stroke="#a45350" stroke-opacity=".22" stroke-width="1.5"/><text x="640" y="473" text-anchor="middle" class="node-title">Runbooks</text><text x="640" y="509" text-anchor="middle" class="body">SOPs per failure mode</text>
<text x="640" y="534" text-anchor="middle" class="body">recovery paths</text>
<text x="640" y="559" text-anchor="middle" class="body">kept next to the alarms</text></g>
  <path d="M 48 674 C 360 670, 620 678, 950 672 S 1160 675, 1230 671" fill="none" stroke="#172033" stroke-width="1.5" stroke-opacity=".18" class="rough"/>
  <text x="640" y="700" text-anchor="middle" class="footer">Evidence date: 29 Aug 2026  ·  the plane runs from launchd to runbook without leaving the Mac</text>
</svg>