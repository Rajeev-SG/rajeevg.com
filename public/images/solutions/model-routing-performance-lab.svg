<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Model Routing Performance Lab</title>
  <desc id="desc">Same task, different routing. Measured, not assumed.</desc>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#e7e2d5"/></pattern>
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="11" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="0.85"/></filter>
    <marker id="arrowEnd" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 9 5 L 0 10 z" fill="#172033"/></marker>
    <style>
      .rough { filter: url(#wobble); }
      .title { font: 700 34px Georgia, serif; fill: #172033; }
      .subtitle { font: 18px Georgia, serif; fill: #566174; }
      .node-title { font: 700 24px "Comic Sans MS", "Bradley Hand", cursive; fill: #172033; }
      .body { font: 17px "Comic Sans MS", "Bradley Hand", cursive; fill: #172033; }
      .arrow-label { font: 14px "Comic Sans MS", "Bradley Hand", cursive; fill: #566174; paint-order: stroke; stroke: #fbfaf5; stroke-width: 7px; }
      .footer { font: 16px Georgia, serif; font-style: italic; fill: #566174; }
    </style>
  </defs>
  <rect width="1280" height="720" fill="#fbfaf5"/>
  <rect width="1280" height="720" fill="url(#dots)" opacity=".68"/>
  <path d="M 48 101 C 330 98, 580 105, 846 100 S 1125 103, 1230 99" fill="none" stroke="#172033" stroke-width="2" stroke-opacity=".18" class="rough"/>
  <text x="48" y="60" class="title">Model Routing Performance Lab</text>
  <text x="48" y="91" class="subtitle">Same task, different routing. Measured, not assumed.</text>
  <g><path d="M 390 282 C 435 282, 435 282, 480 282" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/><text x="435" y="273" text-anchor="middle" class="arrow-label">run</text></g>
<g><path d="M 800 282 C 845 282, 845 282, 890 282" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/><text x="845" y="273" text-anchor="middle" class="arrow-label">measure</text></g>
<g><path d="M 800 380 C 720 380, 720 430, 640 430" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/><text x="720" y="396" text-anchor="middle" class="arrow-label">compare</text></g>
  <g><rect x="90" y="200" width="300" height="165" rx="18" fill="#dce8ff" stroke="#4f6fad" stroke-width="3" class="rough"/><rect x="95" y="205" width="290" height="155" rx="14" fill="none" stroke="#4f6fad" stroke-opacity=".22" stroke-width="1.5"/><text x="240" y="243" text-anchor="middle" class="node-title">Identical task</text><text x="240" y="279" text-anchor="middle" class="body">controlled harness</text>
<text x="240" y="304" text-anchor="middle" class="body">same input every run</text></g>
<g><rect x="480" y="200" width="320" height="165" rx="18" fill="#e9e1ff" stroke="#7459a8" stroke-width="3" class="rough"/><rect x="485" y="205" width="310" height="155" rx="14" fill="none" stroke="#7459a8" stroke-opacity=".22" stroke-width="1.5"/><text x="640" y="243" text-anchor="middle" class="node-title">Routing policies</text><text x="640" y="279" text-anchor="middle" class="body">GLM-5.3-Flash</text>
<text x="640" y="304" text-anchor="middle" class="body">frontier fallback</text></g>
<g><rect x="890" y="200" width="300" height="165" rx="18" fill="#dcf3e5" stroke="#3f8460" stroke-width="3" class="rough"/><rect x="895" y="205" width="290" height="155" rx="14" fill="none" stroke="#3f8460" stroke-opacity=".22" stroke-width="1.5"/><text x="1040" y="243" text-anchor="middle" class="node-title">Measured result</text><text x="1040" y="279" text-anchor="middle" class="body">client timing</text>
<text x="1040" y="304" text-anchor="middle" class="body">provider telemetry</text>
<text x="1040" y="329" text-anchor="middle" class="body">cost per outcome</text></g>
<g><rect x="480" y="430" width="320" height="150" rx="18" fill="#fff0c9" stroke="#a97921" stroke-width="3" class="rough"/><rect x="485" y="435" width="310" height="140" rx="14" fill="none" stroke="#a97921" stroke-opacity=".22" stroke-width="1.5"/><text x="640" y="473" text-anchor="middle" class="node-title">Decision</text><text x="640" y="509" text-anchor="middle" class="body">routing rule updated</text>
<text x="640" y="534" text-anchor="middle" class="body">from data</text></g>
  <path d="M 48 674 C 360 670, 620 678, 950 672 S 1160 675, 1230 671" fill="none" stroke="#172033" stroke-width="1.5" stroke-opacity=".18" class="rough"/>
  <text x="640" y="700" text-anchor="middle" class="footer">Evidence date: 28 Aug 2026  ·  benchmark pairs client timing with provider telemetry</text>
</svg>