<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 16 1168 882" width="1168" height="882"><rect x="-4" y="16" width="1168" height="882" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#232F3E" stroke-width="1.5"/></marker></defs><line x1="360" y1="115" x2="430" y2="115" stroke="#232F3E" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 650 115 L 720 115 L 720 103.33333333333333" fill="none" stroke="#232F3E" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 940 115 L 960 115 L 960 103.33333333333333" fill="none" stroke="#232F3E" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 960 126.66666666666666 L 830 126.66666666666666 L 830 170" fill="none" stroke="#232F3E" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="940" y1="205" x2="960" y2="205" stroke="#232F3E" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 720 126.66666666666666 L 540 126.66666666666666 L 540 170" fill="none" stroke="#232F3E" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="540" y1="240" x2="540" y2="610" stroke="#232F3E" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="360" y1="385" x2="430" y2="385" stroke="#e11d48" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="650" y1="385" x2="720" y2="385" stroke="#e11d48" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 940 385 L 960 385 L 960 373.3333333333333" fill="none" stroke="#e11d48" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 960 396.6666666666667 L 254 396.6666666666667 L 254 600 L 250 600 L 250 610" fill="none" stroke="#e11d48" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="1035" y1="240" x2="1035" y2="610" stroke="#232F3E" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 960 650 L 246 650 L 246 160 L 250 160 L 250 150" fill="none" stroke="#e11d48" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="20" y="40" width="1120" height="230" fill="#f5f7fa" stroke="#999" stroke-width="1"/><text x="580" y="286" font-family="sans-serif" font-size="12" fill="#232F3E" text-anchor="middle">Day / every run</text><rect x="20" y="300" width="1120" height="230" fill="#f8fafc" stroke="#999" stroke-width="1"/><text x="580" y="546" font-family="sans-serif" font-size="12" fill="#232F3E" text-anchor="middle">Anything drifts</text><rect x="20" y="560" width="1120" height="260" fill="#f1f5f9" stroke="#999" stroke-width="1"/><text x="580" y="836" font-family="sans-serif" font-size="12" fill="#232F3E" text-anchor="middle">After the fix</text><rect x="140" y="80" width="220" height="70" fill="#dbeafe" stroke="#999" stroke-width="1"/><text x="250" y="166" font-family="sans-serif" font-size="12" fill="#232F3E" text-anchor="middle">Pick up the next task</text><rect x="430" y="80" width="220" height="70" fill="#dbeafe" stroke="#999" stroke-width="1"/><text x="540" y="166" font-family="sans-serif" font-size="12" fill="#232F3E" text-anchor="middle">Write the contract + acceptance</text><rect x="720" y="80" width="220" height="70" fill="#dbeafe" stroke="#999" stroke-width="1"/><text x="830" y="166" font-family="sans-serif" font-size="12" fill="#232F3E" text-anchor="middle">One session, bounded context</text><rect x="960" y="80" width="150" height="70" fill="#dbeafe" stroke="#999" stroke-width="1"/><text x="1035" y="166" font-family="sans-serif" font-size="12" fill="#232F3E" text-anchor="middle">Scoped tool + sandbox grants</text><rect x="430" y="170" width="220" height="70" fill="#ede9fe" stroke="#999" stroke-width="1"/><text x="540" y="256" font-family="sans-serif" font-size="12" fill="#232F3E" text-anchor="middle">Telemetry: sessions, tokens, cost</text><rect x="720" y="170" width="220" height="70" fill="#dcfce7" stroke="#999" stroke-width="1"/><text x="830" y="256" font-family="sans-serif" font-size="12" fill="#232F3E" text-anchor="middle">Acceptance proof vs contract</text><rect x="960" y="170" width="150" height="70" fill="#dcfce7" stroke="#999" stroke-width="1"/><text x="1035" y="256" font-family="sans-serif" font-size="12" fill="#232F3E" text-anchor="middle">Land it or throw the worktree away</text><rect x="140" y="350" width="220" height="70" fill="#fef3c7" stroke="#999" stroke-width="1"/><text x="250" y="436" font-family="sans-serif" font-size="12" fill="#232F3E" text-anchor="middle">Drift: alerts fire, contract missed</text><rect x="430" y="350" width="220" height="70" fill="#fef3c7" stroke="#999" stroke-width="1"/><text x="540" y="436" font-family="sans-serif" font-size="12" fill="#232F3E" text-anchor="middle">One human alert channel</text><rect x="720" y="350" width="220" height="70" fill="#ffe4e6" stroke="#999" stroke-width="1"/><text x="830" y="436" font-family="sans-serif" font-size="12" fill="#232F3E" text-anchor="middle">One runbook per known failure</text><rect x="960" y="350" width="150" height="70" fill="#ffe4e6" stroke="#999" stroke-width="1"/><text x="1035" y="436" font-family="sans-serif" font-size="12" fill="#232F3E" text-anchor="middle">Fix the cause, not this run</text><rect x="140" y="610" width="220" height="80" fill="#f3e8ff" stroke="#999" stroke-width="1"/><text x="250" y="706" font-family="sans-serif" font-size="12" fill="#232F3E" text-anchor="middle">Review loop: contract / routing / perms</text><rect x="430" y="610" width="220" height="80" fill="#f3e8ff" stroke="#999" stroke-width="1"/><text x="540" y="706" font-family="sans-serif" font-size="12" fill="#232F3E" text-anchor="middle">Update budget + routing rules</text><rect x="720" y="610" width="220" height="80" fill="#f3e8ff" stroke="#999" stroke-width="1"/><text x="830" y="706" font-family="sans-serif" font-size="12" fill="#232F3E" text-anchor="middle">Write the next runbook</text><rect x="960" y="610" width="150" height="80" fill="#e0f2fe" stroke="#999" stroke-width="1"/><text x="1035" y="706" font-family="sans-serif" font-size="12" fill="#232F3E" text-anchor="middle">Keeper restarts what died only</text><rect x="140" y="780" width="300" height="70" fill="#ffffff" stroke="#999" stroke-width="1"/><text x="290" y="866" font-family="sans-serif" font-size="12" fill="#232F3E" text-anchor="middle">Gray: work + telemetry. Red: incident and learning loop.</text></svg>