<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 770" role="img" aria-labelledby="t d">
<title id="t">The Agent Ops operating loop</title>
<desc id="d">A seeded task is handed off and done in a bounded worktree. The acceptance gate closes the loop by merging or discarding. Failed checks branch into recovery through one runbook and a cause fix. The run's lessons update three rules — contract, routing, permissions — which feed the next hand-off.</desc>
<defs>
<marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#2f9e44" stroke-width="1.8" stroke-linecap="round"/></marker>
<marker id="mo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#e8590c" stroke-width="1.8" stroke-linecap="round"/></marker>
<marker id="mr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#e03131" stroke-width="1.6" stroke-linecap="round"/></marker>
<marker id="mp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#7048e8" stroke-width="1.6" stroke-linecap="round"/></marker>
</defs>
<rect width="1400" height="770" fill="#ffffff"/>

<text x="70" y="72" font-family="ui-sans-serif, system-ui, -apple-system" font-size="34" font-weight="700" fill="#1f2430">The Agent Ops operating loop</text>
<text x="70" y="108" font-family="ui-sans-serif, system-ui, -apple-system" font-size="19" fill="#57606a">A run only counts when it closes through acceptance — and what failed rewrites what the next run may do.</text>

<!-- execution path (green, solid) -->
<path d="M 390,416 Q 531,370 570,228" fill="none" stroke="#2f9e44" stroke-width="4" stroke-linecap="round" marker-end="url(#mg)"/>
<path d="M 880,228 Q 966,342 1108,362" fill="none" stroke="#2f9e44" stroke-width="4" stroke-linecap="round" marker-end="url(#mg)"/>

<!-- acceptance close (orange, solid, gate diamond) -->
<path d="M 1120,479 Q 692,638 272,458" fill="none" stroke="#e8590c" stroke-width="4" stroke-linecap="round" marker-end="url(#mo)"/>
<text x="860" y="596" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system" font-size="19" font-weight="600" fill="#e8590c">merge or discard — back to the next task</text>

<!-- failure branch (red, dashed) -->
<path d="M 1180,479 Q 1248,527 1245,610" fill="none" stroke="#e03131" stroke-width="3" stroke-dasharray="8 8" stroke-linecap="round" marker-end="url(#mr)"/>

<!-- learning feedback (purple, dotted) -->
<path d="M 1120,648 Q 966,678 812,648" fill="none" stroke="#7048e8" stroke-width="3" stroke-dasharray="3 7" stroke-linecap="round" marker-end="url(#mp)"/>
<path d="M 345,610 Q 254,560 272,458" fill="none" stroke="#7048e8" stroke-width="3" stroke-dasharray="3 7" stroke-linecap="round" marker-end="url(#mp)"/>
<text x="283" y="582" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system" font-size="16" font-weight="600" letter-spacing="1" fill="#7048e8">LEARNING UPDATES</text>

<!-- nodes -->
<rect x="150" y="378" width="240" height="76" rx="16" fill="#eaf6ee" stroke="#2f9e44" stroke-width="3"/>
<text x="270" y="411" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system" font-size="25" font-weight="700" fill="#1f2430">Hand off</text>
<text x="270" y="436" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system" font-size="16" fill="#57606a">one seeded task</text>

<rect x="570" y="190" width="310" height="76" rx="16" fill="#eaf6ee" stroke="#2f9e44" stroke-width="3"/>
<text x="725" y="223" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system" font-size="25" font-weight="700" fill="#1f2430">Bounded work</text>
<text x="725" y="248" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system" font-size="16" fill="#57606a">one worktree, scoped tools</text>

<path d="M 1120,351 L 1245,415 L 1120,479 L 995,415 Z" fill="#fff4e6" stroke="#e8590c" stroke-width="3"/>
<text x="1120" y="326" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system" font-size="25" font-weight="700" fill="#e8590c">Acceptance gate</text>

<rect x="1120" y="610" width="250" height="76" rx="16" fill="#fff5f5" stroke="#e03131" stroke-width="3"/>
<text x="1245" y="643" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system" font-size="25" font-weight="700" fill="#1f2430">Recovery</text>
<text x="1245" y="668" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system" font-size="16" fill="#57606a">one runbook, fix the cause</text>

<!-- learning chips -->
<rect x="300" y="610" width="150" height="64" rx="32" fill="#f3effd" stroke="#7048e8" stroke-width="2.5"/>
<text x="375" y="651" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system" font-size="21" font-weight="600" fill="#4c3aad">Contract</text>
<rect x="470" y="610" width="140" height="64" rx="32" fill="#f3effd" stroke="#7048e8" stroke-width="2.5"/>
<text x="540" y="651" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system" font-size="21" font-weight="600" fill="#4c3aad">Routing</text>
<rect x="630" y="610" width="180" height="64" rx="32" fill="#f3effd" stroke="#7048e8" stroke-width="2.5"/>
<text x="720" y="651" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system" font-size="21" font-weight="600" fill="#4c3aad">Permissions</text>
</svg>