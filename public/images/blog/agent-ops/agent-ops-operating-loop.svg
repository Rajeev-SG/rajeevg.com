        <mxCell id="check" value="Acceptance proof against the&#xa;contract, not the agent's word" style="rounded=1;whiteSpace=wrap;html=1;fillColor=#dcfce7;strokeColor=#16a34a;fontSize=13;" vertex="1" parent="1">
          <mxGeometry x="720" y="170" width="220" height="70" as="geometry" />
