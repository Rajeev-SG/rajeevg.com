<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
<title>JEV Two Transports</title>
<desc>Diagram showing the same single hop implemented by two different stacks: Browser Relay and Playwriter.</desc>
<defs>
<pattern id="dotgrid" width="20" height="20" patternUnits="userSpaceOnUse">
<circle cx="10" cy="10" r="0.7" fill="#e7e2d5"/>
</pattern>
<filter id="wobble">
<feTurbulence type="turbulence" baseFrequency="0.015" numOctaves="2" result="turb" seed="3"/>
<feDisplacementMap in="SourceGraphic" in2="turb" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
<marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#566174"/>
</marker>
</defs>
<style>
.title{font:700 28px/1 "Inter",system-ui,sans-serif;fill:#172033}
.subtitle{font:400 18px/1 "Inter",system-ui,sans-serif;fill:#566174}
.boxtitle{font:600 18px/1 "Inter",system-ui,sans-serif;fill:#172033}
.boxbody{font:400 16px/1 "JetBrains Mono","Fira Code",monospace;fill:#566174}
.stacklabel{font:700 17px/1 "Inter",system-ui,sans-serif;fill:#566174;letter-spacing:0.5px;text-transform:uppercase}
.annotation{font:400 14px/1 "Inter",system-ui,sans-serif;fill:#172033}
.footer{font:400 14px/1 "Inter",system-ui,sans-serif;fill:#566174}
</style>
<rect width="1280" height="720" fill="#fbfaf5"/>
<rect width="1280" height="720" fill="url(#dotgrid)"/>
<text x="48" y="60" class="title">JEV Two Transports</text>
<text x="48" y="91" class="subtitle">Same single hop, two different stacks · Browser Relay vs Playwriter</text>
<line x1="48" y1="101" x2="1232" y2="101" stroke="#e7e2d5" stroke-width="1"/>
<g filter="url(#wobble)">
<rect x="340" y="112" width="600" height="70" rx="8" fill="#dcf3e5" stroke="#3f8460" stroke-width="1.5"/>
</g>
<text x="355" y="140" class="boxtitle">BridgeBrowser</text>
<text x="355" y="162" class="boxbody">hands over a selector, one action at a time</text>
<text x="80" y="204" class="stacklabel">BROWSER RELAY</text>
<g filter="url(#wobble)">
<rect x="80" y="214" width="430" height="82" rx="8" fill="#dce8ff" stroke="#4f6fad" stroke-width="1.5"/>
</g>
<text x="94" y="242" class="boxtitle">browser-relay CLI</text>
<text x="94" y="266" class="boxbody">browser-relay click &quot;&lt;sel&gt;&quot; --tab t_X</text>
<g filter="url(#wobble)">
<rect x="80" y="302" width="430" height="82" rx="8" fill="#dce8ff" stroke="#4f6fad" stroke-width="1.5"/>
</g>
<text x="94" y="330" class="boxtitle">Local relay server</text>
<text x="94" y="354" class="boxbody">http://127.0.0.1:18795</text>
<g filter="url(#wobble)">
<rect x="80" y="390" width="430" height="82" rx="8" fill="#dce8ff" stroke="#4f6fad" stroke-width="1.5"/>
</g>
<text x="94" y="418" class="boxtitle">Chrome extension (MV3)</text>
<text x="94" y="442" class="boxbody">holds a WebSocket to the server</text>
<g filter="url(#wobble)">
<rect x="80" y="478" width="430" height="82" rx="8" fill="#dce8ff" stroke="#4f6fad" stroke-width="1.5"/>
</g>
<text x="94" y="506" class="boxtitle">chrome.debugger API</text>
<text x="94" y="530" class="boxbody">attaches to the tab, dispatches input</text>
<line x1="295" y1="296" x2="295" y2="302" stroke="#4f6fad" stroke-width="1.5" marker-end="url(#arrowhead)"/>
<line x1="295" y1="384" x2="295" y2="390" stroke="#4f6fad" stroke-width="1.5" marker-end="url(#arrowhead)"/>
<line x1="295" y1="472" x2="295" y2="478" stroke="#4f6fad" stroke-width="1.5" marker-end="url(#arrowhead)"/>
<text x="700" y="204" class="stacklabel">PLAYWRITER</text>
<g filter="url(#wobble)">
<rect x="700" y="214" width="430" height="82" rx="8" fill="#dcf3e5" stroke="#3f8460" stroke-width="1.5"/>
</g>
<text x="714" y="242" class="boxtitle">playwriter CLI</text>
<text x="714" y="266" class="boxbody">playwriter -s 3 -e &quot;await page...&quot;</text>
<g filter="url(#wobble)">
<rect x="700" y="302" width="430" height="82" rx="8" fill="#dcf3e5" stroke="#3f8460" stroke-width="1.5"/>
</g>
<text x="714" y="330" class="boxtitle">Persistent session</text>
<text x="714" y="354" class="boxbody">keeps a live Page object</text>
<g filter="url(#wobble)">
<rect x="700" y="390" width="430" height="95" rx="8" fill="#dcf3e5" stroke="#3f8460" stroke-width="1.5"/>
</g>
<text x="714" y="418" class="boxtitle">Playwright API</text>
<text x="714" y="442" class="boxbody">locator().click() / keyboard.press()</text>
<text x="714" y="462" class="boxbody">mouse.wheel()</text>
<line x1="915" y1="296" x2="915" y2="302" stroke="#3f8460" stroke-width="1.5" marker-end="url(#arrowhead)"/>
<line x1="915" y1="384" x2="915" y2="390" stroke="#3f8460" stroke-width="1.5" marker-end="url(#arrowhead)"/>
<line x1="440" y1="182" x2="295" y2="214" stroke="#566174" stroke-width="1.5" marker-end="url(#arrowhead)"/>
<line x1="840" y1="182" x2="915" y2="214" stroke="#566174" stroke-width="1.5" marker-end="url(#arrowhead)"/>
<g filter="url(#wobble)">
<rect x="700" y="500" width="490" height="68" rx="6" fill="#fff0c9" stroke="#a97921" stroke-width="1.5"/>
</g>
<text x="712" y="520" class="annotation">Spawn per action: ~42 ms (relay), ~109 ms (playwriter).</text>
<text x="712" y="538" class="annotation">Same task, 5 runs each: 13.1 s versus 16.1 s median.</text>
<g filter="url(#wobble)">
<rect x="340" y="586" width="600" height="70" rx="8" fill="#e9e1ff" stroke="#7459a8" stroke-width="1.5"/>
</g>
<text x="355" y="614" class="boxtitle">Your Chrome tab</text>
<text x="355" y="636" class="boxbody">the profile you are already logged into</text>
<line x1="295" y1="560" x2="460" y2="586" stroke="#566174" stroke-width="1.5" marker-end="url(#arrowhead)"/>
<line x1="915" y1="485" x2="820" y2="586" stroke="#566174" stroke-width="1.5" marker-end="url(#arrowhead)"/>
<line x1="48" y1="674" x2="1232" y2="674" stroke="#e7e2d5" stroke-width="1"/>
<text x="640" y="700" text-anchor="middle" class="footer">jev-browser-bridge · two transports, one hop</text>
</svg>