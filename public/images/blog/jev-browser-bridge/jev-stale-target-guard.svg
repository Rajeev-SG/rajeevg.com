<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Why the model cannot click the wrong button</title>
  <desc id="desc">Four checks run between the decision and the input. Any failure means re-observe, never guess.</desc>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#e7e2d5"/></pattern>
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="11" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="0.85"/></filter>
    <marker id="arrowEnd" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 9 5 L 0 10 z" fill="#172033"/></marker>
    <marker id="arrowStart" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto-start-reverse"><path d="M 10 0 L 1 5 L 10 10 z" fill="#172033"/></marker>
    <style>
      .rough { filter: url(#wobble); }
      .title { font: 700 34px Georgia, serif; fill: #172033; }
      .subtitle { font: 18px Georgia, serif; fill: #566174; }
      .node-title { font: 700 24px "Comic Sans MS", "Bradley Hand", cursive; fill: #172033; }
      .body { font: 17px "Comic Sans MS", "Bradley Hand", cursive; fill: #172033; }
      .arrow-label { font: 14px "Comic Sans MS", "Bradley Hand", cursive; fill: #566174; paint-order: stroke; stroke: #fbfaf5; stroke-width: 7px; }
      .footer { font: 16px Georgia, serif; font-style: italic; fill: #566174; }
    </style>
  </defs>
  <rect width="1280" height="720" fill="#fbfaf5"/>
  <rect width="1280" height="720" fill="url(#dots)" opacity=".68"/>
  <path d="M 48 101 C 330 98, 580 105, 846 100 S 1125 103, 1230 99" fill="none" stroke="#172033" stroke-width="2" stroke-opacity=".18" class="rough"/>
  <text x="48" y="60" class="title">Why the model cannot click the wrong button</text>
  <text x="48" y="91" class="subtitle">Four checks run between the decision and the input. Any failure means re-observe, never guess.</text>
  <g><path d="M 318 300 C 354 300, 354 187, 390 187" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/><text x="336" y="220.5" text-anchor="middle" class="arrow-label">check</text></g>
<g><path d="M 585 242 C 585 242, 585 262, 585 262" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/></g>
<g><path d="M 585 372 C 585 372, 585 392, 585 392" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/></g>
<g><path d="M 585 502 C 585 502, 585 522, 585 522" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/></g>
<g><path d="M 785 590 C 857.5 590, 857.5 350, 930 350" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/><text x="797.5" y="537" text-anchor="middle" class="arrow-label">all four pass</text></g>
<g><path d="M 785 440 C 857.5 440, 857.5 540, 930 540" fill="none" stroke="#172033" stroke-width="2.5" stroke-dasharray="10 9" marker-end="url(#arrowEnd)" class="rough"/><text x="889.5" y="451" text-anchor="middle" class="arrow-label">any one fails</text></g>
  <g transform="rotate(-0.25 183 325)"><rect x="48" y="250" width="270" height="150" rx="18" fill="#dce8ff" stroke="#4f6fad" stroke-width="3" class="rough"/><rect x="53" y="255" width="260" height="140" rx="14" fill="none" stroke="#4f6fad" stroke-opacity=".22" stroke-width="1.5"/><text x="183" y="293" text-anchor="middle" class="node-title">Jev says CLICK [7]</text><text x="183" y="329" text-anchor="middle" class="body">[7] was true when it</text>
<text x="183" y="354" text-anchor="middle" class="body">observed the page</text></g>
<g transform="rotate(0.25 585 187)"><rect x="390" y="132" width="390" height="110" rx="18" fill="#fff0c9" stroke="#a97921" stroke-width="3" class="rough"/><rect x="395" y="137" width="380" height="100" rx="14" fill="none" stroke="#a97921" stroke-opacity=".22" stroke-width="1.5"/><text x="585" y="175" text-anchor="middle" class="node-title">1 · still the same page?</text><text x="585" y="211" text-anchor="middle" class="body">page key + scroll + fields</text></g>
<g transform="rotate(-0.25 585 317)"><rect x="390" y="262" width="390" height="110" rx="18" fill="#fff0c9" stroke="#a97921" stroke-width="3" class="rough"/><rect x="395" y="267" width="380" height="100" rx="14" fill="none" stroke="#a97921" stroke-opacity=".22" stroke-width="1.5"/><text x="585" y="305" text-anchor="middle" class="node-title">2 · still the same node?</text><text x="585" y="341" text-anchor="middle" class="body">connected, enabled, visible</text></g>
<g transform="rotate(0.25 585 447)"><rect x="390" y="392" width="390" height="110" rx="18" fill="#fff0c9" stroke="#a97921" stroke-width="3" class="rough"/><rect x="395" y="397" width="380" height="100" rx="14" fill="none" stroke="#a97921" stroke-opacity=".22" stroke-width="1.5"/><text x="585" y="435" text-anchor="middle" class="node-title">3 · is anything on top of it?</text><text x="585" y="471" text-anchor="middle" class="body">hit-test at its centre</text></g>
<g transform="rotate(-0.25 585 577)"><rect x="390" y="522" width="390" height="110" rx="18" fill="#fff0c9" stroke="#a97921" stroke-width="3" class="rough"/><rect x="395" y="527" width="380" height="100" rx="14" fill="none" stroke="#a97921" stroke-opacity=".22" stroke-width="1.5"/><text x="585" y="565" text-anchor="middle" class="node-title">4 · stamp and act</text><text x="585" y="601" text-anchor="middle" class="body">one-use attribute → selector</text></g>
<g transform="rotate(0.25 1070 325)"><rect x="930" y="250" width="280" height="150" rx="18" fill="#dcf3e5" stroke="#3f8460" stroke-width="3" class="rough"/><rect x="935" y="255" width="270" height="140" rx="14" fill="none" stroke="#3f8460" stroke-opacity=".22" stroke-width="1.5"/><text x="1070" y="293" text-anchor="middle" class="node-title">Execute once</text><text x="1070" y="329" text-anchor="middle" class="body">the attribute is</text>
<text x="1070" y="354" text-anchor="middle" class="body">removed after use</text></g>
<g transform="rotate(-0.25 1070 545)"><rect x="930" y="470" width="280" height="150" rx="18" fill="#ffe1de" stroke="#a45350" stroke-width="3" class="rough"/><rect x="935" y="475" width="270" height="140" rx="14" fill="none" stroke="#a45350" stroke-opacity=".22" stroke-width="1.5"/><text x="1070" y="513" text-anchor="middle" class="node-title">StalePage</text><text x="1070" y="549" text-anchor="middle" class="body">nothing is clicked</text>
<text x="1070" y="574" text-anchor="middle" class="body">observe again</text></g>
  <path d="M 48 674 C 360 670, 620 678, 950 672 S 1160 675, 1230 671" fill="none" stroke="#172033" stroke-width="1.5" stroke-opacity=".18" class="rough"/>
  <text x="640" y="700" text-anchor="middle" class="footer">A covered or moved target becomes a failed decision, not a wrong click. Evidence date: 20 Sep 2026.</text>
</svg>