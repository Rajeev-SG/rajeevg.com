<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">The loop: Jev picks a number, code does the rest</title>
  <desc id="desc">One decision per turn. The model never sees a selector, a coordinate, or a line of JavaScript.</desc>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#e7e2d5"/></pattern>
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="11" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="0.85"/></filter>
    <marker id="arrowEnd" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 9 5 L 0 10 z" fill="#172033"/></marker>
    <marker id="arrowStart" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto-start-reverse"><path d="M 10 0 L 1 5 L 10 10 z" fill="#172033"/></marker>
    <style>
      .rough { filter: url(#wobble); }
      .title { font: 700 34px Georgia, serif; fill: #172033; }
      .subtitle { font: 18px Georgia, serif; fill: #566174; }
      .node-title { font: 700 24px "Comic Sans MS", "Bradley Hand", cursive; fill: #172033; }
      .body { font: 17px "Comic Sans MS", "Bradley Hand", cursive; fill: #172033; }
      .arrow-label { font: 14px "Comic Sans MS", "Bradley Hand", cursive; fill: #566174; paint-order: stroke; stroke: #fbfaf5; stroke-width: 7px; }
      .footer { font: 16px Georgia, serif; font-style: italic; fill: #566174; }
    </style>
  </defs>
  <rect width="1280" height="720" fill="#fbfaf5"/>
  <rect width="1280" height="720" fill="url(#dots)" opacity=".68"/>
  <path d="M 48 101 C 330 98, 580 105, 846 100 S 1125 103, 1230 99" fill="none" stroke="#172033" stroke-width="2" stroke-opacity=".18" class="rough"/>
  <text x="48" y="60" class="title">The loop: Jev picks a number, code does the rest</text>
  <text x="48" y="91" class="subtitle">One decision per turn. The model never sees a selector, a coordinate, or a line of JavaScript.</text>
  <g><path d="M 288 260 C 323 260, 323 260, 358 260" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/><text x="323" y="221" text-anchor="middle" class="arrow-label">observe</text></g>
<g><path d="M 598 260 C 633 260, 633 260, 668 260" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/><text x="633" y="221" text-anchor="middle" class="arrow-label">decide</text></g>
<g><path d="M 908 260 C 943 260, 943 260, 978 260" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/><text x="943" y="221" text-anchor="middle" class="arrow-label">act</text></g>
<g><path d="M 1098 470 C 633 470, 633 470, 168 470" fill="none" stroke="#172033" stroke-width="2.5" stroke-dasharray="10 9" marker-end="url(#arrowEnd)" class="rough"/><text x="633" y="495" text-anchor="middle" class="arrow-label">the page changed → observe again</text></g>
  <g transform="rotate(-0.25 168 285)"><rect x="48" y="180" width="240" height="210" rx="18" fill="#dce8ff" stroke="#4f6fad" stroke-width="3" class="rough"/><rect x="53" y="185" width="230" height="200" rx="14" fill="none" stroke="#4f6fad" stroke-opacity=".22" stroke-width="1.5"/><text x="168" y="223" text-anchor="middle" class="node-title">Jev agent</text><text x="168" y="259" text-anchor="middle" class="body">holds the goal</text>
<text x="168" y="284" text-anchor="middle" class="body">chooses ONE action</text>
<text x="168" y="309" text-anchor="middle" class="body">from the menu it</text>
<text x="168" y="334" text-anchor="middle" class="body">was handed</text>
<text x="168" y="359" text-anchor="middle" class="body">→ CLICK [7]</text></g>
<g transform="rotate(0.25 478 285)"><rect x="358" y="180" width="240" height="210" rx="18" fill="#fff0c9" stroke="#a97921" stroke-width="3" class="rough"/><rect x="363" y="185" width="230" height="200" rx="14" fill="none" stroke="#a97921" stroke-opacity=".22" stroke-width="1.5"/><text x="478" y="223" text-anchor="middle" class="node-title">snapshot.js</text><text x="478" y="259" text-anchor="middle" class="body">runs in the page</text>
<text x="478" y="284" text-anchor="middle" class="body">builds the element</text>
<text x="478" y="309" text-anchor="middle" class="body">table it can see</text>
<text x="478" y="334" text-anchor="middle" class="body"></text>
<text x="478" y="359" text-anchor="middle" class="body">[1] Search  [2] Go</text>
<text x="478" y="384" text-anchor="middle" class="body">[3] link Active</text></g>
<g transform="rotate(-0.25 788 285)"><rect x="668" y="180" width="240" height="210" rx="18" fill="#dcf3e5" stroke="#3f8460" stroke-width="3" class="rough"/><rect x="673" y="185" width="230" height="200" rx="14" fill="none" stroke="#3f8460" stroke-opacity=".22" stroke-width="1.5"/><text x="788" y="223" text-anchor="middle" class="node-title">BridgeBrowser</text><text x="788" y="259" text-anchor="middle" class="body">re-checks the chosen</text>
<text x="788" y="284" text-anchor="middle" class="body">node is still there,</text>
<text x="788" y="309" text-anchor="middle" class="body">stamps a one-use</text>
<text x="788" y="334" text-anchor="middle" class="body">attribute on it,</text>
<text x="788" y="359" text-anchor="middle" class="body"></text>
<text x="788" y="384" text-anchor="middle" class="body">then hands a selector</text>
<text x="788" y="409" text-anchor="middle" class="body">to the transport</text></g>
<g transform="rotate(0.25 1098 285)"><rect x="978" y="180" width="240" height="210" rx="18" fill="#e9e1ff" stroke="#7459a8" stroke-width="3" class="rough"/><rect x="983" y="185" width="230" height="200" rx="14" fill="none" stroke="#7459a8" stroke-opacity=".22" stroke-width="1.5"/><text x="1098" y="223" text-anchor="middle" class="node-title">Your Chrome</text><text x="1098" y="259" text-anchor="middle" class="body">the tab you already</text>
<text x="1098" y="284" text-anchor="middle" class="body">have open</text>
<text x="1098" y="309" text-anchor="middle" class="body"></text>
<text x="1098" y="334" text-anchor="middle" class="body">real click,</text>
<text x="1098" y="359" text-anchor="middle" class="body">real typing,</text>
<text x="1098" y="384" text-anchor="middle" class="body">real scroll</text></g>
  <path d="M 48 674 C 360 670, 620 678, 950 672 S 1160 675, 1230 671" fill="none" stroke="#172033" stroke-width="1.5" stroke-opacity=".18" class="rough"/>
  <text x="640" y="700" text-anchor="middle" class="footer">The model's whole output is an index it saw. Everything that touches the browser is code-owned. Evidence date: 20 Sep 2026.</text>
</svg>