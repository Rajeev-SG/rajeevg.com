<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <title>Jev Call Chain: Who Calls What, In Order</title>
  <desc>The Agent loop is the only piece that talks to both Jev and the browser. Jev never touches the transport.</desc>
  <defs>
    <pattern id="dotgrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#e7e2d5"/>
    </pattern>
    <filter id="wobble" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#172033"/>
    </marker>
  </defs>
  <style>
    .title { font: 700 30px/1 "Inter", "Segoe UI", sans-serif; fill: #172033; }
    .subtitle { font: 400 14.5px/1 "Inter", "Segoe UI", sans-serif; fill: #566174; }
    .node-title { font: 700 17px/1 "Inter", "Segoe UI", sans-serif; fill: #172033; }
    .node-body { font: 400 14.5px/1 "Inter", "Segoe UI", sans-serif; fill: #566174; }
    .arrow-label { font: 600 15px/1 "Inter", "Segoe UI", sans-serif; fill: #172033; text-anchor: middle; paint-order: stroke; stroke: #fbfaf5; stroke-width: 6px; stroke-linejoin: round; }
    .annotation { font: italic 400 15px/1 "Inter", "Segoe UI", sans-serif; fill: #566174; }
    .footer { font: 400 14px/1 "Inter", "Segoe UI", sans-serif; fill: #566174; text-anchor: middle; }
  </style>
  <rect width="1280" height="720" fill="#fbfaf5"/>
  <rect width="1280" height="720" fill="url(#dotgrid)"/>
  <text x="48" y="60" class="title">Jev Call Chain: Who Calls What, In Order</text>
  <text x="48" y="91" class="subtitle">The Agent loop is the only piece that talks to both Jev and the browser. Jev never touches the transport.</text>
  <line x1="48" y1="101" x2="1232" y2="101" stroke="#e7e2d5" stroke-width="1"/>
  <line x1="48" y1="674" x2="1232" y2="674" stroke="#e7e2d5" stroke-width="1"/>
  <text x="640" y="700" class="footer">jev-browser-bridge · call-chain diagram</text>
  <g filter="url(#wobble)">
    <rect x="48" y="140" width="230" height="182" rx="10" fill="#fff0c9" stroke="#a97921" stroke-width="2"/>
    <text x="62" y="186" class="node-title">Driver script (Python)</text>
    <text x="62" y="226" class="node-body">builds the loop</text>
    <text x="62" y="252" class="node-body">passes url + goal</text>
    <text x="62" y="278" class="node-body">calls agent.run()</text>
    <rect x="360" y="210" width="300" height="182" rx="10" fill="#e9e1ff" stroke="#7459a8" stroke-width="2"/>
    <text x="374" y="256" class="node-title">Jev Agent loop</text>
    <text x="374" y="296" class="node-body">the only piece that talks</text>
    <text x="374" y="322" class="node-body">to both Jev and the browser</text>
    <text x="374" y="348" class="node-body">repeats until DONE or BLOCKED</text>
    <rect x="740" y="130" width="260" height="182" rx="10" fill="#dce8ff" stroke="#4f6fad" stroke-width="2"/>
    <text x="754" y="176" class="node-title">Jev (model over HTTP)</text>
    <text x="754" y="216" class="node-body">picks the next action</text>
    <text x="754" y="242" class="node-body">returns ONE index</text>
    <text x="754" y="268" class="node-body">never touches the browser</text>
    <rect x="300" y="470" width="280" height="182" rx="10" fill="#dcf3e5" stroke="#3f8460" stroke-width="2"/>
    <text x="314" y="516" class="node-title">BridgeBrowser</text>
    <text x="314" y="556" class="node-body">re-checks the chosen node</text>
    <text x="314" y="582" class="node-body">builds a CSS selector</text>
    <text x="314" y="608" class="node-body">never guesses</text>
    <rect x="690" y="470" width="300" height="182" rx="10" fill="#ffe1de" stroke="#a45350" stroke-width="2"/>
    <text x="704" y="516" class="node-title">Transport</text>
    <text x="704" y="556" class="node-body">Playwriter or Browser Relay</text>
    <text x="704" y="582" class="node-body">one per run, set by an env var</text>
    <text x="704" y="608" class="node-body">performs the native action</text>
    <rect x="1080" y="470" width="180" height="156" rx="10" fill="#fff0c9" stroke="#a97921" stroke-width="2"/>
    <text x="1094" y="516" class="node-title">Your Chrome</text>
    <text x="1094" y="556" class="node-body">the tab you are logged into</text>
    <text x="1094" y="582" class="node-body">real click, real typing</text>
    <line x1="270" y1="200" x2="366" y2="232" stroke="#172033" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="292" y="198" class="arrow-label">1. starts the loop</text>
    <line x1="660" y1="215" x2="736" y2="205" stroke="#172033" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="696" y="190" class="arrow-label">2. decide</text>
    <line x1="440" y1="392" x2="440" y2="466" stroke="#172033" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="486" y="427" class="arrow-label">3. act</text>
    <line x1="580" y1="520" x2="690" y2="520" stroke="#172033" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="635" y="506" class="arrow-label">4. selector</text>
    <line x1="996" y1="524" x2="1056" y2="524" stroke="#172033" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="1026" y="502" class="arrow-label">5. drives</text>
    <text x="700" y="410" class="annotation">Jev and the transport never communicate directly.</text>
    <text x="700" y="430" class="annotation">The Agent loop sits between them.</text>
  </g>
</svg>