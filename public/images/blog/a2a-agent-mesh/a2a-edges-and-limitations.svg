<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">The edges are operational, not conceptual</title>
  <desc id="desc">The protocol path works. These are the places where a production version still needs care.</desc>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#e7e2d5"/></pattern>
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="11" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="0.85"/></filter>
    <marker id="arrowEnd" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 9 5 L 0 10 z" fill="#172033"/></marker>
    <marker id="arrowStart" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto-start-reverse"><path d="M 10 0 L 1 5 L 10 10 z" fill="#172033"/></marker>
    <style>
      .rough { filter: url(#wobble); }
      .title { font: 700 34px Georgia, serif; fill: #172033; }
      .subtitle { font: 18px Georgia, serif; fill: #566174; }
      .node-title { font: 700 24px "Comic Sans MS", "Bradley Hand", cursive; fill: #172033; }
      .body { font: 17px "Comic Sans MS", "Bradley Hand", cursive; fill: #172033; }
      .arrow-label { font: 14px "Comic Sans MS", "Bradley Hand", cursive; fill: #566174; paint-order: stroke; stroke: #fbfaf5; stroke-width: 7px; }
      .footer { font: 16px Georgia, serif; font-style: italic; fill: #566174; }
    </style>
  </defs>
  <rect width="1280" height="720" fill="#fbfaf5"/>
  <rect width="1280" height="720" fill="url(#dots)" opacity=".68"/>
  <path d="M 48 101 C 330 98, 580 105, 846 100 S 1125 103, 1230 99" fill="none" stroke="#172033" stroke-width="2" stroke-opacity=".18" class="rough"/>
  <text x="48" y="60" class="title">The edges are operational, not conceptual</text>
  <text x="48" y="91" class="subtitle">The protocol path works. These are the places where a production version still needs care.</text>

  <g transform="rotate(-0.25 327.5 240)"><rect x="70" y="150" width="515" height="180" rx="18" fill="#fff0c9" stroke="#a97921" stroke-width="3" class="rough"/><rect x="75" y="155" width="505" height="170" rx="14" fill="none" stroke="#a97921" stroke-opacity=".22" stroke-width="1.5"/><text x="327.5" y="193" text-anchor="middle" class="node-title">Ephemeral endpoints</text><text x="327.5" y="229" text-anchor="middle" class="body">The four servers launch per session.</text>
<text x="327.5" y="254" text-anchor="middle" class="body">A login service or launchd job would make</text>
<text x="327.5" y="279" text-anchor="middle" class="body">discovery continuously available.</text></g>
<g transform="rotate(0.25 952.5 240)"><rect x="695" y="150" width="515" height="180" rx="18" fill="#dce8ff" stroke="#4f6fad" stroke-width="3" class="rough"/><rect x="700" y="155" width="505" height="170" rx="14" fill="none" stroke="#4f6fad" stroke-opacity=".22" stroke-width="1.5"/><text x="952.5" y="193" text-anchor="middle" class="node-title">OMP streams chunks</text><text x="952.5" y="229" text-anchor="middle" class="body">Final text is complete, but token-sized</text>
<text x="952.5" y="254" text-anchor="middle" class="body">artifacts make raw responses noisy.</text>
<text x="952.5" y="279" text-anchor="middle" class="body">This is cosmetic, not lost work.</text></g>
<g transform="rotate(-0.25 327.5 495)"><rect x="70" y="405" width="515" height="180" rx="18" fill="#ffe1de" stroke="#a45350" stroke-width="3" class="rough"/><rect x="75" y="410" width="505" height="170" rx="14" fill="none" stroke="#a45350" stroke-opacity=".22" stroke-width="1.5"/><text x="327.5" y="448" text-anchor="middle" class="node-title">Hermes executor hiccup</text><text x="327.5" y="484" text-anchor="middle" class="body">One originator run hit a transient</text>
<text x="327.5" y="509" text-anchor="middle" class="body">DaemonThreadPoolExecutor error and passed</text>
<text x="327.5" y="534" text-anchor="middle" class="body">after the Hermes process recovered.</text></g>
<g transform="rotate(0.25 952.5 495)"><rect x="695" y="405" width="515" height="180" rx="18" fill="#dcf3e5" stroke="#3f8460" stroke-width="3" class="rough"/><rect x="700" y="410" width="505" height="170" rx="14" fill="none" stroke="#3f8460" stroke-opacity=".22" stroke-width="1.5"/><text x="952.5" y="448" text-anchor="middle" class="node-title">Loopback is the trust boundary</text><text x="952.5" y="484" text-anchor="middle" class="body">The A2A plane has no extra authentication.</text>
<text x="952.5" y="509" text-anchor="middle" class="body">That is acceptable on 127.0.0.1, not for</text>
<text x="952.5" y="534" text-anchor="middle" class="body">an internet-facing listener.</text></g>
  <path d="M 48 674 C 360 670, 620 678, 950 672 S 1160 675, 1230 671" fill="none" stroke="#172033" stroke-width="1.5" stroke-opacity=".18" class="rough"/>
  <text x="640" y="700" text-anchor="middle" class="footer">A2A supplies the language. Persistence, authentication, routing policy and quality control remain system decisions.</text>
</svg>