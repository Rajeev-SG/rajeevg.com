      .title { font: 700 34px Georgia, serif; fill: #172033; }
      .subtitle { font: 18px Georgia, serif; fill: #566174; }
      .node-title { font: 700 24px "Comic Sans MS", "Bradley Hand", cursive; fill: #172033; }
