  <path d="M 48 674 C 360 670, 620 678, 950 672 S 1160 675, 1230 671" fill="none" stroke="#172033" stroke-width="1.5" stroke-opacity=".18" class="rough"/>
  <text x="640" y="700" text-anchor="middle" class="footer">Try one reasonable alternative → report what failed and what is needed → Codex makes the decision. If Codex is unavailable, continue and log the question.</text>
