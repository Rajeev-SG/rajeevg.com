<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Codex and OpenCode agent system architecture</title>
  <desc id="desc">A four-stage architecture showing Codex planning, config-driven routing and skills, OpenCode Go execution, compact review, and one end-to-end telemetry record.</desc>
  <defs>
    <marker id="purpleArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker>
    <marker id="cyanArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0891b2"/></marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker>
    <marker id="amberArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/></marker>
    <marker id="tealArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker>
    <style>
      .title{font:700 26px ui-sans-serif,system-ui,sans-serif;fill:#0f172a}.subtitle{font:15px ui-sans-serif,system-ui,sans-serif;fill:#475569}.lane{font:700 14px ui-sans-serif,system-ui,sans-serif;letter-spacing:2px}.box-title{font:700 14px ui-sans-serif,system-ui,sans-serif;fill:#0f172a}.box-copy{font:12px ui-sans-serif,system-ui,sans-serif;fill:#475569}.legend{font:12px ui-sans-serif,system-ui,sans-serif;fill:#475569}.flow{fill:none;stroke-width:2.5}.measure{fill:none;stroke:#64748b;stroke-width:1.5;stroke-dasharray:6 6}
    </style>
  </defs>
  <rect width="1600" height="980" fill="#ffffff"/>
  <text x="40" y="44" class="title">Codex + OpenCode agent system</text>
  <text x="40" y="70" class="subtitle">Spend Codex allowance on decisions; send bounded execution to Go; measure the whole task.</text>
  <rect x="30" y="95" width="370" height="640" rx="18" fill="#f5f3ff" stroke="#c4b5fd"/>
  <rect x="420" y="95" width="440" height="640" rx="18" fill="#ecfeff" stroke="#a5f3fc"/>
  <rect x="880" y="95" width="430" height="640" rx="18" fill="#ecfdf5" stroke="#a7f3d0"/>
  <rect x="1330" y="95" width="240" height="640" rx="18" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="55" y="130" class="lane" fill="#6d28d9">1  PLAN</text>
  <text x="445" y="130" class="lane" fill="#0e7490">2  ROUTE</text>
  <text x="905" y="130" class="lane" fill="#047857">3  EXECUTE</text>
  <text x="1355" y="130" class="lane" fill="#c2410c">4  REVIEW</text>
  <g fill="none">
    <path d="M210 220 H235" class="flow" stroke="#7c3aed" marker-end="url(#purpleArrow)"/>
    <path d="M380 220 H455" class="flow" stroke="#7c3aed" marker-end="url(#purpleArrow)"/>
    <path d="M625 220 H670" class="flow" stroke="#0891b2" marker-end="url(#cyanArrow)"/>
    <path d="M840 220 H910" class="flow" stroke="#0891b2" marker-end="url(#cyanArrow)"/>
    <path d="M1080 220 H1110" class="flow" stroke="#059669" marker-end="url(#greenArrow)"/>
    <path d="M1200 260 V295 H1005 V340" class="flow" stroke="#059669" marker-end="url(#greenArrow)"/>
    <path d="M1100 383 H1275 V275 H1365" class="flow" stroke="#7c3aed" marker-end="url(#purpleArrow)"/>
    <path d="M1470 320 V385" class="flow" stroke="#7c3aed" marker-end="url(#purpleArrow)"/>
    <path d="M540 340 V260" class="flow" stroke="#d97706" marker-end="url(#amberArrow)"/>
    <path d="M755 340 V260" class="flow" stroke="#d97706" marker-end="url(#amberArrow)"/>
    <path d="M840 383 H1110" class="flow" stroke="#d97706" stroke-dasharray="7 6" marker-end="url(#amberArrow)"/>
    <path d="M1200 340 V275" class="flow" stroke="#059669" stroke-dasharray="7 6" marker-end="url(#greenArrow)"/>
    <path d="M308 260 V650 H430 V790" class="measure"/>
    <path d="M755 425 V790" class="measure"/>
    <path d="M1005 425 V650 H920 V790" class="measure"/>
    <path d="M1470 465 V680 H1160 V790" class="measure"/>
    <path d="M1280 842 H1365" class="flow" stroke="#0f766e" marker-end="url(#tealArrow)"/>
  </g>
  <g>
    <rect x="70" y="180" width="140" height="80" rx="12" fill="#fff" stroke="#8b5cf6" stroke-width="2"/><text x="140" y="211" class="box-title" text-anchor="middle">New Codex task</text><text x="140" y="235" class="box-copy" text-anchor="middle">User goal + context</text>
    <rect x="235" y="175" width="145" height="90" rx="12" fill="#fff" stroke="#8b5cf6" stroke-width="2"/><text x="307" y="204" class="box-title" text-anchor="middle">Fresh task packet</text><text x="307" y="227" class="box-copy" text-anchor="middle">Goal, scope, files,</text><text x="307" y="245" class="box-copy" text-anchor="middle">checks + next action</text>
    <rect x="455" y="175" width="170" height="90" rx="12" fill="#fff" stroke="#06b6d4" stroke-width="2"/><text x="540" y="204" class="box-title" text-anchor="middle">Routing decision</text><text x="540" y="227" class="box-copy" text-anchor="middle">Task + risk → role</text><text x="540" y="245" class="box-copy" text-anchor="middle">+ skills + tools</text>
    <rect x="670" y="175" width="170" height="90" rx="12" fill="#fff" stroke="#06b6d4" stroke-width="2"/><text x="755" y="204" class="box-title" text-anchor="middle">Bounded dispatcher</text><text x="755" y="227" class="box-copy" text-anchor="middle">Go / Luna high</text><text x="755" y="245" class="box-copy" text-anchor="middle">one worker boundary</text>
    <rect x="910" y="175" width="170" height="90" rx="12" fill="#fff" stroke="#10b981" stroke-width="2"/><text x="995" y="204" class="box-title" text-anchor="middle">Go worker</text><text x="995" y="227" class="box-copy" text-anchor="middle">Acknowledges packet</text><text x="995" y="245" class="box-copy" text-anchor="middle">and leased files</text>
    <rect x="1110" y="175" width="180" height="90" rx="12" fill="#fff" stroke="#10b981" stroke-width="2"/><text x="1200" y="204" class="box-title" text-anchor="middle">Work + checks</text><text x="1200" y="227" class="box-copy" text-anchor="middle">Files, tests, browser proof</text><text x="1200" y="245" class="box-copy" text-anchor="middle">and checkpoints</text>
    <rect x="455" y="340" width="170" height="85" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="540" y="369" class="box-title" text-anchor="middle">Checked skill registry</text><text x="540" y="392" class="box-copy" text-anchor="middle">Metadata + hashes + health</text><text x="540" y="410" class="box-copy" text-anchor="middle">selected by routing.json</text>
    <rect x="670" y="340" width="170" height="85" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="755" y="369" class="box-title" text-anchor="middle">Capacity controller</text><text x="755" y="392" class="box-copy" text-anchor="middle">Go allowance + reset</text><text x="755" y="410" class="box-copy" text-anchor="middle">health-check fallback</text>
    <rect x="910" y="340" width="190" height="85" rx="12" fill="#fff" stroke="#10b981" stroke-width="2"/><text x="1005" y="369" class="box-title" text-anchor="middle">Compact worker report</text><text x="1005" y="392" class="box-copy" text-anchor="middle">Decisions, changed files,</text><text x="1005" y="410" class="box-copy" text-anchor="middle">tests + evidence links</text>
    <rect x="1110" y="340" width="180" height="85" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="1200" y="369" class="box-title" text-anchor="middle">OpenRouter fallback</text><text x="1200" y="392" class="box-copy" text-anchor="middle">Explicit + health-checked</text><text x="1200" y="410" class="box-copy" text-anchor="middle">never Codex allowance</text>
    <rect x="1365" y="230" width="210" height="90" rx="12" fill="#fff" stroke="#f97316" stroke-width="2"/><text x="1470" y="259" class="box-title" text-anchor="middle">Codex / Sol review</text><text x="1470" y="282" class="box-copy" text-anchor="middle">Reads decisions + evidence</text><text x="1470" y="300" class="box-copy" text-anchor="middle">raw logs only on demand</text>
    <rect x="1365" y="385" width="210" height="80" rx="12" fill="#fff" stroke="#f97316" stroke-width="2"/><text x="1470" y="416" class="box-title" text-anchor="middle">Accept, retry or escalate</text><text x="1470" y="440" class="box-copy" text-anchor="middle">Signed high-risk gate</text>
  </g>
  <rect x="160" y="790" width="1120" height="105" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="720" y="820" class="box-title" text-anchor="middle">Default end-to-end task record</text>
  <text x="720" y="846" class="box-copy" text-anchor="middle">Codex allowance • Go tokens + cost • duration • every attempt + retry • selected route + skills • test results</text>
  <text x="720" y="871" class="box-copy" text-anchor="middle">Missing counters stay unknown. Raw logs remain referenced artifacts.</text>
  <rect x="1365" y="800" width="210" height="85" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="1470" y="830" class="box-title" text-anchor="middle">Operator view</text><text x="1470" y="853" class="box-copy" text-anchor="middle">Allowance saved</text><text x="1470" y="871" class="box-copy" text-anchor="middle">and quality retained</text>
  <text x="160" y="932" class="legend"><tspan font-weight="700">Solid arrows</tspan> = work and decisions   ·   <tspan font-weight="700">Dashed arrows</tspan> = fallback or measurement   ·   <tspan font-weight="700">Goal</tspan> = less Codex allowance, unchanged quality</text>
</svg>
