<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="720" viewBox="0 0 1480 720" role="img" aria-labelledby="title desc"><title id="title">Codex rotation and delegated execution</title><desc id="desc">A native Codex task creates a durable packet, coordinates through Beads, BVR, Agent Mail and NTM, delegates bounded execution to OpenCode Go, and verifies telemetry and browser evidence. DeepSeek and Qwen are conditional routes.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker><marker id="dash-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#ea580c"/></marker></defs><rect width="1480" height="720" fill="#fff"/><rect x="40" y="20" width="1400" height="70" rx="14" fill="#0f172a"/><text x="66" y="50" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700">Codex rotation and delegated execution</text><text x="66" y="74" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="15">Fresh native context, bounded workers, evidence back to the parent</text><rect x="40" y="110" width="1400" height="230" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="62" y="140" fill="#334155" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">PRIMARY PATH</text><rect x="40" y="380" width="1400" height="190" rx="16" fill="#fffaf0" stroke="#f59e0b" stroke-width="2"/><text x="62" y="410" fill="#92400e" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">CONDITIONAL ROUTES</text><g fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"><path d="M300 240H350"/><path d="M570 240H620"/><path d="M840 240H890"/><path d="M1110 240H1160"/></g><path d="M1270 290V330H190V290" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow)"/><path d="M1000 290V365H880V440" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#dash-arrow)"/><path d="M730 290V350H1200V440" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#dash-arrow)"/><g font-family="Inter,Arial,sans-serif" text-anchor="middle"><g><rect x="80" y="190" width="220" height="100" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="190" y="221" font-size="16" font-weight="700">Fresh Codex task</text><text x="190" y="247" font-size="14">Owns intent, boundaries</text><text x="190" y="269" font-size="14">and final review</text></g><g><rect x="350" y="190" width="220" height="100" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="460" y="221" font-size="16" font-weight="700">Durable packet</text><text x="460" y="247" font-size="14">Manifest + exact next action</text><text x="460" y="269" font-size="14">Beads / BVR state</text></g><g><rect x="620" y="190" width="220" height="100" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="730" y="221" font-size="16" font-weight="700">Agent Mail + NTM</text><text x="730" y="247" font-size="14">Acknowledge, reserve</text><text x="730" y="269" font-size="14">and schedule</text></g><g><rect x="890" y="190" width="220" height="100" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="1000" y="221" font-size="16" font-weight="700">OpenCode Go / Luna</text><text x="1000" y="247" font-size="14">Bounded execution</text><text x="1000" y="269" font-size="14">default worker route</text></g><g><rect x="1160" y="190" width="220" height="100" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="1270" y="221" font-size="16" font-weight="700">Telemetry + verification</text><text x="1270" y="247" font-size="14">Scope, usage, tests</text><text x="1270" y="269" font-size="14">and browser evidence</text></g><g><rect x="760" y="440" width="240" height="90" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="880" y="471" font-size="16" font-weight="700">DeepSeek</text><text x="880" y="496" font-size="14">Health-gated text</text><text x="880" y="518" font-size="14">capacity fallback</text></g><g><rect x="1080" y="440" width="240" height="90" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="1200" y="471" font-size="16" font-weight="700">Qwen</text><text x="1200" y="496" font-size="14">Image-bearing work only</text><text x="1200" y="518" font-size="14">never text fallback</text></g></g><rect x="80" y="600" width="1320" height="48" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="104" y="630" fill="#334155" font-family="Inter,Arial,sans-serif" font-size="14">Blue = native parent flow · Green = durable state / default worker · Dashed = conditional route · Every return is verified before completion</text></svg>
