<svg xmlns="http://www.w3.org/2000/svg" width="1430" height="500" viewBox="0 0 1430 500" role="img" aria-labelledby="title desc"><title id="title">Native rotation and bounded delegation</title><desc id="desc">A hand-drawn-style architecture showing a fresh Codex task, durable packet, Agent Mail and NTM, OpenCode Go, telemetry and verification, with conditional DeepSeek and Qwen routes.</desc><defs><marker id="arr" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#3b82f6"/></marker><marker id="arr-red" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#dc2626"/></marker></defs><rect width="1430" height="500" fill="#fff"/><text x="60" y="78" fill="#1e3a5f" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="28" font-weight="700">Native rotation, bounded delegation</text><g fill="none" stroke="#3b82f6" stroke-width="3" marker-end="url(#arr)"><path d="M250 195 C275 192 294 198 320 195"/><path d="M530 195 C555 198 574 191 600 195"/><path d="M810 195 C835 191 854 199 880 195"/><path d="M1090 195 C1115 198 1134 191 1160 195"/></g><path d="M985 240 C980 278 955 317 945 350" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#arr-red)"/><g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle"><g><rect x="60" y="150" width="190" height="90" rx="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/><text x="155" y="188" fill="#1e3a5f" font-size="18" font-weight="700">Fresh Codex task</text><text x="155" y="214" fill="#1e3a5f" font-size="16">parent + review</text></g><g><rect x="320" y="150" width="210" height="90" rx="14" fill="#a7f3d0" stroke="#047857" stroke-width="3"/><text x="425" y="188" fill="#064e3b" font-size="18" font-weight="700">Durable packet</text><text x="425" y="214" fill="#064e3b" font-size="16">Beads + BVR</text></g><g><rect x="600" y="150" width="210" height="90" rx="14" fill="#ddd6fe" stroke="#6d28d9" stroke-width="3"/><text x="705" y="188" fill="#4c1d95" font-size="18" font-weight="700">Agent Mail</text><text x="705" y="214" fill="#4c1d95" font-size="16">NTM scheduling</text></g><g><rect x="880" y="150" width="210" height="90" rx="14" fill="#a7f3d0" stroke="#047857" stroke-width="3"/><text x="985" y="188" fill="#064e3b" font-size="18" font-weight="700">OpenCode Go</text><text x="985" y="214" fill="#064e3b" font-size="16">Luna execution</text></g><g><rect x="1160" y="150" width="210" height="90" rx="14" fill="#a7f3d0" stroke="#047857" stroke-width="3"/><text x="1265" y="188" fill="#064e3b" font-size="18" font-weight="700">Telemetry</text><text x="1265" y="214" fill="#064e3b" font-size="16">verification</text></g><g><rect x="830" y="350" width="230" height="80" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="3" stroke-dasharray="10 7"/><text x="945" y="385" fill="#991b1b" font-size="18" font-weight="700">DeepSeek</text><text x="945" y="410" fill="#991b1b" font-size="16">health-gated text</text></g><g><rect x="1120" y="350" width="230" height="80" rx="14" fill="#ddd6fe" stroke="#6d28d9" stroke-width="3" stroke-dasharray="10 7"/><text x="1235" y="385" fill="#4c1d95" font-size="18" font-weight="700">Qwen</text><text x="1235" y="410" fill="#4c1d95" font-size="16">images only</text></g></g></svg>
