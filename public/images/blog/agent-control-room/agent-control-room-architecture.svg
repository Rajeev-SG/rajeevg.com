<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="870" viewBox="0 0 1400 870" role="img" aria-labelledby="title desc">
  <title id="title">One control room for six AI agents</title>
  <desc id="desc">Four location-labelled Telegram bots route to personal OpenClaw and work-focused Hermes. Both can escalate to Codex and OMP. All agents send privacy-safe telemetry to Prometheus, VictoriaMetrics, private Grafana and public Tokenmaxxing.</desc>
  <defs>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
    <marker id="purpleArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#047857"/></marker>
    <marker id="slateArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
    <style>
      .label{font:600 20px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.small{font:500 16px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}.caps{font:700 13px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1.6px}.box{stroke-width:2.5;rx:18}.arrow{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.hand{stroke-dasharray:7 7}
    </style>
  </defs>
  <rect width="1400" height="870" fill="#fff"/>
  <text x="60" y="68" style="font:700 31px ui-sans-serif,system-ui;fill:#172033">One control room, four clear entry points</text>
  <text x="60" y="103" class="small">Location is explicit. Roles guide routing. Telemetry joins the whole system.</text>

  <text x="60" y="145" class="caps" fill="#64748b">TELEGRAM ENTRY POINTS</text>
  <rect x="60" y="165" width="285" height="78" class="box" fill="#dbeafe" stroke="#2563eb"/>
  <text x="202.5" y="198" class="label" fill="#1e3a8a" text-anchor="middle">MacBook OpenClaw</text><text x="202.5" y="224" class="small" text-anchor="middle">Telegram bot</text>
  <rect x="365" y="165" width="285" height="78" class="box" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="507.5" y="198" class="label" fill="#4c1d95" text-anchor="middle">MacBook Hermes</text><text x="507.5" y="224" class="small" text-anchor="middle">Telegram bot</text>
  <rect x="750" y="165" width="285" height="78" class="box" fill="#dbeafe" stroke="#2563eb"/>
  <text x="892.5" y="198" class="label" fill="#1e3a8a" text-anchor="middle">Coolify OpenClaw</text><text x="892.5" y="224" class="small" text-anchor="middle">Telegram bot</text>
  <rect x="1055" y="165" width="285" height="78" class="box" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="1197.5" y="198" class="label" fill="#4c1d95" text-anchor="middle">Coolify Hermes</text><text x="1197.5" y="224" class="small" text-anchor="middle">Telegram bot</text>

  <path d="M202 243 C220 280 255 300 300 325" class="arrow" stroke="#2563eb" marker-end="url(#blueArrow)"/>
  <path d="M892 243 C810 278 620 300 480 325" class="arrow" stroke="#2563eb" marker-end="url(#blueArrow)"/>
  <path d="M507 243 C590 278 780 300 920 325" class="arrow" stroke="#7c3aed" marker-end="url(#purpleArrow)"/>
  <path d="M1197 243 C1180 280 1145 300 1100 325" class="arrow" stroke="#7c3aed" marker-end="url(#purpleArrow)"/>

  <rect x="130" y="325" width="390" height="125" class="box" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="325" y="360" class="label" text-anchor="middle">OpenClaw</text><text x="325" y="389" class="caps" fill="#2563eb" text-anchor="middle">PERSONAL DEFAULT</text><text x="325" y="420" class="small" text-anchor="middle">email · calendar · Drive · research</text>
  <rect x="880" y="325" width="390" height="125" class="box" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
  <text x="1075" y="360" class="label" text-anchor="middle">Hermes</text><text x="1075" y="389" class="caps" fill="#7c3aed" text-anchor="middle">WORK DEFAULT</text><text x="1075" y="420" class="small" text-anchor="middle">engineering · work workflows</text>

  <rect x="100" y="520" width="330" height="86" class="box" fill="#fffbeb" stroke="#f59e0b" stroke-dasharray="7 7"/>
  <text x="265" y="551" class="caps" fill="#92400e" text-anchor="middle">MINIMUM VIABLE RESTRICTIONS</text><text x="265" y="581" class="small" fill="#92400e" text-anchor="middle">roles route; they do not hard-block</text>
  <rect x="500" y="515" width="190" height="96" class="box" fill="#d1fae5" stroke="#047857"/>
  <text x="595" y="553" class="label" fill="#064e3b" text-anchor="middle">Codex</text><text x="595" y="581" class="small" text-anchor="middle">general purpose</text>
  <rect x="710" y="515" width="190" height="96" class="box" fill="#d1fae5" stroke="#047857"/>
  <text x="805" y="553" class="label" fill="#064e3b" text-anchor="middle">OMP</text><text x="805" y="581" class="small" text-anchor="middle">general purpose</text>
  <path d="M440 450 C470 490 525 495 595 515" class="arrow hand" stroke="#047857" marker-end="url(#greenArrow)"/>
  <path d="M960 450 C930 490 875 495 805 515" class="arrow hand" stroke="#047857" marker-end="url(#greenArrow)"/>

  <path d="M325 450 C350 565 400 620 475 698" class="arrow" stroke="#64748b" marker-end="url(#slateArrow)"/>
  <path d="M595 611 L615 698" class="arrow" stroke="#64748b" marker-end="url(#slateArrow)"/>
  <path d="M805 611 L785 698" class="arrow" stroke="#64748b" marker-end="url(#slateArrow)"/>
  <path d="M1075 450 C1050 565 1000 620 925 698" class="arrow" stroke="#64748b" marker-end="url(#slateArrow)"/>

  <rect x="160" y="698" width="1080" height="112" class="box" fill="#f8fafc" stroke="#334155"/>
  <text x="700" y="735" class="caps" fill="#334155" text-anchor="middle">PRIVACY-SAFE TELEMETRY SPINE</text>
  <text x="700" y="772" class="label" text-anchor="middle">Agent exporter → Prometheus / OpenTelemetry → VictoriaMetrics</text>
  <text x="700" y="797" class="small" text-anchor="middle">private Grafana control room  +  public Tokenmaxxing mirror</text>

  <text x="700" y="846" class="small" text-anchor="middle">Prompts, responses, tool arguments and credentials never enter the dashboard metrics.</text>
</svg>
