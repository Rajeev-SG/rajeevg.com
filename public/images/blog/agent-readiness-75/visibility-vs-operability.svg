<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">Agent readiness has two different jobs</title>
  <desc id="desc">A no-overlap diagram showing the visibility layer required by content sites and the optional operability layer required only by callable software products.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#059669"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#d97706"/>
    </marker>
    <marker id="arrowSlate" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1500" height="900" fill="#ffffff"/>
  <text x="80" y="66" fill="#0f172a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="700">Agent readiness has two different jobs</text>
  <text x="80" y="95" fill="#475569" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">Content sites need visibility. Callable products also need operability.</text>

  <rect x="70" y="125" width="1360" height="290" rx="28" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2"/>
  <text x="105" y="168" fill="#047857" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">VISIBILITY · FOR CONTENT, MARKETING AND PORTFOLIO SITES</text>

  <path d="M435 272 H575" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowGreen)"/>
  <path d="M915 272 H1055" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowGreen)"/>

  <g filter="url(#shadow)">
    <rect x="105" y="195" width="330" height="155" rx="22" fill="#ffffff" stroke="#6ee7b7" stroke-width="2"/>
    <rect x="585" y="195" width="330" height="155" rx="22" fill="#ffffff" stroke="#6ee7b7" stroke-width="2"/>
    <rect x="1065" y="195" width="330" height="155" rx="22" fill="#047857" stroke="#047857" stroke-width="2"/>
  </g>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="130" y="232" fill="#0f172a" font-size="18" font-weight="700">1 · Publish clear evidence</text>
    <text x="130" y="270" fill="#475569" font-size="14"><tspan x="130" dy="0">Server-rendered copy</tspan><tspan x="130" dy="23">Real heading structure</tspan><tspan x="130" dy="23">Truthful HTTP status codes</tspan></text>
    <text x="610" y="232" fill="#0f172a" font-size="18" font-weight="700">2 · Make it discoverable</text>
    <text x="610" y="270" fill="#475569" font-size="14"><tspan x="610" dy="0">Markdown negotiation</tspan><tspan x="610" dy="23">JSON-LD and sitemap</tspan><tspan x="610" dy="23">llms.txt and internal links</tspan></text>
    <text x="1090" y="232" fill="#ffffff" font-size="18" font-weight="700">3 · Help the agent succeed</text>
    <text x="1090" y="280" fill="#d1fae5" font-size="15"><tspan x="1090" dy="0">Read · Identify</tspan><tspan x="1090" dy="25">Recover · Cite</tspan></text>
  </g>

  <rect x="70" y="450" width="1360" height="340" rx="28" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
  <text x="105" y="493" fill="#b45309" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">OPERABILITY · ONLY WHEN A REAL PRODUCT CAN BE CALLED</text>

  <path d="M370 615 H550" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowAmber)"/>
  <path d="M890 617 H1030" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowAmber)"/>
  <path d="M245 690 V700" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="8 8" stroke-linecap="round" marker-end="url(#arrowSlate)"/>

  <polygon points="245,540 370,615 245,690 120,615" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="245" y="603" text-anchor="middle" fill="#78350f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700"><tspan x="245">Does a public callable</tspan><tspan x="245" dy="25">product exist?</tspan></text>

  <g filter="url(#shadow)">
    <rect x="560" y="545" width="330" height="145" rx="22" fill="#ffffff" stroke="#fdba74" stroke-width="2"/>
    <rect x="1040" y="545" width="330" height="145" rx="22" fill="#b45309" stroke="#b45309" stroke-width="2"/>
  </g>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="585" y="582" fill="#0f172a" font-size="18" font-weight="700">Document the contract</text>
    <text x="585" y="618" fill="#475569" font-size="14"><tspan x="585" dy="0">OpenAPI and schemas</tspan><tspan x="585" dy="23">Typed JSON errors</tspan><tspan x="585" dy="23">Operation descriptions</tspan></text>
    <text x="1065" y="582" fill="#ffffff" font-size="18" font-weight="700">Expose real tools</text>
    <text x="1065" y="618" fill="#ffedd5" font-size="14"><tspan x="1065" dy="0">CLI or SDK</tspan><tspan x="1065" dy="23">Function calling</tspan><tspan x="1065" dy="23">Auth and rate limits</tspan></text>
  </g>

  <rect x="105" y="710" width="280" height="60" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="245" y="735" text-anchor="middle" fill="#0f172a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700">NO · Stop at visibility</text>
  <text x="245" y="756" text-anchor="middle" fill="#475569" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">Do not invent an API for a score.</text>

  <text x="750" y="842" text-anchor="middle" fill="#64748b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13"><tspan fill="#047857" font-weight="700">Green</tspan><tspan> = useful to rajeevg.com now   ·   </tspan><tspan fill="#b45309" font-weight="700">Amber</tspan><tspan> = useful only if the site becomes a callable product</tspan></text>
</svg>
