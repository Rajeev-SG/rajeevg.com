<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">The 551-session dataset at a glance</title>
<desc id="desc">551 sessions, about 3.3 GB of transcript, 377 indexed task titles, and more than 116,000 recorded tool calls.</desc>
<style>
  text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}
  .cap{fill:#64748b}.val{fill:#0f172a}.eyeb{fill:#0284c7;font-size:13px;letter-spacing:2px;font-weight:600}
  @media (prefers-color-scheme: dark){ .cap{fill:#94a3b8} .val{fill:#f8fafc} }
  @media (prefers-reduced-motion: reduce){ .bar{animation:none} }
</style>
<text class="eyeb" x="60" y="60">THE DATASET AT A GLANCE</text>
<!-- Sessions 551 -->
<text class="cap" x="60" y="150" font-size="18">Sessions indexed</text>
<text class="val" x="60" y="205" font-size="84" font-weight="700">551</text>
<rect x="60" y="235" width="420" height="14" rx="7" fill="#e2e8f0"/>
<rect class="bar" x="60" y="235" width="420" height="14" rx="7" fill="#0284c7">
  <animate attributeName="width" from="0" to="420" dur="1.2s" begin="0s"/>
</rect>
<!-- Size ~3.3 GB -->
<text class="cap" x="60" y="300" font-size="18">Transcript working-set size</text>
<text class="val" x="60" y="352" font-size="64" font-weight="700">~3.3 GB</text>
<rect x="60" y="380" width="330" height="14" rx="7" fill="#e2e8f0"/>
<rect x="60" y="380" width="330" height="14" rx="7" fill="#10b981"/>
<!-- 377 titles -->
<text class="cap" x="640" y="150" font-size="18">Indexed task titles</text>
<text class="val" x="640" y="205" font-size="84" font-weight="700">377</text>
<rect x="640" y="235" width="280" height="14" rx="7" fill="#e2e8f0"/>
<rect x="640" y="235" width="280" height="14" rx="7" fill="#f59e0b"/>
<!-- 116k+ tools -->
<text class="cap" x="640" y="300" font-size="18">Recorded tool calls</text>
<text class="val" x="640" y="352" font-size="72" font-weight="700">116k+</text>
<rect x="640" y="380" width="500" height="14" rx="7" fill="#e2e8f0"/>
<rect x="640" y="380" width="500" height="14" rx="7" fill="#f43f5e"/>
<text class="cap" x="60" y="470" font-size="15">Categories are approximate and title-derived. Counts show activity, not value.</text>
</svg>
