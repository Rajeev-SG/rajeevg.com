<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc">
  <title id="title">Before: the oversight ladder</title>
  <desc id="desc">A request passes through Codex Desktop, then Beads, BVR, a delegation preflight and NTM before reaching the OpenCode Go agent running GPT-5.6 Luna. A Sol review gate loops back for tasks labelled high risk.</desc>
  <defs>
    <marker id="arr-blue" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0 L0 8 L11 4 Z" fill="#2563eb"/></marker>
    <marker id="arr-red" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0 L0 8 L11 4 Z" fill="#dc2626"/></marker>
    <marker id="arr-green" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0 L0 8 L11 4 Z" fill="#047857"/></marker>
    <marker id="arr-slate" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0 L0 8 L11 4 Z" fill="#64748b"/></marker>
    <marker id="arr-amber" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0 L0 8 L11 4 Z" fill="#d97706"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/></filter>
  </defs>
  <rect width="1200" height="730" fill="#ffffff"/>

<text x="48" y="58" fill="#0f172a" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="30" font-weight="700">Before: the oversight ladder</text>
<text x="48" y="88" fill="#475569" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17">Every task climbed six hops before the model doing the work saw it. Each hop cost tokens and time.</text>
<rect x="30" y="112" width="1140" height="510" rx="22" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="54" y="143" fill="#1d4ed8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" font-weight="700" letter-spacing="2">REQUEST PATH</text>
<g filter="url(#shadow)"><rect x="90" y="180" width="300" height="56" rx="16" fill="#e0e7ff" stroke="#4f46e5" stroke-width="3"/><text x="240.0" y="202.5" text-anchor="middle" fill="#312e81" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="700">Codex Desktop parent</text><text x="240.0" y="224.5" text-anchor="middle" fill="#312e81" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">plans, checks, decides</text></g>
<path d="M240.0 238 C240.0 248,240.0 256,240.0 266" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr-slate)"/>
<g filter="url(#shadow)"><rect x="90" y="268" width="300" height="56" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="240.0" y="290.5" text-anchor="middle" fill="#78350f" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="700">Beads</text><text x="240.0" y="312.5" text-anchor="middle" fill="#78350f" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">task ID and status</text></g>
<path d="M240.0 326 C240.0 336,240.0 344,240.0 354" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr-slate)"/>
<g filter="url(#shadow)"><rect x="90" y="356" width="300" height="56" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="240.0" y="378.5" text-anchor="middle" fill="#78350f" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="700">BVR</text><text x="240.0" y="400.5" text-anchor="middle" fill="#78350f" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">verification review</text></g>
<path d="M240.0 414 C240.0 424,240.0 432,240.0 442" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr-slate)"/>
<g filter="url(#shadow)"><rect x="90" y="444" width="300" height="56" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="240.0" y="466.5" text-anchor="middle" fill="#78350f" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="700">Delegation preflight</text><text x="240.0" y="488.5" text-anchor="middle" fill="#78350f" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">worker must be reserved</text></g>
<path d="M240.0 502 C240.0 512,240.0 520,240.0 530" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr-slate)"/>
<g filter="url(#shadow)"><rect x="90" y="532" width="300" height="56" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="240.0" y="554.5" text-anchor="middle" fill="#78350f" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="700">NTM</text><text x="240.0" y="576.5" text-anchor="middle" fill="#78350f" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">reserves a worker session</text></g>
<g filter="url(#shadow)"><rect x="560" y="300" width="170" height="80" rx="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="3"/><text x="645.0" y="334.5" text-anchor="middle" fill="#0f172a" font-family="ui-sans-serif,system-ui,sans-serif" font-size="18" font-weight="700">You</text><text x="645.0" y="357.5" text-anchor="middle" fill="#0f172a" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">one request</text></g>
<path d="M734 340 C754 332 766 348 786 340" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr-slate)"/>
<g filter="url(#shadow)"><rect x="790" y="280" width="310" height="110" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="945.0" y="322.5" text-anchor="middle" fill="#166534" font-family="ui-sans-serif,system-ui,sans-serif" font-size="19" font-weight="700">OpenCode Go</text><text x="945.0" y="345.5" text-anchor="middle" fill="#166534" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">GPT-5.6 Luna — the model</text><text x="945.0" y="360.5" text-anchor="middle" fill="#166534" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">doing the actual work</text></g>
<path d="M945 392 C945 406 945 424 945 436" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arr-red)"/>
<text x="1060" y="418" fill="#dc2626" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" text-anchor="middle">review loop</text>
<g filter="url(#shadow)"><rect x="790" y="440" width="310" height="110" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="945.0" y="482.5" text-anchor="middle" fill="#991b1b" font-family="ui-sans-serif,system-ui,sans-serif" font-size="19" font-weight="700">Sol gate</text><text x="945.0" y="505.5" text-anchor="middle" fill="#991b1b" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">GPT-5.6 Sol — review</text><text x="945.0" y="520.5" text-anchor="middle" fill="#991b1b" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">on tasks labelled high risk</text></g>
<g filter="url(#shadow)"><rect x="560" y="470" width="210" height="60" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><text x="665.0" y="493.5" text-anchor="middle" fill="#334155" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700">Agent Mail</text><text x="665.0" y="515.5" text-anchor="middle" fill="#334155" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">coordination notices</text></g>
<g filter="url(#shadow)"><rect x="560" y="550" width="210" height="60" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><text x="665.0" y="573.5" text-anchor="middle" fill="#334155" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700">ToolHive</text><text x="665.0" y="595.5" text-anchor="middle" fill="#334155" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">isolated MCP endpoints</text></g>
<text x="48" y="690" fill="#475569" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15">Agent Mail and ToolHive were part of the path — but they were not the reason the path was long.</text>
</svg>