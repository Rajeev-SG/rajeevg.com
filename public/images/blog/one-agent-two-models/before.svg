<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">Before: the oversight ladder</title>
  <desc id="desc">A request passes through Codex Desktop, then Beads, BVR, a delegation preflight and NTM before reaching the OpenCode Go agent running GPT-5.6 Luna. A Sol review gate loops back for tasks labelled high risk.</desc>
  <defs>
    <marker id="arr-blue" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0 L0 8 L11 4 Z" fill="#2563eb"/></marker>
    <marker id="arr-red" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0 L0 8 L11 4 Z" fill="#dc2626"/></marker>
    <marker id="arr-green" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0 L0 8 L11 4 Z" fill="#047857"/></marker>
    <marker id="arr-slate" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0 L0 8 L11 4 Z" fill="#64748b"/></marker>
    <marker id="arr-amber" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0 L0 8 L11 4 Z" fill="#d97706"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/></filter>
  </defs>
  <rect width="1200" height="780" fill="#ffffff"/>

<text x="48" y="58" fill="#0f172a" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="30" font-weight="700">Before: the oversight ladder</text>
<text x="48" y="88" fill="#475569" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17">Every task climbed six hops before the model doing the work saw it. Each hop cost tokens and time.</text>
<rect x="30" y="112" width="1140" height="320" rx="22" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="54" y="143" fill="#1d4ed8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" font-weight="700" letter-spacing="2">REQUEST PATH</text>
<g filter="url(#shadow)"><rect x="90" y="170" width="300" height="52" rx="16" fill="#e0e7ff" stroke="#4f46e5" stroke-width="3"/><text x="240.0" y="191.5" text-anchor="middle" fill="#312e81" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="700">Codex Desktop parent</text><text x="240.0" y="213.5" text-anchor="middle" fill="#312e81" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">plans, checks, decides</text></g>
<path d="M240.0 224 C240.0 230,240.0 228,240.0 232" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr-slate)"/>
<g filter="url(#shadow)"><rect x="90" y="234" width="300" height="52" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="240.0" y="255.5" text-anchor="middle" fill="#78350f" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="700">Beads</text><text x="240.0" y="277.5" text-anchor="middle" fill="#78350f" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">task ID and status</text></g>
<path d="M240.0 288 C240.0 294,240.0 292,240.0 296" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr-slate)"/>
<g filter="url(#shadow)"><rect x="90" y="298" width="300" height="52" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="240.0" y="319.5" text-anchor="middle" fill="#78350f" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="700">BVR</text><text x="240.0" y="341.5" text-anchor="middle" fill="#78350f" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">verification review</text></g>
<path d="M240.0 352 C240.0 358,240.0 356,240.0 360" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr-slate)"/>
<g filter="url(#shadow)"><rect x="90" y="362" width="300" height="52" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="240.0" y="383.5" text-anchor="middle" fill="#78350f" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="700">Delegation preflight</text><text x="240.0" y="405.5" text-anchor="middle" fill="#78350f" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">worker must be reserved</text></g>
<path d="M240.0 416 C240.0 422,240.0 420,240.0 424" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr-slate)"/>
<g filter="url(#shadow)"><rect x="90" y="426" width="300" height="52" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="240.0" y="447.5" text-anchor="middle" fill="#78350f" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="700">NTM</text><text x="240.0" y="469.5" text-anchor="middle" fill="#78350f" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">reserves a worker session</text></g>
<g filter="url(#shadow)"><rect x="560" y="240" width="170" height="70" rx="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="3"/><text x="645.0" y="270.5" text-anchor="middle" fill="#0f172a" font-family="ui-sans-serif,system-ui,sans-serif" font-size="18" font-weight="700">You</text><text x="645.0" y="293.5" text-anchor="middle" fill="#0f172a" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">one request</text></g>
<path d="M734 275 C754 269 766 281 786 275" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr-slate)"/>
<g filter="url(#shadow)"><rect x="790" y="230" width="280" height="90" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="930.0" y="264.5" text-anchor="middle" fill="#166534" font-family="ui-sans-serif,system-ui,sans-serif" font-size="19" font-weight="700">OpenCode Go</text><text x="930.0" y="287.5" text-anchor="middle" fill="#166534" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">GPT-5.6 Luna — the model</text><text x="930.0" y="302.5" text-anchor="middle" fill="#166534" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">doing the actual work</text></g>
<g filter="url(#shadow)"><rect x="790" y="350" width="280" height="90" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="930.0" y="384.5" text-anchor="middle" fill="#991b1b" font-family="ui-sans-serif,system-ui,sans-serif" font-size="19" font-weight="700">Sol gate</text><text x="930.0" y="407.5" text-anchor="middle" fill="#991b1b" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">GPT-5.6 Sol — review</text><text x="930.0" y="422.5" text-anchor="middle" fill="#991b1b" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">on tasks labelled high risk</text></g>
<path d="M930 322 C930 334 930 340 930 348" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arr-red)"/>
<text x="972" y="340" fill="#dc2626" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" text-anchor="middle">review loop</text>
<g filter="url(#shadow)"><rect x="560" y="370" width="200" height="60" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><text x="660.0" y="394.5" text-anchor="middle" fill="#334155" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700">Agent Mail</text><text x="660.0" y="416.5" text-anchor="middle" fill="#334155" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">coordination notices</text></g>
<g filter="url(#shadow)"><rect x="560" y="440" width="200" height="60" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><text x="660.0" y="464.5" text-anchor="middle" fill="#334155" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700">ToolHive</text><text x="660.0" y="486.5" text-anchor="middle" fill="#334155" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">isolated MCP endpoints</text></g>
<text x="48" y="740" fill="#475569" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15">Agent Mail and ToolHive were part of the path — but they were not the reason the path was long.</text>
</svg>