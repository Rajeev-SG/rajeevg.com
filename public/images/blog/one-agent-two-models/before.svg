<text x="40" y="52" font-size="24" fill="#0f172a" text-anchor="start" xml:space="preserve">Before: every task climbed the oversight ladder</text>
<text x="89.55" y="156.25" font-size="15" fill="#0f172a" text-anchor="start" xml:space="preserve">You</text>
<text x="89.55" y="175.0" font-size="15" fill="#0f172a" text-anchor="start" xml:space="preserve">(one request)</text>
<text x="357.7" y="156.25" font-size="15" fill="#0f172a" text-anchor="start" xml:space="preserve">Codex Desktop parent</text>
<text x="357.7" y="175.0" font-size="15" fill="#0f172a" text-anchor="start" xml:space="preserve">plans, checks, decides</text>
<text x="347.15999999999997" y="275.25" font-size="14" fill="#0f172a" text-anchor="start" xml:space="preserve">Beads — task ID and status</text>
<text x="351.5" y="355.25" font-size="14" fill="#0f172a" text-anchor="start" xml:space="preserve">BVR — verification review</text>
<text x="373.2" y="435.25" font-size="14" fill="#0f172a" text-anchor="start" xml:space="preserve">Delegation preflight</text>
<text x="325.46000000000004" y="515.25" font-size="14" fill="#0f172a" text-anchor="start" xml:space="preserve">NTM — reserves a worker session</text>
<text x="675.85" y="476.25" font-size="15" fill="#0f172a" text-anchor="start" xml:space="preserve">OpenCode Go · GPT-5.6 Luna</text>
<text x="675.85" y="495.0" font-size="15" fill="#0f172a" text-anchor="start" xml:space="preserve">the model doing the actual work</text>
<text x="657.25" y="281.25" font-size="15" fill="#0f172a" text-anchor="start" xml:space="preserve">Sol gate · GPT-5.6 Sol</text>
<text x="657.25" y="300.0" font-size="15" fill="#0f172a" text-anchor="start" xml:space="preserve">review triggered on high-risk tasks</text>
<text x="780.4" y="381.5" font-size="12" fill="#475569" text-anchor="start" xml:space="preserve">review loop</text>
<text x="687.01" y="151.75" font-size="13" fill="#0f172a" text-anchor="start" xml:space="preserve">Agent Mail — coordination notices</text>
<text x="687.01" y="168.0" font-size="13" fill="#0f172a" text-anchor="start" xml:space="preserve">ToolHive — isolated MCP endpoints</text>
<text x="320" y="596" font-size="16" fill="#334155" text-anchor="start" xml:space="preserve">Six hops before a single line of code moved —</text>
<text x="320" y="616.0" font-size="16" fill="#334155" text-anchor="start" xml:space="preserve">and every hop cost tokens and time.</text>
