<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">Before and after: agent oversight ladder to one agent two tiers</title>
  <desc id="desc">The old six-hop oversight ladder across the top. The new single-agent two-tier path with Langfuse, Prometheus and Grafana telemetry below. A legend explains the arrow colours.</desc>
