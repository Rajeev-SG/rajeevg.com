  <text x="600.0" y="110" text-anchor="middle" fill="#1d4ed8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="700" letter-spacing="2">BEFORE: SIX HOPS BEFORE REAL WORK</text>
