<g filter="url(#shadow)"><rect x="400" y="430" width="260" height="90" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/><text x="530.0" y="463.0" text-anchor="middle" fill="#0f172a" font-family="ui-sans-serif,system-ui,sans-serif" font-size="18" font-weight="700">GLM-5.3-Flash</text><text x="530.0" y="486.0" text-anchor="middle" fill="#334155" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">everyday work — cheap, fast</text><text x="530.0" y="502.0" text-anchor="middle" fill="#334155" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">via OpenRouter</text></g>
