<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">After: one agent, two tiers, measured everywhere</title>
  <desc id="desc">One agent plans, edits, tests and reports. Everyday work routes to GLM-5.3-Flash through OpenRouter. Genuinely hard tasks escalate once to GPT-5.6 Sol or Claude Opus 5 with a stated reason. Every call is logged through Langfuse, Prometheus and Grafana.</desc>
  <defs>
    <marker id="arr-blue" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0 L0 8 L11 4 Z" fill="#2563eb"/></marker>
    <marker id="arr-red" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0 L0 8 L11 4 Z" fill="#dc2626"/></marker>
    <marker id="arr-green" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0 L0 8 L11 4 Z" fill="#047857"/></marker>
    <marker id="arr-slate" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0 L0 8 L11 4 Z" fill="#64748b"/></marker>
    <marker id="arr-amber" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0 L0 8 L11 4 Z" fill="#d97706"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/></filter>
  </defs>
  <rect width="1200" height="780" fill="#ffffff"/>

<text x="48" y="58" fill="#0f172a" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="30" font-weight="700">After: one agent, two tiers</text>
<text x="48" y="88" fill="#475569" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17">Everyday work stays cheap. Escalation is rare, justified, and measured like everything else.</text>
<rect x="30" y="112" width="1140" height="250" rx="22" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="54" y="143" fill="#1d4ed8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" font-weight="700" letter-spacing="2">EXECUTION</text>
<g filter="url(#shadow)"><rect x="70" y="180" width="260" height="100" rx="16" fill="#e0e7ff" stroke="#4f46e5" stroke-width="3"/><text x="200.0" y="225.0" text-anchor="middle" fill="#312e81" font-family="ui-sans-serif,system-ui,sans-serif" font-size="20" font-weight="700">One agent</text><text x="200.0" y="249.0" text-anchor="middle" fill="#312e81" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14">plan → edit → test → report</text></g>
<g filter="url(#shadow)"><rect x="440" y="180" width="280" height="90" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="580.0" y="213.0" text-anchor="middle" fill="#166534" font-family="ui-sans-serif,system-ui,sans-serif" font-size="20" font-weight="700">GLM-5.3-Flash</text><text x="580.0" y="236.0" text-anchor="middle" fill="#166534" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">everyday work — cheap, fast</text><text x="580.0" y="251.0" text-anchor="middle" fill="#166534" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">via OpenRouter</text></g>
<g filter="url(#shadow)"><rect x="830" y="175" width="300" height="120" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="980.0" y="215.0" text-anchor="middle" fill="#991b1b" font-family="ui-sans-serif,system-ui,sans-serif" font-size="19" font-weight="700">Frontier escalation</text><text x="980.0" y="238.0" text-anchor="middle" fill="#991b1b" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">GPT-5.6 Sol (Codex)</text><text x="980.0" y="253.0" text-anchor="middle" fill="#991b1b" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">Claude Opus 5 (OMP, Hermes, Claude Code)</text><text x="980.0" y="268.0" text-anchor="middle" fill="#991b1b" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">only with a stated reason</text></g>
<path d="M334 215 C364 205 394 205 436 210" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#arr-green)"/>
<text x="385" y="190" fill="#047857" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" text-anchor="middle">everyday</text>
<path d="M334 260 C480 340 700 355 826 250" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arr-red)"/>
<text x="587" y="362" fill="#dc2626" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" text-anchor="middle">genuinely hard, say why</text>
<rect x="200" y="392" width="800" height="46" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="600" y="421" text-anchor="middle" fill="#0f172a" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700">Every call lands here — no prompts or code stored, just counts</text>
<path d="M980 297 C980 330 900 380 700 392" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arr-slate)"/>
<rect x="30" y="470" width="1140" height="230" rx="22" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="54" y="501" fill="#047857" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" font-weight="700" letter-spacing="2">TELEMETRY</text>
<g filter="url(#shadow)"><rect x="70" y="535" width="290" height="120" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="215.0" y="582.0" text-anchor="middle" fill="#78350f" font-family="ui-sans-serif,system-ui,sans-serif" font-size="20" font-weight="700">Langfuse</text><text x="215.0" y="606.0" text-anchor="middle" fill="#78350f" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14">one trace per model call</text><text x="215.0" y="622.0" text-anchor="middle" fill="#78350f" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14">model · tokens · cost · latency</text></g>
<g filter="url(#shadow)"><rect x="430" y="535" width="290" height="120" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="575.0" y="582.0" text-anchor="middle" fill="#1e40af" font-family="ui-sans-serif,system-ui,sans-serif" font-size="20" font-weight="700">Prometheus</text><text x="575.0" y="606.0" text-anchor="middle" fill="#1e40af" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14">counters and trends</text><text x="575.0" y="622.0" text-anchor="middle" fill="#1e40af" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14">per-model aggregation</text></g>
<g filter="url(#shadow)"><rect x="790" y="535" width="340" height="120" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="960.0" y="582.0" text-anchor="middle" fill="#4c1d95" font-family="ui-sans-serif,system-ui,sans-serif" font-size="20" font-weight="700">Grafana</text><text x="960.0" y="606.0" text-anchor="middle" fill="#4c1d95" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14">dashboards you can read</text><text x="960.0" y="622.0" text-anchor="middle" fill="#4c1d95" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14">cost, latency, escalation rate</text></g>
<path d="M364 595 C394 585 400 585 426 595" fill="none" stroke="#047857" stroke-width="3" marker-end="url(#arr-green)"/>
<path d="M724 595 C754 585 760 585 786 595" fill="none" stroke="#047857" stroke-width="3" marker-end="url(#arr-green)"/>
<text x="48" y="750" fill="#475569" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15">Beads, NTM and Agent Mail are still installed — they just stopped sitting between the request and the work.</text>
</svg>