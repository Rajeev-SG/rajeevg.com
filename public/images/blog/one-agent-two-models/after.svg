<text x="40" y="52" font-size="24" fill="#0f172a" text-anchor="start" xml:space="preserve">After: one agent, two tiers, measured everywhere</text>
<text x="89.55" y="176.25" font-size="15" fill="#0f172a" text-anchor="start" xml:space="preserve">You</text>
<text x="89.55" y="195.0" font-size="15" fill="#0f172a" text-anchor="start" xml:space="preserve">(one request)</text>
<text x="336.08000000000004" y="176.0" font-size="16" fill="#0f172a" text-anchor="start" xml:space="preserve">One agent</text>
<text x="336.08000000000004" y="196.0" font-size="16" fill="#0f172a" text-anchor="start" xml:space="preserve">plan → edit → test → report</text>
<text x="790.5" y="121.25" font-size="15" fill="#0f172a" text-anchor="start" xml:space="preserve">GLM-5.3-Flash (via OpenRouter)</text>
<text x="790.5" y="140.0" font-size="15" fill="#0f172a" text-anchor="start" xml:space="preserve">everyday work — cheap, fast</text>
<text x="744.0" y="301.875" font-size="15" fill="#0f172a" text-anchor="start" xml:space="preserve">GPT-5.6 Sol (Codex)</text>
<text x="744.0" y="320.625" font-size="15" fill="#0f172a" text-anchor="start" xml:space="preserve">Claude Opus 5 (OMP, Hermes, Claude Code)</text>
<text x="744.0" y="339.375" font-size="15" fill="#0f172a" text-anchor="start" xml:space="preserve">escalation — only with a stated reason</text>
<text x="641.2" y="139.0" font-size="12" fill="#475569" text-anchor="start" xml:space="preserve">everyday task</text>
<text x="605.2" y="249.0" font-size="12" fill="#475569" text-anchor="start" xml:space="preserve">genuinely hard, say why</text>
<text x="345.07" y="331.75" font-size="13" fill="#0f172a" text-anchor="start" xml:space="preserve">Every call logged:</text>
<text x="345.07" y="348.0" font-size="13" fill="#0f172a" text-anchor="start" xml:space="preserve">model · tokens · cost · latency</text>
<text x="365.84000000000003" y="451.5" font-size="14" fill="#0f172a" text-anchor="start" xml:space="preserve">Langfuse</text>
<text x="365.84000000000003" y="469.0" font-size="14" fill="#0f172a" text-anchor="start" xml:space="preserve">one trace per model call</text>
<text x="727.54" y="451.5" font-size="14" fill="#0f172a" text-anchor="start" xml:space="preserve">Prometheus</text>
<text x="727.54" y="469.0" font-size="14" fill="#0f172a" text-anchor="start" xml:space="preserve">counters and trends</text>
<text x="1060.18" y="451.5" font-size="14" fill="#0f172a" text-anchor="start" xml:space="preserve">Grafana</text>
<text x="1060.18" y="469.0" font-size="14" fill="#0f172a" text-anchor="start" xml:space="preserve">dashboards you can read</text>
<text x="850.8" y="397.0" font-size="12" fill="#475569" text-anchor="start" xml:space="preserve">telemetry side-channel</text>
<text x="320" y="555" font-size="15" fill="#475569" text-anchor="start" xml:space="preserve">Beads, NTM and Agent Mail are still installed —</text>
<text x="320" y="573.75" font-size="15" fill="#475569" text-anchor="start" xml:space="preserve">they just stopped sitting between the request and the work.</text>
</svg>