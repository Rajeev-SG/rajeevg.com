<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" role="img" aria-labelledby="title desc">
  <title id="title">Same job — so who owns the waiting?</title>
  <desc id="desc">Two flows. Before: the agent writes code, runs checks, waits for CI, then repeatedly wakes up, re-reads the whole conversation and checks status again, four times in one observed sequence, before deployment proof. After: the agent writes code, runs targeted checks, emits CI_HANDOFF and exits with zero further model tokens; CI runs tests, build, deployment wait and browser proof for free, green results wake nobody, and only a failure wakes one cheap worker with the failing output.</desc>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#e7e2d5"/></pattern>
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="11" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="0.85"/></filter>
    <marker id="arr-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 9 5 L 0 10 z" fill="#172033"/></marker>
    <marker id="arr-roseStroke" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 9 5 L 0 10 z" fill="#a45350"/></marker>
    <marker id="arr-greenStroke" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 9 5 L 0 10 z" fill="#3f8460"/></marker>
    <marker id="arr-amberStroke" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 9 5 L 0 10 z" fill="#a97921"/></marker>
    <marker id="arr-purpleStroke" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 9 5 L 0 10 z" fill="#7459a8"/></marker>
    <marker id="arr-blueStroke" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 9 5 L 0 10 z" fill="#4f6fad"/></marker>
    <marker id="arr-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 9 5 L 0 10 z" fill="#566174"/></marker>
    <style>
      .rough { filter: url(#wobble); }
      .title { font: 700 34px Georgia, serif; fill: #172033; }
      .subtitle { font: 18px Georgia, serif; fill: #566174; }
      .lane-label { font: 700 17px "Comic Sans MS", "Bradley Hand", cursive; letter-spacing: 1px; }
      .node-title { font: 700 17px "Comic Sans MS", "Bradley Hand", cursive; fill: #172033; }
      .node-title-strong { font: 700 23px "Comic Sans MS", "Bradley Hand", cursive; fill: #172033; }
      .body { font: 14px "Comic Sans MS", "Bradley Hand", cursive; fill: #172033; }
      .small { font: 14px "Comic Sans MS", "Bradley Hand", cursive; fill: #566174; }
      .tag { font: 700 17px "Comic Sans MS", "Bradley Hand", cursive; fill: #172033; }
      .arrow-label { font: 14px "Comic Sans MS", "Bradley Hand", cursive; fill: #566174; paint-order: stroke; stroke: #fbfaf5; stroke-width: 7px; }
      .banner-main { font: 700 20px "Comic Sans MS", "Bradley Hand", cursive; fill: #172033; }
      .banner-sub { font: 15px "Comic Sans MS", "Bradley Hand", cursive; fill: #566174; }
      .footer { font: 15px Georgia, serif; font-style: italic; fill: #566174; }
    </style>
  </defs>
  <rect width="1280" height="780" fill="#fbfaf5"/>
  <rect width="1280" height="780" fill="url(#dots)" opacity=".68"/>
  <text x="48" y="58" class="title">Same job — so who owns the waiting?</text>
  <text x="48" y="90" class="subtitle">Before: every status check was a model turn that re-read the whole conversation. After: the agent exits, and a normal program waits for free.</text>
  <path d="M 48 104 C 330 101, 580 108, 846 103 S 1125 106, 1230 102" fill="none" stroke="#172033" stroke-width="2" stroke-opacity=".18" class="rough"/>
  <rect x="48" y="126" width="1184" height="262" rx="20" fill="#ffe1de" fill-opacity=".22" stroke="#a45350" stroke-width="2" stroke-dasharray="10 8" class="rough"/>
  <text x="72" y="158" class="lane-label" fill="#a45350">BEFORE — the model owns every minute of the wait</text>
  <g transform="rotate(-0.2 166 234)"><rect x="96" y="182" width="140" height="104" rx="16" fill="#dce8ff" stroke="#4f6fad" stroke-width="3" class="rough"/><rect x="100" y="186" width="132" height="96" rx="12" fill="none" stroke="#4f6fad" stroke-opacity=".22" stroke-width="1.5"/>
    <text x="166" y="229.5" text-anchor="middle" class="node-title">Agent codes</text>
    <text x="166" y="250.5" text-anchor="middle" class="body">the useful work</text>
  </g>
  <g><path d="M 236 234 C 251 234, 251 234, 266 234" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arr-ink)" class="rough"/></g>
  <g transform="rotate(0.2 336 234)"><rect x="266" y="182" width="140" height="104" rx="16" fill="#dce8ff" stroke="#4f6fad" stroke-width="3" class="rough"/><rect x="270" y="186" width="132" height="96" rx="12" fill="none" stroke="#4f6fad" stroke-opacity=".22" stroke-width="1.5"/>
    <text x="336" y="229.5" text-anchor="middle" class="node-title">Runs checks</text>
    <text x="336" y="250.5" text-anchor="middle" class="body">tests and build</text>
  </g>
  <g><path d="M 406 234 C 421 234, 421 234, 436 234" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arr-ink)" class="rough"/></g>
  <g transform="rotate(-0.2 511 234)"><rect x="436" y="182" width="150" height="104" rx="16" fill="#fff0c9" stroke="#a97921" stroke-width="3" class="rough"/><rect x="440" y="186" width="142" height="96" rx="12" fill="none" stroke="#a97921" stroke-opacity=".22" stroke-width="1.5"/>
    <text x="511" y="229.5" text-anchor="middle" class="node-title">Waits for CI</text>
    <text x="511" y="250.5" text-anchor="middle" class="body">minutes pass</text>
  </g>
  <g><path d="M 586 234 C 601 234, 601 234, 616 234" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arr-ink)" class="rough"/></g>
  <g transform="rotate(0.2 716 234)"><rect x="616" y="182" width="200" height="104" rx="16" fill="#ffe1de" stroke="#a45350" stroke-width="3" class="rough"/><rect x="620" y="186" width="192" height="96" rx="12" fill="none" stroke="#a45350" stroke-opacity=".22" stroke-width="1.5"/>
    <text x="716" y="219" text-anchor="middle" class="node-title">Wakes up</text>
    <text x="716" y="240" text-anchor="middle" class="body">the whole conversation</text>
    <text x="716" y="261" text-anchor="middle" class="body">back through the model</text>
  </g>
  <g><path d="M 816 234 C 831 234, 831 234, 846 234" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arr-ink)" class="rough"/></g>
  <g transform="rotate(-0.2 926 234)"><rect x="846" y="182" width="160" height="104" rx="16" fill="#ffe1de" stroke="#a45350" stroke-width="3" class="rough"/><rect x="850" y="186" width="152" height="96" rx="12" fill="none" stroke="#a45350" stroke-opacity=".22" stroke-width="1.5"/>
    <text x="926" y="219" text-anchor="middle" class="node-title">Checks status</text>
    <text x="926" y="240" text-anchor="middle" class="body">one tiny answer,</text>
    <text x="926" y="261" text-anchor="middle" class="body">one full model turn</text>
  </g>
  <g><path d="M 1006 234 C 1021 234, 1021 234, 1036 234" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arr-ink)" class="rough"/></g>
  <g transform="rotate(0.2 1111 234)"><rect x="1036" y="182" width="150" height="104" rx="16" fill="#dcf3e5" stroke="#3f8460" stroke-width="3" class="rough"/><rect x="1040" y="186" width="142" height="96" rx="12" fill="none" stroke="#3f8460" stroke-opacity=".22" stroke-width="1.5"/>
    <text x="1111" y="219" text-anchor="middle" class="node-title">Finally done</text>
    <text x="1111" y="240" text-anchor="middle" class="body">deployment proof,</text>
    <text x="1111" y="261" text-anchor="middle" class="body">after more waiting</text>
  </g>
  <g><path d="M 926 286 Q 718 352, 511 286" fill="none" stroke="#a45350" stroke-width="3" stroke-dasharray="10 9" marker-end="url(#arr-roseStroke)" class="rough"/>
    <text x="718" y="348" text-anchor="middle" class="arrow-label" fill="#a45350">not done → wait, wake, re-read, ask again</text>
    <text x="718" y="370" text-anchor="middle" class="arrow-label" fill="#a45350">×4 wake-ups in one recent sequence</text>
  </g>
  <g><path d="M 640 392 C 640 392, 640 424, 640 424" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arr-ink)" class="rough"/></g>
  <text x="664" y="414" class="small" font-style="italic">the wake → re-read → check loops are exactly what got deleted</text>
  <rect x="48" y="430" width="1184" height="286" rx="20" fill="#dcf3e5" fill-opacity=".22" stroke="#3f8460" stroke-width="2" stroke-dasharray="10 8" class="rough"/>
  <text x="72" y="462" class="lane-label" fill="#3f8460">AFTER — CI owns the wait, and waiting is free</text>
  <g transform="rotate(-0.2 166 538)"><rect x="96" y="486" width="140" height="104" rx="16" fill="#dce8ff" stroke="#4f6fad" stroke-width="3" class="rough"/><rect x="100" y="490" width="132" height="96" rx="12" fill="none" stroke="#4f6fad" stroke-opacity=".22" stroke-width="1.5"/>
    <text x="166" y="533.5" text-anchor="middle" class="node-title">Agent codes</text>
    <text x="166" y="554.5" text-anchor="middle" class="body">the useful work</text>
  </g>
  <g><path d="M 236 538 C 251 538, 251 538, 266 538" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arr-ink)" class="rough"/></g>
  <g transform="rotate(0.2 351 538)"><rect x="266" y="486" width="170" height="104" rx="16" fill="#dce8ff" stroke="#4f6fad" stroke-width="3" class="rough"/><rect x="270" y="490" width="162" height="96" rx="12" fill="none" stroke="#4f6fad" stroke-opacity=".22" stroke-width="1.5"/>
    <text x="351" y="523" text-anchor="middle" class="node-title">Targeted checks</text>
    <text x="351" y="544" text-anchor="middle" class="body">just what the</text>
    <text x="351" y="565" text-anchor="middle" class="body">next edit needs</text>
  </g>
  <g><path d="M 436 538 C 451 538, 451 538, 466 538" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arr-ink)" class="rough"/></g>
  <g transform="rotate(-0.2 564 538)"><rect x="466" y="486" width="196" height="104" rx="16" fill="#dcf3e5" stroke="#3f8460" stroke-width="4" class="rough"/><rect x="470" y="490" width="188" height="96" rx="12" fill="none" stroke="#3f8460" stroke-opacity=".22" stroke-width="1.5"/>
    <text x="564" y="523" text-anchor="middle" class="node-title-strong">CI_HANDOFF</text>
    <text x="564" y="544" text-anchor="middle" class="body">commit, hand off,</text>
    <text x="564" y="565" text-anchor="middle" class="body">agent exits</text>
  </g>
  <g><path d="M 662 538 C 682 538, 682 538, 702 538" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arr-ink)" class="rough"/></g>
  <g transform="rotate(0.2 828 538)"><rect x="702" y="486" width="252" height="104" rx="16" fill="#e9e1ff" stroke="#7459a8" stroke-width="3" class="rough"/><rect x="706" y="490" width="244" height="96" rx="12" fill="none" stroke="#7459a8" stroke-opacity=".22" stroke-width="1.5"/>
    <text x="828" y="523" text-anchor="middle" class="node-title">CI keeps going</text>
    <text x="828" y="544" text-anchor="middle" class="body">tests · build · wait for</text>
    <text x="828" y="565" text-anchor="middle" class="body">deployment · browser proof</text>
  </g>
  <g><path d="M 934 504 C 972 504, 972 492, 1010 492" fill="none" stroke="#3f8460" stroke-width="2.5" marker-end="url(#arr-greenStroke)" class="rough"/></g>
  <g><path d="M 934 572 C 972 572, 972 594, 1010 594" fill="none" stroke="#a97921" stroke-width="2.5" marker-end="url(#arr-amberStroke)" class="rough"/></g>
  <g transform="rotate(-0.2 1109 492)"><rect x="1010" y="456" width="198" height="72" rx="16" fill="#dcf3e5" stroke="#3f8460" stroke-width="3" class="rough"/><rect x="1014" y="460" width="190" height="64" rx="12" fill="none" stroke="#3f8460" stroke-opacity=".22" stroke-width="1.5"/>
    <text x="1109" y="477" text-anchor="middle" class="node-title">All green</text>
    <text x="1109" y="498" text-anchor="middle" class="body">no model ever wakes —</text>
    <text x="1109" y="519" text-anchor="middle" class="body">the proof is the artifact</text>
  </g>
  <g transform="rotate(0.2 1109 594)"><rect x="1010" y="556" width="198" height="76" rx="16" fill="#fff0c9" stroke="#a97921" stroke-width="3" class="rough"/><rect x="1014" y="560" width="190" height="68" rx="12" fill="none" stroke="#a97921" stroke-opacity=".22" stroke-width="1.5"/>
    <text x="1109" y="579" text-anchor="middle" class="node-title">Failure</text>
    <text x="1109" y="600" text-anchor="middle" class="body">one cheap worker wakes</text>
    <text x="1109" y="621" text-anchor="middle" class="body">with the failing output</text>
  </g>
  <g opacity=".5"><path d="M 828 590 Q 696 640, 564 590" fill="none" stroke="#a45350" stroke-width="2.5" stroke-dasharray="9 8" class="rough"/>
    <path d="M 685 606 l 22 22 M 707 606 l -22 22" stroke="#a45350" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="564" y="676" text-anchor="middle" class="tag" fill="#3f8460">model tokens after this point: 0</text>
  <text x="905" y="676" text-anchor="middle" class="small" fill="#566174" font-style="italic">waiting costs CPU seconds, not model turns</text>
  <path d="M 48 750 C 360 746, 620 754, 950 748 S 1160 751, 1230 747" fill="none" stroke="#172033" stroke-width="1.5" stroke-opacity=".18" class="rough"/>
  <text x="48" y="772" class="footer">Evidence: AgentSessions audit, 632 Codex sessions since 1 Aug 2026 · four-wake sequence observed Sep 2026 · raw processed tokens, mostly cached input</text>
</svg>
