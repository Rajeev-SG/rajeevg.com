<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">One tiny question, one enormous re-read</title>
  <desc id="desc">A large stack labelled "the conversation so far" feeds four repeated model wake-ups. Each wake-up re-processes hundreds of thousands of tokens of accumulated context to answer "done yet?" with "still running". One observed sequence of four GitHub Actions status checks processed about 1.184 million raw tokens, mostly cached input.</desc>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#e7e2d5"/></pattern>
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="11" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="0.85"/></filter>
    <marker id="arr-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 9 5 L 0 10 z" fill="#172033"/></marker>
    <marker id="arr-roseStroke" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 9 5 L 0 10 z" fill="#a45350"/></marker>
    <marker id="arr-greenStroke" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 9 5 L 0 10 z" fill="#3f8460"/></marker>
    <marker id="arr-amberStroke" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 9 5 L 0 10 z" fill="#a97921"/></marker>
    <marker id="arr-purpleStroke" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 9 5 L 0 10 z" fill="#7459a8"/></marker>
    <marker id="arr-blueStroke" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 9 5 L 0 10 z" fill="#4f6fad"/></marker>
    <marker id="arr-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 9 5 L 0 10 z" fill="#566174"/></marker>
    <style>
      .rough { filter: url(#wobble); }
      .title { font: 700 34px Georgia, serif; fill: #172033; }
      .subtitle { font: 18px Georgia, serif; fill: #566174; }
      .lane-label { font: 700 17px "Comic Sans MS", "Bradley Hand", cursive; letter-spacing: 1px; }
      .node-title { font: 700 17px "Comic Sans MS", "Bradley Hand", cursive; fill: #172033; }
      .node-title-strong { font: 700 23px "Comic Sans MS", "Bradley Hand", cursive; fill: #172033; }
      .body { font: 14px "Comic Sans MS", "Bradley Hand", cursive; fill: #172033; }
      .small { font: 14px "Comic Sans MS", "Bradley Hand", cursive; fill: #566174; }
      .tag { font: 700 17px "Comic Sans MS", "Bradley Hand", cursive; fill: #172033; }
      .arrow-label { font: 14px "Comic Sans MS", "Bradley Hand", cursive; fill: #566174; paint-order: stroke; stroke: #fbfaf5; stroke-width: 7px; }
      .banner-main { font: 700 20px "Comic Sans MS", "Bradley Hand", cursive; fill: #172033; }
      .banner-sub { font: 15px "Comic Sans MS", "Bradley Hand", cursive; fill: #566174; }
      .footer { font: 15px Georgia, serif; font-style: italic; fill: #566174; }
    </style>
  </defs>
  <rect width="1280" height="720" fill="#fbfaf5"/>
  <rect width="1280" height="720" fill="url(#dots)" opacity=".68"/>
  <text x="48" y="58" class="title">One tiny question, one enormous re-read</text>
  <text x="48" y="90" class="subtitle">Every “done yet?” drags the whole accumulated conversation back through the model. The answer changes nothing; the input is everything.</text>
  <path d="M 48 104 C 330 101, 580 108, 846 103 S 1125 106, 1230 102" fill="none" stroke="#172033" stroke-width="2" stroke-opacity=".18" class="rough"/>
  <g><rect x="64" y="150" width="330" height="398" rx="18" fill="#e9e1ff" stroke="#7459a8" stroke-width="3" class="rough"/>
    <text x="229" y="186" text-anchor="middle" class="node-title">The conversation so far</text>
    <rect x="84" y="208" width="290" height="42" rx="10" fill="#f6f2ff" stroke="#7459a8" stroke-opacity=".55" stroke-width="1.5" class="rough"/>
    <text x="229" y="235" text-anchor="middle" class="body">the task instructions</text>
    <rect x="84" y="260" width="290" height="42" rx="10" fill="#f6f2ff" stroke="#7459a8" stroke-opacity=".55" stroke-width="1.5" class="rough"/>
    <text x="229" y="287" text-anchor="middle" class="body">every file it has read</text>
    <rect x="84" y="312" width="290" height="42" rx="10" fill="#f6f2ff" stroke="#7459a8" stroke-opacity=".55" stroke-width="1.5" class="rough"/>
    <text x="229" y="339" text-anchor="middle" class="body">every edit and test run</text>
    <rect x="84" y="364" width="290" height="42" rx="10" fill="#f6f2ff" stroke="#7459a8" stroke-opacity=".55" stroke-width="1.5" class="rough"/>
    <text x="229" y="391" text-anchor="middle" class="body">every previous turn</text>
    <rect x="84" y="416" width="290" height="42" rx="10" fill="#f6f2ff" stroke="#7459a8" stroke-opacity=".55" stroke-width="1.5" class="rough"/>
    <text x="229" y="443" text-anchor="middle" class="body">…and it keeps growing</text>
    <rect x="76" y="486" width="306" height="44" rx="12" fill="#7459a8" class="rough"/>
    <text x="229" y="514" text-anchor="middle" class="tag" font-size="15" fill="#fbfaf5">hundreds of thousands of tokens</text>
  </g>
  <g><path d="M 394 202 C 457 202, 457 202, 520 202" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arr-ink)" class="rough"/></g>
  <g><rect x="520" y="166" width="470" height="72" rx="16" fill="#ffe1de" stroke="#a45350" stroke-width="3" class="rough"/>
    <text x="755" y="196" text-anchor="middle" class="node-title">Wake-up #1: “done yet?”</text>
    <text x="755" y="220" text-anchor="middle" class="body">the whole conversation re-processed to answer: “still running”</text>
  </g>
  <text x="1006" y="200" class="tag">≈ 296K raw tokens</text>
  <text x="1006" y="222" class="small">(average per wake-up)</text>
  <g><path d="M 394 298 C 457 298, 457 298, 520 298" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arr-ink)" class="rough"/></g>
  <g><rect x="520" y="262" width="470" height="72" rx="16" fill="#ffe1de" stroke="#a45350" stroke-width="3" class="rough"/>
    <text x="755" y="292" text-anchor="middle" class="node-title">Wake-up #2: “done yet?”</text>
    <text x="755" y="316" text-anchor="middle" class="body">the whole conversation re-processed to answer: “still running”</text>
  </g>
  <text x="1006" y="296" class="tag">≈ 296K raw tokens</text>
  <text x="1006" y="318" class="small">(average per wake-up)</text>
  <g><path d="M 394 394 C 457 394, 457 394, 520 394" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arr-ink)" class="rough"/></g>
  <g><rect x="520" y="358" width="470" height="72" rx="16" fill="#ffe1de" stroke="#a45350" stroke-width="3" class="rough"/>
    <text x="755" y="388" text-anchor="middle" class="node-title">Wake-up #3: “done yet?”</text>
    <text x="755" y="412" text-anchor="middle" class="body">the whole conversation re-processed to answer: “still running”</text>
  </g>
  <text x="1006" y="392" class="tag">≈ 296K raw tokens</text>
  <text x="1006" y="414" class="small">(average per wake-up)</text>
  <g><path d="M 394 490 C 457 490, 457 490, 520 490" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arr-ink)" class="rough"/></g>
  <g><rect x="520" y="454" width="470" height="72" rx="16" fill="#ffe1de" stroke="#a45350" stroke-width="3" class="rough"/>
    <text x="755" y="484" text-anchor="middle" class="node-title">Wake-up #4: “done yet?”</text>
    <text x="755" y="508" text-anchor="middle" class="body">the whole conversation re-processed to answer: “still running”</text>
  </g>
  <text x="1006" y="488" class="tag">≈ 296K raw tokens</text>
  <text x="1006" y="510" class="small">(average per wake-up)</text>
  <g><path d="M 755 526 Q 500 564, 229 548" fill="none" stroke="#7459a8" stroke-width="2.5" stroke-dasharray="10 9" marker-end="url(#arr-purpleStroke)" class="rough"/><text x="430" y="588" text-anchor="middle" class="arrow-label" fill="#7459a8">each wake makes the pile bigger</text></g>
  <g><rect x="64" y="596" width="1152" height="76" rx="18" fill="#fff0c9" stroke="#a97921" stroke-width="3" class="rough"/>
    <text x="640" y="628" text-anchor="middle" class="banner-main">One observed sequence: four status checks ≈ 1,184,000 raw processed tokens</text>
    <text x="640" y="654" text-anchor="middle" class="banner-sub">raw processed ≠ billed fresh — most of that input was cached; the cost is wasted turns, quota and latency</text>
  </g>
  <path d="M 48 690 C 360 686, 620 694, 950 688 S 1160 691, 1230 687" fill="none" stroke="#172033" stroke-width="1.5" stroke-opacity=".18" class="rough"/>
  <text x="48" y="712" class="footer">Evidence: AgentSessions audit of 632 Codex sessions since 1 Aug 2026 · figure drawn 9 Sep 2026</text>
</svg>
