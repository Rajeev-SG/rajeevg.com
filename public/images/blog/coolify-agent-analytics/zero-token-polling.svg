<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Zero-token polling for cloud agents</title>
  <desc id="desc">A diagram showing OpenClaw and Hermes checking Agent Mail with deterministic pollers and waking a language model only when unread work exists.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#12233b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="80" r="190" fill="#0ea5e9" opacity=".08"/>
  <circle cx="90" cy="570" r="210" fill="#22c55e" opacity=".07"/>

  <text x="72" y="92" fill="#7dd3fc" font-family="ui-sans-serif,system-ui" font-size="20" font-weight="700" letter-spacing="3">COOLIFY AGENT OPERATIONS</text>
  <text x="72" y="145" fill="#f8fafc" font-family="ui-sans-serif,system-ui" font-size="44" font-weight="750">Poll cheaply. Reason only when needed.</text>
  <text x="72" y="185" fill="#94a3b8" font-family="ui-sans-serif,system-ui" font-size="21">The inbox check is deterministic. The model stays asleep when there is no work.</text>

  <g filter="url(#shadow)">
    <rect x="72" y="245" width="250" height="190" rx="22" fill="#0f2035" stroke="#38bdf8" stroke-width="2"/>
    <text x="102" y="292" fill="#e0f2fe" font-family="ui-sans-serif,system-ui" font-size="26" font-weight="700">OpenClaw</text>
    <text x="102" y="327" fill="#7dd3fc" font-family="ui-monospace,monospace" font-size="16">AmberOwl</text>
    <rect x="102" y="356" width="190" height="48" rx="12" fill="#082f49"/>
    <text x="197" y="387" text-anchor="middle" fill="#bae6fd" font-family="ui-sans-serif,system-ui" font-size="17" font-weight="650">command poller</text>

    <rect x="475" y="245" width="250" height="190" rx="22" fill="#152238" stroke="#a78bfa" stroke-width="2"/>
    <text x="505" y="292" fill="#f5f3ff" font-family="ui-sans-serif,system-ui" font-size="26" font-weight="700">Agent Mail</text>
    <text x="505" y="327" fill="#c4b5fd" font-family="ui-sans-serif,system-ui" font-size="16">unread-only mailbox</text>
    <path d="M530 363h140v50H530z" fill="#2e1065" rx="10"/>
    <path d="M535 368l65 31 65-31" fill="none" stroke="#ddd6fe" stroke-width="4"/>

    <rect x="878" y="245" width="250" height="190" rx="22" fill="#10281f" stroke="#4ade80" stroke-width="2"/>
    <text x="908" y="292" fill="#dcfce7" font-family="ui-sans-serif,system-ui" font-size="26" font-weight="700">Hermes</text>
    <text x="908" y="327" fill="#86efac" font-family="ui-monospace,monospace" font-size="16">SilverForge</text>
    <rect x="908" y="356" width="190" height="48" rx="12" fill="#052e16"/>
    <text x="1003" y="387" text-anchor="middle" fill="#bbf7d0" font-family="ui-sans-serif,system-ui" font-size="17" font-weight="650">wakeAgent gate</text>
  </g>

  <path d="M322 340h137" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
  <path d="M449 329l20 11-20 11" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M741 340h121" stroke="#4ade80" stroke-width="5" stroke-linecap="round"/>
  <path d="M852 329l20 11-20 11" fill="none" stroke="#4ade80" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="312" y="486" width="576" height="82" rx="18" fill="#081525" stroke="#334155"/>
  <text x="600" y="520" text-anchor="middle" fill="#f8fafc" font-family="ui-sans-serif,system-ui" font-size="22" font-weight="700">Unread = 0 → zero provider tokens</text>
  <text x="600" y="549" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif,system-ui" font-size="17">Unread &gt; 0 → wake the model with only the new messages</text>
</svg>
