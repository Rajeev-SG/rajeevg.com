<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Agent Usage Observatory</title>
  <desc id="desc">Editorial token-usage graphic comparing Codex and OpenCode Go.</desc>
  <rect width="1600" height="1000" fill="#f4f1eb"/>
  <g fill="#252522">
    <text x="110" y="150" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="5">AGENT USAGE OBSERVATORY</text>
    <text x="110" y="285" font-family="Georgia, serif" font-size="96">Where are the</text>
    <text x="110" y="390" font-family="Georgia, serif" font-size="96">tokens going?</text>
    <text x="110" y="485" font-family="Arial, sans-serif" font-size="34" fill="#6d6b64">Current measured split</text>
  </g>
  <rect x="110" y="555" width="1380" height="90" fill="#b0502b"/>
  <rect x="1337" y="555" width="153" height="90" fill="#315d72"/>
  <g font-family="Arial, sans-serif" font-size="34" font-weight="700">
    <text x="110" y="715" fill="#b0502b">CODEX 88.9%</text>
    <text x="110" y="780" fill="#315d72">OPENCODE GO 11.1%</text>
  </g>
  <line x1="110" y1="855" x2="1490" y2="855" stroke="#252522" stroke-width="3"/>
  <text x="110" y="920" font-family="Georgia, serif" font-size="48" fill="#252522">Measured, joined, and honest about the gap.</text>
</svg>
