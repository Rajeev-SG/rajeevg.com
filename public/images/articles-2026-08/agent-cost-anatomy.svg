<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Anatomy of a slow, expensive agent</title>
  <desc id="desc">Most of the cost never reaches the model. It accumulates around it.</desc>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#e7e2d5"/></pattern>
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="11" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="0.85"/></filter>
    <marker id="arrowEnd" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 9 5 L 0 10 z" fill="#172033"/></marker>
    <style>
      .rough { filter: url(#wobble); }
      .title { font: 700 34px Georgia, serif; fill: #172033; }
      .subtitle { font: 18px Georgia, serif; fill: #566174; }
      .node-title { font: 700 23px "Comic Sans MS", "Bradley Hand", cursive; fill: #172033; }
      .body { font: 16px "Comic Sans MS", "Bradley Hand", cursive; fill: #172033; }
      .arrow-label { font: 14px "Comic Sans MS", "Bradley Hand", cursive; fill: #566174; paint-order: stroke; stroke: #fbfaf5; stroke-width: 7px; }
      .footer { font: 15px Georgia, serif; font-style: italic; fill: #566174; }
    </style>
  </defs>
  <rect width="1280" height="720" fill="#fbfaf5"/>
  <rect width="1280" height="720" fill="url(#dots)" opacity=".68"/>
  <path d="M 48 101 C 330 98, 580 105, 846 100 S 1125 103, 1230 99" fill="none" stroke="#172033" stroke-width="2" stroke-opacity=".18" class="rough"/>
  <text x="48" y="60" class="title">Anatomy of a slow, expensive agent</text>
  <text x="48" y="91" class="subtitle">Most of the cost never reaches the model. It accumulates around it.</text>
  <g><path d="M 360 250 C 405 250, 405 250, 450 250" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/></g>
<g><path d="M 770 250 C 815 250, 815 250, 860 250" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/></g>
<g><path d="M 760 340 C 605 340, 605 430, 450 430" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/></g>
<g><path d="M 650 505 C 675 505, 675 505, 700 505" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/></g>
  <g><rect x="60" y="160" width="300" height="180" rx="18" fill="#dce8ff" stroke="#4f6fad" stroke-width="3" class="rough"/><rect x="65" y="165" width="290" height="170" rx="14" fill="none" stroke="#4f6fad" stroke-opacity=".22" stroke-width="1.5"/><text x="210" y="200" text-anchor="middle" class="node-title">Every hop resends context</text><text x="210" y="234" text-anchor="middle" class="body">instructions again</text>
<text x="210" y="258" text-anchor="middle" class="body">history again</text>
<text x="210" y="282" text-anchor="middle" class="body">paid again</text></g>
<g><rect x="450" y="160" width="320" height="180" rx="18" fill="#e9e1ff" stroke="#7459a8" stroke-width="3" class="rough"/><rect x="455" y="165" width="310" height="170" rx="14" fill="none" stroke="#7459a8" stroke-opacity=".22" stroke-width="1.5"/><text x="610" y="200" text-anchor="middle" class="node-title">Oversight costs more than work</text><text x="610" y="234" text-anchor="middle" class="body">planning tokens</text>
<text x="610" y="258" text-anchor="middle" class="body">review tokens</text>
<text x="610" y="282" text-anchor="middle" class="body">polling waits</text></g>
<g><rect x="860" y="160" width="330" height="180" rx="18" fill="#fff0c9" stroke="#a97921" stroke-width="3" class="rough"/><rect x="865" y="165" width="320" height="170" rx="14" fill="none" stroke="#a97921" stroke-opacity=".22" stroke-width="1.5"/><text x="1025" y="200" text-anchor="middle" class="node-title">Failures are cumulative</text><text x="1025" y="234" text-anchor="middle" class="body">retries · inbox errors</text>
<text x="1025" y="258" text-anchor="middle" class="body">tool-output bloat</text>
<text x="1025" y="282" text-anchor="middle" class="body">stale duplicate workers</text></g>
<g><rect x="250" y="430" width="400" height="150" rx="18" fill="#ffe1de" stroke="#a45350" stroke-width="3" class="rough"/><rect x="255" y="435" width="390" height="140" rx="14" fill="none" stroke="#a45350" stroke-opacity=".22" stroke-width="1.5"/><text x="450" y="470" text-anchor="middle" class="node-title">Attribution breaks</text><text x="450" y="504" text-anchor="middle" class="body">cumulative counters read as task totals</text>
<text x="450" y="528" text-anchor="middle" class="body">unknowns become zeros</text></g>
<g><rect x="700" y="430" width="400" height="150" rx="18" fill="#dcf3e5" stroke="#3f8460" stroke-width="3" class="rough"/><rect x="705" y="435" width="390" height="140" rx="14" fill="none" stroke="#3f8460" stroke-opacity=".22" stroke-width="1.5"/><text x="900" y="470" text-anchor="middle" class="node-title">The fix is structural</text><text x="900" y="504" text-anchor="middle" class="body">fewer hops · measured oversight</text>
<text x="900" y="528" text-anchor="middle" class="body">task-scoped metrics · honest unknowns</text></g>
  <path d="M 48 674 C 360 670, 620 678, 950 672 S 1160 675, 1230 671" fill="none" stroke="#172033" stroke-width="1.5" stroke-opacity=".18" class="rough"/>
  <text x="640" y="700" text-anchor="middle" class="footer">Evidence date: 29 Aug 2026  ·  measured across 551 sessions and two public dashboards</text>
</svg>