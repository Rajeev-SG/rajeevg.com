<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Messy material to governed knowledge</title>
  <desc id="desc">The pipeline is boring on purpose. That is why it holds up.</desc>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#e7e2d5"/></pattern>
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="11" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="0.85"/></filter>
    <marker id="arrowEnd" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 9 5 L 0 10 z" fill="#172033"/></marker>
    <style>
      .rough { filter: url(#wobble); }
      .title { font: 700 34px Georgia, serif; fill: #172033; }
      .subtitle { font: 18px Georgia, serif; fill: #566174; }
      .node-title { font: 700 23px "Comic Sans MS", "Bradley Hand", cursive; fill: #172033; }
      .body { font: 16px "Comic Sans MS", "Bradley Hand", cursive; fill: #172033; }
      .arrow-label { font: 14px "Comic Sans MS", "Bradley Hand", cursive; fill: #566174; paint-order: stroke; stroke: #fbfaf5; stroke-width: 7px; }
      .footer { font: 15px Georgia, serif; font-style: italic; fill: #566174; }
    </style>
  </defs>
  <rect width="1280" height="720" fill="#fbfaf5"/>
  <rect width="1280" height="720" fill="url(#dots)" opacity=".68"/>
  <path d="M 48 101 C 330 98, 580 105, 846 100 S 1125 103, 1230 99" fill="none" stroke="#172033" stroke-width="2" stroke-opacity=".18" class="rough"/>
  <text x="48" y="60" class="title">Messy material to governed knowledge</text>
  <text x="48" y="91" class="subtitle">The pipeline is boring on purpose. That is why it holds up.</text>
  <g><path d="M 390 265 C 435 265, 435 265, 480 265" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/></g>
<g><path d="M 790 265 C 835 265, 835 265, 880 265" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/></g>
<g><path d="M 880 360 C 755 360, 755 450, 630 450" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/></g>
  <g><rect x="60" y="170" width="330" height="190" rx="18" fill="#dce8ff" stroke="#4f6fad" stroke-width="3" class="rough"/><rect x="65" y="175" width="320" height="180" rx="14" fill="none" stroke="#4f6fad" stroke-opacity=".22" stroke-width="1.5"/><text x="225" y="210" text-anchor="middle" class="node-title">Messy input</text><text x="225" y="244" text-anchor="middle" class="body">files · email · decks</text>
<text x="225" y="268" text-anchor="middle" class="body">sheets · meetings</text></g>
<g><rect x="480" y="170" width="310" height="190" rx="18" fill="#e9e1ff" stroke="#7459a8" stroke-width="3" class="rough"/><rect x="485" y="175" width="300" height="180" rx="14" fill="none" stroke="#7459a8" stroke-opacity=".22" stroke-width="1.5"/><text x="635" y="210" text-anchor="middle" class="node-title">Extraction and structure</text><text x="635" y="244" text-anchor="middle" class="body">entities · dates · owners</text>
<text x="635" y="268" text-anchor="middle" class="body">provenance on every claim</text></g>
<g><rect x="880" y="170" width="310" height="190" rx="18" fill="#dcf3e5" stroke="#3f8460" stroke-width="3" class="rough"/><rect x="885" y="175" width="300" height="180" rx="14" fill="none" stroke="#3f8460" stroke-opacity=".22" stroke-width="1.5"/><text x="1035" y="210" text-anchor="middle" class="node-title">Governed layer</text><text x="1035" y="244" text-anchor="middle" class="body">named owners</text>
<text x="1035" y="268" text-anchor="middle" class="body">review dates</text>
<text x="1035" y="292" text-anchor="middle" class="body">one canonical version</text></g>
