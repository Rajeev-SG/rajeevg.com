<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Earlier products and what they taught</title>
  <desc id="desc">Nine experiments. Each one taught something specific. Some survived.</desc>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#e7e2d5"/></pattern>
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="11" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="0.85"/></filter>
    <marker id="arrowEnd" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 9 5 L 0 10 z" fill="#172033"/></marker>
    <style>
      .rough { filter: url(#wobble); }
      .title { font: 700 34px Georgia, serif; fill: #172033; }
      .subtitle { font: 18px Georgia, serif; fill: #566174; }
      .node-title { font: 700 23px "Comic Sans MS", "Bradley Hand", cursive; fill: #172033; }
      .body { font: 16px "Comic Sans MS", "Bradley Hand", cursive; fill: #172033; }
      .arrow-label { font: 14px "Comic Sans MS", "Bradley Hand", cursive; fill: #566174; paint-order: stroke; stroke: #fbfaf5; stroke-width: 7px; }
      .footer { font: 15px Georgia, serif; font-style: italic; fill: #566174; }
    </style>
  </defs>
  <rect width="1280" height="720" fill="#fbfaf5"/>
  <rect width="1280" height="720" fill="url(#dots)" opacity=".68"/>
  <path d="M 48 101 C 330 98, 580 105, 846 100 S 1125 103, 1230 99" fill="none" stroke="#172033" stroke-width="2" stroke-opacity=".18" class="rough"/>
  <text x="48" y="60" class="title">Earlier products and what they taught</text>
  <text x="48" y="91" class="subtitle">Nine experiments. Each one taught something specific. Some survived.</text>
  <g><path d="M 235 270 C 332.5 270, 332.5 470, 430 470" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/></g>
<g><path d="M 635 270 C 635 270, 635 470, 635 470" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/></g>
<g><path d="M 1030 270 C 945 270, 945 470, 860 470" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/></g>
  <g><rect x="60" y="150" width="350" height="120" rx="18" fill="#dce8ff" stroke="#4f6fad" stroke-width="3" class="rough"/><rect x="65" y="155" width="340" height="110" rx="14" fill="none" stroke="#4f6fad" stroke-opacity=".22" stroke-width="1.5"/><text x="235" y="190" text-anchor="middle" class="node-title">Choice Compass</text><text x="235" y="224" text-anchor="middle" class="body">taught: simplicity beats features</text></g>
<g><rect x="460" y="150" width="350" height="120" rx="18" fill="#e9e1ff" stroke="#7459a8" stroke-width="3" class="rough"/><rect x="465" y="155" width="340" height="110" rx="14" fill="none" stroke="#7459a8" stroke-opacity=".22" stroke-width="1.5"/><text x="635" y="190" text-anchor="middle" class="node-title">Proof Pack</text><text x="635" y="224" text-anchor="middle" class="body">taught: provenance needs a home</text></g>
<g><rect x="860" y="150" width="340" height="120" rx="18" fill="#dcf3e5" stroke="#3f8460" stroke-width="3" class="rough"/><rect x="865" y="155" width="330" height="110" rx="14" fill="none" stroke="#3f8460" stroke-opacity=".22" stroke-width="1.5"/><text x="1030" y="190" text-anchor="middle" class="node-title">Mark Notes</text><text x="1030" y="224" text-anchor="middle" class="body">taught: local-first is a real constraint</text></g>
<g><rect x="60" y="310" width="350" height="120" rx="18" fill="#fff0c9" stroke="#a97921" stroke-width="3" class="rough"/><rect x="65" y="315" width="340" height="110" rx="14" fill="none" stroke="#a97921" stroke-opacity=".22" stroke-width="1.5"/><text x="235" y="350" text-anchor="middle" class="node-title">GitHub Canvas Monitor</text><text x="235" y="384" text-anchor="middle" class="body">taught: dashboards need decisions</text></g>
<g><rect x="460" y="310" width="350" height="120" rx="18" fill="#ffe1de" stroke="#a45350" stroke-width="3" class="rough"/><rect x="465" y="315" width="340" height="110" rx="14" fill="none" stroke="#a45350" stroke-opacity=".22" stroke-width="1.5"/><text x="635" y="350" text-anchor="middle" class="node-title">Singulyr PACT</text><text x="635" y="384" text-anchor="middle" class="body">taught: prototype to production is a gap</text></g>
<g><rect x="860" y="310" width="340" height="120" rx="18" fill="#dce8ff" stroke="#4f6fad" stroke-width="3" class="rough"/><rect x="865" y="315" width="330" height="110" rx="14" fill="none" stroke="#4f6fad" stroke-opacity=".22" stroke-width="1.5"/><text x="1030" y="350" text-anchor="middle" class="node-title">OpenReview deployment</text><text x="1030" y="384" text-anchor="middle" class="body">taught: attributed forks still ship</text></g>
<g><rect x="260" y="470" width="740" height="130" rx="18" fill="#dcf3e5" stroke="#3f8460" stroke-width="3" class="rough"/><rect x="265" y="475" width="730" height="120" rx="14" fill="none" stroke="#3f8460" stroke-opacity=".22" stroke-width="1.5"/><text x="630" y="510" text-anchor="middle" class="node-title">What survived</text><text x="630" y="544" text-anchor="middle" class="body">proof thinking → Proof, Not Prompts and the QA toolkit</text>
<text x="630" y="568" text-anchor="middle" class="body">governed content → the knowledge-systems pipeline</text></g>
  <path d="M 48 674 C 360 670, 620 678, 950 672 S 1160 675, 1230 671" fill="none" stroke="#172033" stroke-width="1.5" stroke-opacity=".18" class="rough"/>
  <text x="640" y="700" text-anchor="middle" class="footer">Evidence date: 29 Aug 2026  ·  nothing was deleted; everything was either promoted or filed here with its lesson</text>
</svg>