<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">The decision tree, drawn out</title>
  <desc id="desc">How the four questions resolve into an implementation choice.</desc>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#e7e2d5"/></pattern>
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="11" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="0.85"/></filter>
    <marker id="arrowEnd" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 9 5 L 0 10 z" fill="#172033"/></marker>
    <style>
      .rough { filter: url(#wobble); }
      .title { font: 700 34px Georgia, serif; fill: #172033; }
      .subtitle { font: 18px Georgia, serif; fill: #566174; }
      .node-title { font: 700 22px "Comic Sans MS", "Bradley Hand", cursive; fill: #172033; }
      .body { font: 15px "Comic Sans MS", "Bradley Hand", cursive; fill: #172033; }
      .arrow-label { font: 14px "Comic Sans MS", "Bradley Hand", cursive; fill: #566174; paint-order: stroke; stroke: #fbfaf5; stroke-width: 7px; }
      .footer { font: 15px Georgia, serif; font-style: italic; fill: #566174; }
    </style>
  </defs>
  <rect width="1280" height="720" fill="#fbfaf5"/>
  <rect width="1280" height="720" fill="url(#dots)" opacity=".68"/>
  <path d="M 48 101 C 330 98, 580 105, 846 100 S 1125 103, 1230 99" fill="none" stroke="#172033" stroke-width="2" stroke-opacity=".18" class="rough"/>
  <text x="48" y="60" class="title">The decision tree, drawn out</text>
  <text x="48" y="91" class="subtitle">How the four questions resolve into an implementation choice.</text>
  <g><path d="M 309 300 C 333 300, 333 300, 357 300" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/></g>
<g><path d="M 486.5 400 C 640 400, 640 200, 793.5 200" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/></g>
<g><path d="M 923 300 C 947 300, 947 300, 971 300" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/></g>
  <g><rect x="50" y="200" width="259" height="200" rx="18" fill="#dce8ff" stroke="#4f6fad" stroke-width="3" class="rough"/><rect x="55" y="205" width="249" height="190" rx="14" fill="none" stroke="#4f6fad" stroke-opacity=".22" stroke-width="1.5"/><text x="179.5" y="240" text-anchor="middle" class="node-title">Ambiguous input?</text><text x="179.5" y="274" text-anchor="middle" class="body">no → normal code</text>
<text x="179.5" y="298" text-anchor="middle" class="body">yes → keep asking</text></g>
<g><rect x="357" y="200" width="259" height="200" rx="18" fill="#e9e1ff" stroke="#7459a8" stroke-width="3" class="rough"/><rect x="362" y="205" width="249" height="190" rx="14" fill="none" stroke="#7459a8" stroke-opacity=".22" stroke-width="1.5"/><text x="486.5" y="240" text-anchor="middle" class="node-title">Repeats identically?</text><text x="486.5" y="274" text-anchor="middle" class="body">yes → normal code</text>
<text x="486.5" y="298" text-anchor="middle" class="body">no → keep asking</text></g>
<g><rect x="664" y="200" width="259" height="200" rx="18" fill="#dcf3e5" stroke="#3f8460" stroke-width="3" class="rough"/><rect x="669" y="205" width="249" height="190" rx="14" fill="none" stroke="#3f8460" stroke-opacity=".22" stroke-width="1.5"/><text x="793.5" y="240" text-anchor="middle" class="node-title">Failure is cheap?</text><text x="793.5" y="274" text-anchor="middle" class="body">yes → agent OK</text>
<text x="793.5" y="298" text-anchor="middle" class="body">no → code with guardrails</text></g>
<g><rect x="971" y="200" width="259" height="200" rx="18" fill="#fff0c9" stroke="#a97921" stroke-width="3" class="rough"/><rect x="976" y="205" width="249" height="190" rx="14" fill="none" stroke="#a97921" stroke-opacity=".22" stroke-width="1.5"/><text x="1100.5" y="240" text-anchor="middle" class="node-title">Audit required?</text><text x="1100.5" y="274" text-anchor="middle" class="body">yes → code or logged agent</text>
<text x="1100.5" y="298" text-anchor="middle" class="body">no → agent freely</text></g>
  <path d="M 48 674 C 360 670, 620 678, 950 672 S 1160 675, 1230 671" fill="none" stroke="#172033" stroke-width="1.5" stroke-opacity=".18" class="rough"/>
  <text x="640" y="700" text-anchor="middle" class="footer">The honest answer is usually code, with an agent at the edges.  ·  Evidence date: 2026-08-29</text>
</svg>