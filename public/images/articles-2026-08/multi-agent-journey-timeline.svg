<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">What survived contact with reality</title>
  <desc id="desc">Each phase was measured. The survivors are the simple parts.</desc>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#e7e2d5"/></pattern>
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="11" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="0.85"/></filter>
    <marker id="arrowEnd" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 9 5 L 0 10 z" fill="#172033"/></marker>
    <style>
      .rough { filter: url(#wobble); }
      .title { font: 700 34px Georgia, serif; fill: #172033; }
      .subtitle { font: 18px Georgia, serif; fill: #566174; }
      .node-title { font: 700 23px "Comic Sans MS", "Bradley Hand", cursive; fill: #172033; }
      .body { font: 16px "Comic Sans MS", "Bradley Hand", cursive; fill: #172033; }
      .arrow-label { font: 14px "Comic Sans MS", "Bradley Hand", cursive; fill: #566174; paint-order: stroke; stroke: #fbfaf5; stroke-width: 7px; }
      .footer { font: 15px Georgia, serif; font-style: italic; fill: #566174; }
    </style>
  </defs>
  <rect width="1280" height="720" fill="#fbfaf5"/>
  <rect width="1280" height="720" fill="url(#dots)" opacity=".68"/>
  <path d="M 48 101 C 330 98, 580 105, 846 100 S 1125 103, 1230 99" fill="none" stroke="#172033" stroke-width="2" stroke-opacity=".18" class="rough"/>
  <text x="48" y="60" class="title">What survived contact with reality</text>
  <text x="48" y="91" class="subtitle">Each phase was measured. The survivors are the simple parts.</text>
  <g><path d="M 290 245 C 315 245, 315 245, 340 245" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/></g>
<g><path d="M 580 245 C 605 245, 605 245, 630 245" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/></g>
<g><path d="M 870 245 C 895 245, 895 245, 920 245" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/><text x="895" y="236" text-anchor="middle" class="arrow-label">telemetry verdict</text></g>
<g><path d="M 615 330 C 615 330, 615 430, 615 430" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/></g>
  <g><rect x="50" y="160" width="240" height="170" rx="18" fill="#dce8ff" stroke="#4f6fad" stroke-width="3" class="rough"/><rect x="55" y="165" width="230" height="160" rx="14" fill="none" stroke="#4f6fad" stroke-opacity=".22" stroke-width="1.5"/><text x="170" y="200" text-anchor="middle" class="node-title">Native subagents</text><text x="170" y="234" text-anchor="middle" class="body">parallel workers</text>
<text x="170" y="258" text-anchor="middle" class="body">no shared memory</text></g>
<g><rect x="340" y="160" width="240" height="170" rx="18" fill="#e9e1ff" stroke="#7459a8" stroke-width="3" class="rough"/><rect x="345" y="165" width="230" height="160" rx="14" fill="none" stroke="#7459a8" stroke-opacity=".22" stroke-width="1.5"/><text x="460" y="200" text-anchor="middle" class="node-title">Measurable</text><text x="460" y="234" text-anchor="middle" class="body">traces per worker</text>
<text x="460" y="258" text-anchor="middle" class="body">recoverable handoffs</text></g>
<g><rect x="630" y="160" width="240" height="170" rx="18" fill="#fff0c9" stroke="#a97921" stroke-width="3" class="rough"/><rect x="635" y="165" width="230" height="160" rx="14" fill="none" stroke="#a97921" stroke-opacity=".22" stroke-width="1.5"/><text x="750" y="200" text-anchor="middle" class="node-title">Codex + OpenCode</text><text x="750" y="234" text-anchor="middle" class="body">planner and executor</text>
<text x="750" y="258" text-anchor="middle" class="body">two models, one agent</text></g>
<g><rect x="920" y="160" width="310" height="170" rx="18" fill="#dcf3e5" stroke="#3f8460" stroke-width="3" class="rough"/><rect x="925" y="165" width="300" height="160" rx="14" fill="none" stroke="#3f8460" stroke-opacity=".22" stroke-width="1.5"/><text x="1075" y="200" text-anchor="middle" class="node-title">Simplified now</text><text x="1075" y="234" text-anchor="middle" class="body">role-aware agents</text>
<text x="1075" y="258" text-anchor="middle" class="body">optional A2A discovery</text></g>
<g><rect x="340" y="430" width="550" height="150" rx="18" fill="#ffe1de" stroke="#a45350" stroke-width="3" class="rough"/><rect x="345" y="435" width="540" height="140" rx="14" fill="none" stroke="#a45350" stroke-opacity=".22" stroke-width="1.5"/><text x="615" y="470" text-anchor="middle" class="node-title">What did not survive</text><text x="615" y="504" text-anchor="middle" class="body">Beads/BVR/NTM lifecycle bookkeeping</text>
<text x="615" y="528" text-anchor="middle" class="body">inbox errors and retry loops that cost more than the work</text></g>
  <path d="M 48 674 C 360 670, 620 678, 950 672 S 1160 675, 1230 671" fill="none" stroke="#172033" stroke-width="1.5" stroke-opacity=".18" class="rough"/>
  <text x="640" y="700" text-anchor="middle" class="footer">Evidence date: 29 Aug 2026  ·  551 sessions, public token data, and one deleted middleman later</text>
</svg>