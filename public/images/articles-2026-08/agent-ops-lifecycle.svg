<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">The operations loop</title>
  <desc id="desc">What happens between 'something looks wrong' and 'it is fixed'.</desc>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#e7e2d5"/></pattern>
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="11" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="0.85"/></filter>
    <marker id="arrowEnd" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 9 5 L 0 10 z" fill="#172033"/></marker>
    <style>
      .rough { filter: url(#wobble); }
      .title { font: 700 34px Georgia, serif; fill: #172033; }
      .subtitle { font: 18px Georgia, serif; fill: #566174; }
      .node-title { font: 700 23px "Comic Sans MS", "Bradley Hand", cursive; fill: #172033; }
      .body { font: 16px "Comic Sans MS", "Bradley Hand", cursive; fill: #172033; }
      .arrow-label { font: 14px "Comic Sans MS", "Bradley Hand", cursive; fill: #566174; paint-order: stroke; stroke: #fbfaf5; stroke-width: 7px; }
      .footer { font: 15px Georgia, serif; font-style: italic; fill: #566174; }
    </style>
  </defs>
  <rect width="1280" height="720" fill="#fbfaf5"/>
  <rect width="1280" height="720" fill="url(#dots)" opacity=".68"/>
  <path d="M 48 101 C 330 98, 580 105, 846 100 S 1125 103, 1230 99" fill="none" stroke="#172033" stroke-width="2" stroke-opacity=".18" class="rough"/>
  <text x="48" y="60" class="title">The operations loop</text>
  <text x="48" y="91" class="subtitle">What happens between 'something looks wrong' and 'it is fixed'.</text>
  <g><path d="M 360 260 C 405 260, 405 260, 450 260" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/><text x="405" y="251" text-anchor="middle" class="arrow-label">state</text></g>
<g><path d="M 760 260 C 805 260, 805 260, 850 260" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/><text x="805" y="251" text-anchor="middle" class="arrow-label">trigger</text></g>
<g><path d="M 850 340 C 745 340, 745 430, 640 430" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/><text x="745" y="376" text-anchor="middle" class="arrow-label">recover</text></g>
  <g><rect x="60" y="180" width="300" height="160" rx="18" fill="#dce8ff" stroke="#4f6fad" stroke-width="3" class="rough"/><rect x="65" y="185" width="290" height="150" rx="14" fill="none" stroke="#4f6fad" stroke-opacity=".22" stroke-width="1.5"/><text x="210" y="220" text-anchor="middle" class="node-title">Agents run</text><text x="210" y="254" text-anchor="middle" class="body">started by launchd</text>
<text x="210" y="278" text-anchor="middle" class="body">healthy or failing</text></g>
<g><rect x="450" y="180" width="310" height="160" rx="18" fill="#e9e1ff" stroke="#7459a8" stroke-width="3" class="rough"/><rect x="455" y="185" width="300" height="150" rx="14" fill="none" stroke="#7459a8" stroke-opacity=".22" stroke-width="1.5"/><text x="605" y="220" text-anchor="middle" class="node-title">Building manager</text><text x="605" y="254" text-anchor="middle" class="body">checks readiness</text>
<text x="605" y="278" text-anchor="middle" class="body">reports to the board</text></g>
<g><rect x="850" y="180" width="340" height="160" rx="18" fill="#fff0c9" stroke="#a97921" stroke-width="3" class="rough"/><rect x="855" y="185" width="330" height="150" rx="14" fill="none" stroke="#a97921" stroke-opacity=".22" stroke-width="1.5"/><text x="1020" y="220" text-anchor="middle" class="node-title">Alarm</text><text x="1020" y="254" text-anchor="middle" class="body">Alertmanager decides</text>
<text x="1020" y="278" text-anchor="middle" class="body">route or stay quiet</text></g>
<g><rect x="450" y="430" width="310" height="160" rx="18" fill="#ffe1de" stroke="#a45350" stroke-width="3" class="rough"/><rect x="455" y="435" width="300" height="150" rx="14" fill="none" stroke="#a45350" stroke-opacity=".22" stroke-width="1.5"/><text x="605" y="470" text-anchor="middle" class="node-title">Runbook</text><text x="605" y="504" text-anchor="middle" class="body">exact recovery steps</text>
<text x="605" y="528" text-anchor="middle" class="body">no memory required</text></g>
  <path d="M 48 674 C 360 670, 620 678, 950 672 S 1160 675, 1230 671" fill="none" stroke="#172033" stroke-width="1.5" stroke-opacity=".18" class="rough"/>
  <text x="640" y="700" text-anchor="middle" class="footer">Evidence date: 29 Aug 2026  ·  the loop ends when the runbook fixes the cause, not the symptom</text>
</svg>