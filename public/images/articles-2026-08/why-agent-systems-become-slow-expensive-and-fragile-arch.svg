<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Where cost actually accumulates</title>
  <desc id="desc">The request path, annotated with what each layer adds.</desc>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#e7e2d5"/></pattern>
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="11" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="0.85"/></filter>
    <marker id="arrowEnd" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 9 5 L 0 10 z" fill="#172033"/></marker>
    <style>
      .rough { filter: url(#wobble); }
      .title { font: 700 34px Georgia, serif; fill: #172033; }
      .subtitle { font: 18px Georgia, serif; fill: #566174; }
      .node-title { font: 700 22px "Comic Sans MS", "Bradley Hand", cursive; fill: #172033; }
      .body { font: 15px "Comic Sans MS", "Bradley Hand", cursive; fill: #172033; }
      .arrow-label { font: 14px "Comic Sans MS", "Bradley Hand", cursive; fill: #566174; paint-order: stroke; stroke: #fbfaf5; stroke-width: 7px; }
      .footer { font: 15px Georgia, serif; font-style: italic; fill: #566174; }
    </style>
  </defs>
  <rect width="1280" height="720" fill="#fbfaf5"/>
  <rect width="1280" height="720" fill="url(#dots)" opacity=".68"/>
  <path d="M 48 101 C 330 98, 580 105, 846 100 S 1125 103, 1230 99" fill="none" stroke="#172033" stroke-width="2" stroke-opacity=".18" class="rough"/>
  <text x="48" y="60" class="title">Where cost actually accumulates</text>
  <text x="48" y="91" class="subtitle">The request path, annotated with what each layer adds.</text>
  <g><path d="M 400 237.5 C 432.5 237.5, 432.5 237.5, 465 237.5" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/></g>
<g><path d="M 815 237.5 C 847.5 237.5, 847.5 237.5, 880 237.5" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/></g>
<g><path d="M 1055 325 C 640 325, 640 400, 225 400" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/></g>
<g><path d="M 400 487.5 C 640 487.5, 640 487.5, 880 487.5" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/></g>
  <g><rect x="50" y="150" width="350" height="175" rx="18" fill="#dce8ff" stroke="#4f6fad" stroke-width="3" class="rough"/><rect x="55" y="155" width="340" height="165" rx="14" fill="none" stroke="#4f6fad" stroke-opacity=".22" stroke-width="1.5"/><text x="225" y="190" text-anchor="middle" class="node-title">User request</text><text x="225" y="224" text-anchor="middle" class="body">instructions</text>
<text x="225" y="248" text-anchor="middle" class="body">attached</text></g>
<g><rect x="465" y="150" width="350" height="175" rx="18" fill="#e9e1ff" stroke="#7459a8" stroke-width="3" class="rough"/><rect x="470" y="155" width="340" height="165" rx="14" fill="none" stroke="#7459a8" stroke-opacity=".22" stroke-width="1.5"/><text x="640" y="190" text-anchor="middle" class="node-title">Planner agent</text><text x="640" y="224" text-anchor="middle" class="body">reads full context again</text>
<text x="640" y="248" text-anchor="middle" class="body">plans in tokens</text></g>
<g><rect x="880" y="150" width="350" height="175" rx="18" fill="#dcf3e5" stroke="#3f8460" stroke-width="3" class="rough"/><rect x="885" y="155" width="340" height="165" rx="14" fill="none" stroke="#3f8460" stroke-opacity=".22" stroke-width="1.5"/><text x="1055" y="190" text-anchor="middle" class="node-title">Worker agent</text><text x="1055" y="224" text-anchor="middle" class="body">receives its slice</text>
<text x="1055" y="248" text-anchor="middle" class="body">plus boilerplate</text></g>
<g><rect x="50" y="400" width="350" height="175" rx="18" fill="#fff0c9" stroke="#a97921" stroke-width="3" class="rough"/><rect x="55" y="405" width="340" height="165" rx="14" fill="none" stroke="#a97921" stroke-opacity=".22" stroke-width="1.5"/><text x="225" y="440" text-anchor="middle" class="node-title">Reviewer agent</text><text x="225" y="474" text-anchor="middle" class="body">reads output</text>
<text x="225" y="498" text-anchor="middle" class="body">plus original context</text></g>
<g><rect x="880" y="400" width="350" height="175" rx="18" fill="#ffe1de" stroke="#a45350" stroke-width="3" class="rough"/><rect x="885" y="405" width="340" height="165" rx="14" fill="none" stroke="#a45350" stroke-opacity=".22" stroke-width="1.5"/><text x="1055" y="440" text-anchor="middle" class="node-title">Cumulative bill</text><text x="1055" y="474" text-anchor="middle" class="body">every layer paid</text>
<text x="1055" y="498" text-anchor="middle" class="body">for the same context</text></g>
  <path d="M 48 674 C 360 670, 620 678, 950 672 S 1160 675, 1230 671" fill="none" stroke="#172033" stroke-width="1.5" stroke-opacity=".18" class="rough"/>
  <text x="640" y="700" text-anchor="middle" class="footer">Each arrow is a context resend. This is why hops are expensive, not model choice alone.  ·  Evidence date: 2026-08-29</text>
</svg>