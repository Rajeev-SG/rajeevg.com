<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Full reference architecture</title>
  <desc id="desc">Where each piece actually lives, and what each storage layer is for.</desc>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#e7e2d5"/></pattern>
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="11" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="0.85"/></filter>
    <marker id="arrowEnd" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 9 5 L 0 10 z" fill="#172033"/></marker>
    <style>
      .rough { filter: url(#wobble); }
      .title { font: 700 34px Georgia, serif; fill: #172033; }
      .subtitle { font: 18px Georgia, serif; fill: #566174; }
      .node-title { font: 700 23px "Comic Sans MS", "Bradley Hand", cursive; fill: #172033; }
      .body { font: 16px "Comic Sans MS", "Bradley Hand", cursive; fill: #172033; }
      .arrow-label { font: 14px "Comic Sans MS", "Bradley Hand", cursive; fill: #566174; paint-order: stroke; stroke: #fbfaf5; stroke-width: 7px; }
      .footer { font: 15px Georgia, serif; font-style: italic; fill: #566174; }
    </style>
  </defs>
  <rect width="1280" height="720" fill="#fbfaf5"/>
  <rect width="1280" height="720" fill="url(#dots)" opacity=".68"/>
  <path d="M 48 101 C 330 98, 580 105, 846 100 S 1125 103, 1230 99" fill="none" stroke="#172033" stroke-width="2" stroke-opacity=".18" class="rough"/>
  <text x="48" y="60" class="title">Full reference architecture</text>
  <text x="48" y="91" class="subtitle">Where each piece actually lives, and what each storage layer is for.</text>
  <g><path d="M 300 255 C 325 255, 325 255, 350 255" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/><text x="325" y="246" text-anchor="middle" class="arrow-label">OTLP</text></g>
<g><path d="M 600 220 C 630 220, 630 175, 660 175" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/></g>
<g><path d="M 600 280 C 630 280, 630 335, 660 335" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/></g>
<g><path d="M 600 345 C 630 345, 630 495, 660 495" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/><text x="630" y="411" text-anchor="middle" class="arrow-label">raw kept</text></g>
<g><path d="M 930 220 C 955 220, 955 265, 980 265" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/></g>
<g><path d="M 930 340 C 955 340, 955 300, 980 300" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/></g>
  <g><rect x="50" y="150" width="250" height="210" rx="18" fill="#dce8ff" stroke="#4f6fad" stroke-width="3" class="rough"/><rect x="55" y="155" width="240" height="200" rx="14" fill="none" stroke="#4f6fad" stroke-opacity=".22" stroke-width="1.5"/><text x="175" y="190" text-anchor="middle" class="node-title">Sources</text><text x="175" y="224" text-anchor="middle" class="body">Codex CLI · Claude Code</text>
<text x="175" y="248" text-anchor="middle" class="body">Hermes · OMP · OpenClaw</text>
<text x="175" y="272" text-anchor="middle" class="body">local gateways</text></g>
<g><rect x="350" y="150" width="250" height="210" rx="18" fill="#e9e1ff" stroke="#7459a8" stroke-width="3" class="rough"/><rect x="355" y="155" width="240" height="200" rx="14" fill="none" stroke="#7459a8" stroke-opacity=".22" stroke-width="1.5"/><text x="475" y="190" text-anchor="middle" class="node-title">Collector</text><text x="475" y="224" text-anchor="middle" class="body">OpenTelemetry Collector</text>
<text x="475" y="248" text-anchor="middle" class="body">batch · retry · route</text></g>
<g><rect x="660" y="110" width="270" height="130" rx="18" fill="#dcf3e5" stroke="#3f8460" stroke-width="3" class="rough"/><rect x="665" y="115" width="260" height="120" rx="14" fill="none" stroke="#3f8460" stroke-opacity=".22" stroke-width="1.5"/><text x="795" y="150" text-anchor="middle" class="node-title">Prometheus</text><text x="795" y="184" text-anchor="middle" class="body">metrics · counters</text>
<text x="795" y="208" text-anchor="middle" class="body">dedup rules</text></g>
<g><rect x="660" y="270" width="270" height="130" rx="18" fill="#fff0c9" stroke="#a97921" stroke-width="3" class="rough"/><rect x="665" y="275" width="260" height="120" rx="14" fill="none" stroke="#a97921" stroke-opacity=".22" stroke-width="1.5"/><text x="795" y="310" text-anchor="middle" class="node-title">Langfuse</text><text x="795" y="344" text-anchor="middle" class="body">traces · token costs</text>
<text x="795" y="368" text-anchor="middle" class="body">runs on ClickHouse</text></g>
<g><rect x="660" y="430" width="270" height="130" rx="18" fill="#ffe1de" stroke="#a45350" stroke-width="3" class="rough"/><rect x="665" y="435" width="260" height="120" rx="14" fill="none" stroke="#a45350" stroke-opacity=".22" stroke-width="1.5"/><text x="795" y="470" text-anchor="middle" class="node-title">Session stores</text><text x="795" y="504" text-anchor="middle" class="body">JSONL · SQLite originals</text>
<text x="795" y="528" text-anchor="middle" class="body">kept as raw truth</text></g>
<g><rect x="980" y="190" width="250" height="170" rx="18" fill="#dcf3e5" stroke="#3f8460" stroke-width="3" class="rough"/><rect x="985" y="195" width="240" height="160" rx="14" fill="none" stroke="#3f8460" stroke-opacity=".22" stroke-width="1.5"/><text x="1105" y="230" text-anchor="middle" class="node-title">Grafana rooms</text><text x="1105" y="264" text-anchor="middle" class="body">public summary</text>
<text x="1105" y="288" text-anchor="middle" class="body">private full detail</text></g>
  <path d="M 48 674 C 360 670, 620 678, 950 672 S 1160 675, 1230 671" fill="none" stroke="#172033" stroke-width="1.5" stroke-opacity=".18" class="rough"/>
  <text x="640" y="700" text-anchor="middle" class="footer">Postgres holds app state · Redis queues work · MinIO stores blobs · VictoriaMetrics keeps long-term private metrics</text>
</svg>