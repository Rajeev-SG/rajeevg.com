<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Agent, or normal code?</title>
  <desc id="desc">Four questions decide it. Answer honestly and the choice is obvious.</desc>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#e7e2d5"/></pattern>
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="11" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="0.85"/></filter>
    <marker id="arrowEnd" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 9 5 L 0 10 z" fill="#172033"/></marker>
    <style>
      .rough { filter: url(#wobble); }
      .title { font: 700 34px Georgia, serif; fill: #172033; }
      .subtitle { font: 18px Georgia, serif; fill: #566174; }
      .node-title { font: 700 23px "Comic Sans MS", "Bradley Hand", cursive; fill: #172033; }
      .body { font: 16px "Comic Sans MS", "Bradley Hand", cursive; fill: #172033; }
      .arrow-label { font: 14px "Comic Sans MS", "Bradley Hand", cursive; fill: #566174; paint-order: stroke; stroke: #fbfaf5; stroke-width: 7px; }
      .footer { font: 15px Georgia, serif; font-style: italic; fill: #566174; }
    </style>
  </defs>
  <rect width="1280" height="720" fill="#fbfaf5"/>
  <rect width="1280" height="720" fill="url(#dots)" opacity=".68"/>
  <path d="M 48 101 C 330 98, 580 105, 846 100 S 1125 103, 1230 99" fill="none" stroke="#172033" stroke-width="2" stroke-opacity=".18" class="rough"/>
  <text x="48" y="60" class="title">Agent, or normal code?</text>
  <text x="48" y="91" class="subtitle">Four questions decide it. Answer honestly and the choice is obvious.</text>
  <g><path d="M 420 230 C 470 230, 470 195, 520 195" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/><text x="470" y="203.5" text-anchor="middle" class="arrow-label">no</text></g>
<g><path d="M 420 310 C 470 310, 470 395, 520 395" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/><text x="470" y="343.5" text-anchor="middle" class="arrow-label">yes</text></g>
<g><path d="M 840 195 C 885 195, 885 265, 930 265" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/></g>
<g><path d="M 840 395 C 885 395, 885 325, 930 325" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/></g>
  <g><rect x="90" y="170" width="330" height="200" rx="18" fill="#dce8ff" stroke="#4f6fad" stroke-width="3" class="rough"/><rect x="95" y="175" width="320" height="190" rx="14" fill="none" stroke="#4f6fad" stroke-opacity=".22" stroke-width="1.5"/><text x="255" y="210" text-anchor="middle" class="node-title">Ask four questions</text><text x="255" y="244" text-anchor="middle" class="body">is it ambiguous?</text>
<text x="255" y="268" text-anchor="middle" class="body">does it repeat?</text>
<text x="255" y="292" text-anchor="middle" class="body">what does failure cost?</text>
<text x="255" y="316" text-anchor="middle" class="body">who must audit it?</text></g>
<g><rect x="520" y="130" width="320" height="130" rx="18" fill="#dcf3e5" stroke="#3f8460" stroke-width="3" class="rough"/><rect x="525" y="135" width="310" height="120" rx="14" fill="none" stroke="#3f8460" stroke-opacity=".22" stroke-width="1.5"/><text x="680" y="170" text-anchor="middle" class="node-title">Normal code</text><text x="680" y="204" text-anchor="middle" class="body">deterministic · fast</text>
<text x="680" y="228" text-anchor="middle" class="body">cheap · fully auditable</text></g>
<g><rect x="520" y="330" width="320" height="130" rx="18" fill="#fff0c9" stroke="#a97921" stroke-width="3" class="rough"/><rect x="525" y="335" width="310" height="120" rx="14" fill="none" stroke="#a97921" stroke-opacity=".22" stroke-width="1.5"/><text x="680" y="370" text-anchor="middle" class="node-title">Agent</text><text x="680" y="404" text-anchor="middle" class="body">handles ambiguity</text>
<text x="680" y="428" text-anchor="middle" class="body">adapts where rules break</text></g>
<g><rect x="930" y="230" width="280" height="130" rx="18" fill="#ffe1de" stroke="#a45350" stroke-width="3" class="rough"/><rect x="935" y="235" width="270" height="120" rx="14" fill="none" stroke="#a45350" stroke-opacity=".22" stroke-width="1.5"/><text x="1070" y="270" text-anchor="middle" class="node-title">The trap</text><text x="1070" y="304" text-anchor="middle" class="body">agents for what code does better</text>
<text x="1070" y="328" text-anchor="middle" class="body">code for what only judgment solves</text></g>
  <path d="M 48 674 C 360 670, 620 678, 950 672 S 1160 675, 1230 671" fill="none" stroke="#172033" stroke-width="1.5" stroke-opacity=".18" class="rough"/>
  <text x="640" y="700" text-anchor="middle" class="footer">Evidence date: 29 Aug 2026  ·  the honest answer is usually code, with an agent at the edges</text>
</svg>