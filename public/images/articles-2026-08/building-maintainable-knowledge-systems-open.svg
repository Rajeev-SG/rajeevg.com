<text x="1065" y="298" text-anchor="middle" class="body">review dates</text>
<text x="1065" y="322" text-anchor="middle" class="body">one canonical version</text></g>
  <path d="M 48 674 C 360 670, 620 678, 950 672 S 1160 675, 1230 671" fill="none" stroke="#172033" stroke-width="1.5" stroke-opacity=".18" class="rough"/>
  <text x="640" y="700" text-anchor="middle" class="footer">Known: this pipeline runs on real client material. Inferred: the boring structure is what makes it durable.  ·  Evidence date: 2026-08-29</text>
