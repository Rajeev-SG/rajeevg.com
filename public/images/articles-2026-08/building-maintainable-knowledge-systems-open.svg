<g><path d="M 805 300 C 852.5 300, 852.5 300, 900 300" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/></g>
  <g><rect x="50" y="200" width="330" height="200" rx="18" fill="#dce8ff" stroke="#4f6fad" stroke-width="3" class="rough"/><rect x="55" y="205" width="320" height="190" rx="14" fill="none" stroke="#4f6fad" stroke-opacity=".22" stroke-width="1.5"/><text x="215" y="240" text-anchor="middle" class="node-title">Messy input</text><text x="215" y="274" text-anchor="middle" class="body">files · email · decks</text>
<text x="215" y="298" text-anchor="middle" class="body">sheets · meetings</text></g>
