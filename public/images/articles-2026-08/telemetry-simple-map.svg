<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">The telemetry map, simplified</title>
  <desc id="desc">Everything an agent does becomes a signal. Signals flow one way. One room shows the result.</desc>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#e7e2d5"/></pattern>
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="11" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="0.85"/></filter>
    <marker id="arrowEnd" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 9 5 L 0 10 z" fill="#172033"/></marker>
    <style>
      .rough { filter: url(#wobble); }
      .title { font: 700 34px Georgia, serif; fill: #172033; }
      .subtitle { font: 18px Georgia, serif; fill: #566174; }
      .node-title { font: 700 23px "Comic Sans MS", "Bradley Hand", cursive; fill: #172033; }
      .body { font: 16px "Comic Sans MS", "Bradley Hand", cursive; fill: #172033; }
      .arrow-label { font: 14px "Comic Sans MS", "Bradley Hand", cursive; fill: #566174; paint-order: stroke; stroke: #fbfaf5; stroke-width: 7px; }
      .footer { font: 15px Georgia, serif; font-style: italic; fill: #566174; }
    </style>
  </defs>
  <rect width="1280" height="720" fill="#fbfaf5"/>
  <rect width="1280" height="720" fill="url(#dots)" opacity=".68"/>
  <path d="M 48 101 C 330 98, 580 105, 846 100 S 1125 103, 1230 99" fill="none" stroke="#172033" stroke-width="2" stroke-opacity=".18" class="rough"/>
  <text x="48" y="60" class="title">The telemetry map, simplified</text>
  <text x="48" y="91" class="subtitle">Everything an agent does becomes a signal. Signals flow one way. One room shows the result.</text>
  <g><path d="M 390 295 C 435 295, 435 295, 480 295" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/><text x="435" y="286" text-anchor="middle" class="arrow-label">OTLP</text></g>
<g><path d="M 800 260 C 845 260, 845 185, 890 185" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/><text x="845" y="213.5" text-anchor="middle" class="arrow-label">metrics</text></g>
<g><path d="M 800 330 C 845 330, 845 395, 890 395" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrowEnd)" class="rough"/><text x="845" y="353.5" text-anchor="middle" class="arrow-label">traces</text></g>
  <g><rect x="70" y="210" width="320" height="170" rx="18" fill="#dce8ff" stroke="#4f6fad" stroke-width="3" class="rough"/><rect x="75" y="215" width="310" height="160" rx="14" fill="none" stroke="#4f6fad" stroke-opacity=".22" stroke-width="1.5"/><text x="230" y="250" text-anchor="middle" class="node-title">Agents and apps</text><text x="230" y="284" text-anchor="middle" class="body">Codex · Claude Code · Hermes</text>
<text x="230" y="308" text-anchor="middle" class="body">each emits traces, logs, metrics</text></g>
<g><rect x="480" y="210" width="320" height="170" rx="18" fill="#e9e1ff" stroke="#7459a8" stroke-width="3" class="rough"/><rect x="485" y="215" width="310" height="160" rx="14" fill="none" stroke="#7459a8" stroke-opacity=".22" stroke-width="1.5"/><text x="640" y="250" text-anchor="middle" class="node-title">Collector</text><text x="640" y="284" text-anchor="middle" class="body">receives and routes signals</text>
<text x="640" y="308" text-anchor="middle" class="body">nothing talks straight to storage</text></g>
<g><rect x="890" y="120" width="310" height="130" rx="18" fill="#dcf3e5" stroke="#3f8460" stroke-width="3" class="rough"/><rect x="895" y="125" width="300" height="120" rx="14" fill="none" stroke="#3f8460" stroke-opacity=".22" stroke-width="1.5"/><text x="1045" y="160" text-anchor="middle" class="node-title">Metrics + dashboards</text><text x="1045" y="194" text-anchor="middle" class="body">Prometheus · Grafana</text></g>
<g><rect x="890" y="330" width="310" height="130" rx="18" fill="#fff0c9" stroke="#a97921" stroke-width="3" class="rough"/><rect x="895" y="335" width="300" height="120" rx="14" fill="none" stroke="#a97921" stroke-opacity=".22" stroke-width="1.5"/><text x="1045" y="370" text-anchor="middle" class="node-title">Traces + costs</text><text x="1045" y="404" text-anchor="middle" class="body">Langfuse on ClickHouse</text></g>
  <path d="M 48 674 C 360 670, 620 678, 950 672 S 1160 675, 1230 671" fill="none" stroke="#172033" stroke-width="1.5" stroke-opacity=".18" class="rough"/>
  <text x="640" y="700" text-anchor="middle" class="footer">Evidence date: 29 Aug 2026  ·  one door in, one room out, no agent modifies its own telemetry</text>
</svg>